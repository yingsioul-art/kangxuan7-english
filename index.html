<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七上英文（康軒）</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f4f7fc; --card:#fff; --ink:#1e293b; --sub:#64748b; --line:#dbe3ef;
  --pri:#2563eb; --pri2:#dbeafe; --ok:#16a34a; --okbg:#dcfce7; --ng:#dc2626; --ngbg:#fee2e2;
  --warn:#b45309; --warnbg:#fef3c7; --hl:#fbcfe8; --chip:#eef2ff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --sub:#94a3b8; --line:#334155;
    --pri:#60a5fa; --pri2:#1e3a5f; --ok:#4ade80; --okbg:#14532d; --ng:#f87171; --ngbg:#7f1d1d;
    --warn:#fbbf24; --warnbg:#78350f; --hl:#831843; --chip:#312e81; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#app{max-width:760px;margin:0 auto;padding:12px 16px 80px}
header.top{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
header.top .back{border:0;background:var(--card);color:var(--pri);font-size:16px;padding:8px 12px;border-radius:10px;cursor:pointer;box-shadow:0 1px 2px #0002}
header.top h1{font-size:19px;margin:0;flex:1;line-height:1.3}
h2{font-size:18px;margin:18px 0 8px}
h3{font-size:16px;margin:14px 0 6px}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001;border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;box-shadow:0 1px 3px #0001}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:26px;display:block}
.tile b{display:block;font-size:16px;margin-top:4px}
.tile small{color:var(--sub);font-size:13px;display:block;line-height:1.4;margin-top:2px}
.tile.off{opacity:.45;cursor:default}
.btn{border:0;background:var(--pri);color:#fff;font:inherit;font-size:16px;padding:10px 16px;border-radius:10px;cursor:pointer;margin:4px 6px 4px 0}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.small{font-size:14px;padding:6px 10px}
.btn:disabled{opacity:.4}
.say{border:0;background:var(--pri2);color:var(--pri);border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;flex:none}
table{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--pri2)}
th:first-child,td:first-child{white-space:nowrap}
.tablewrap{overflow-x:auto}
.word{display:flex;gap:10px;align-items:flex-start;border-bottom:1px dashed var(--line);padding:10px 0}
.word:last-child{border:0}
.word .w{font-size:20px;font-weight:700}
.word .pos{color:var(--pri);font-weight:600;margin:0 4px}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--ink);margin:2px 4px 2px 0}
.badge.cap{background:var(--warnbg);color:var(--warn)}
.badge.pl{background:var(--okbg);color:var(--ok)}
.badge.irr{background:var(--ngbg);color:var(--ng)}
.eg{display:block;color:var(--sub);font-size:15px}
.line{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.line .sp{font-weight:700;min-width:44px;color:var(--pri)}
.line .hl{background:linear-gradient(transparent 55%,var(--hl) 55%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.line .zh{color:var(--sub);font-size:15px}
.note{background:var(--warnbg);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:6px 0}
.chipw{padding:8px 12px;border-radius:10px;background:var(--chip);font-size:18px;font-weight:600;transition:all .35s;border:2px solid transparent}
.chipw.on{background:var(--hl);border-color:var(--ng);transform:translateY(-4px)}
.stepnote{min-height:48px;font-size:15px}
.bubble{border-radius:14px;padding:10px 12px;margin:8px 0;max-width:92%}
.bubble.t{background:var(--pri2)}
.bubble.ok{background:var(--okbg);margin-left:auto}
.bubble.ng{background:var(--warnbg);margin-left:auto}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;padding:10px 12px;border-radius:12px;cursor:pointer}
.opt.big{font-size:42px;text-align:center;padding:6px}
.opts.pic{grid-template-columns:repeat(3,1fr)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default}
.q{font-size:19px;line-height:1.6}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--ink)}
input.ans{font:inherit;font-size:20px;width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:10px}
.fb{border-radius:12px;padding:10px 12px;margin-top:10px}
.fb.ok{background:var(--okbg)} .fb.ng{background:var(--ngbg)} .fb.warn{background:var(--warnbg)}
.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 10px}
.prog i{display:block;height:100%;background:var(--pri)}
.passage{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:16px;margin-bottom:10px;max-height:45vh;overflow:auto}
.passage .gloss{font-size:13px;color:var(--sub);margin-top:6px}
table.info td,table.info th{font-size:14px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ng)}
.tree svg{width:100%;height:auto;display:block}
.tree .pn{cursor:pointer}
.relbox{min-height:64px}
.big{font-size:22px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub)}
details summary{cursor:pointer;color:var(--pri)}
.center{text-align:center}
.score{font-size:44px;font-weight:800;color:var(--pri)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = {"lesson": {"id": "L1", "title": "Lesson 1　Who's That Young Man?", "sub": "課本 p.9–22｜初次見面・請多指教｜Nick 這一家"}, "concepts": {"V-SP": {"name": "單字拼字", "g": "", "tip": "聽到發音先拆音節，再對照字母。容易錯的字：handsome（d 不發音）、cousin（ou 唸 /ʌ/）、daughter（gh 不發音）、junior。"}, "V-POS": {"name": "詞性", "g": "", "tip": "人、事、物＝<b>n.</b>（名詞）；形容人事物的樣子＝<b>adj.</b>（形容詞）；動作＝<b>v.</b>（動詞）。看例句裡這個字在做什麼。"}, "V-ZH": {"name": "中文字義", "g": "", "tip": "把例句整句讀一遍，再決定字義。英文一個字常有好幾個意思，例如 short＝矮的／短的。"}, "PL-REG": {"name": "規則複數", "g": "plural", "tip": "一般加 <b>-s</b>；字尾 s、x、sh、ch 加 <b>-es</b>（class→classes）；子音＋y 改 y 為 i 加 <b>-es</b>（family→families）；f／fe 改 <b>-ves</b>（wife→wives）。"}, "PL-IRR": {"name": "特殊複數", "g": "plural", "tip": "不加 s 的字要整個背：man→<b>men</b>、woman→<b>women</b>、child→<b>children</b>。🔴 不可以寫 mans、childs、childrens。"}, "BE-AGR": {"name": "主詞和 be 動詞的搭配", "g": "be-agr", "tip": "I 配 <b>am</b>；you 和所有複數（we、they、兩個人以上）配 <b>are</b>；he、she、it、一個人名配 <b>is</b>。先找主詞，再數是一個還是很多個。"}, "BE-NEG": {"name": "否定句 not 的位置", "g": "be-pos", "tip": "not 永遠放在 be 動詞的<b>後面</b>：He is <b>not</b>…。I am not 只能縮成 <b>I'm not</b>，沒有 amn't。"}, "BE-Q": {"name": "問句 be 動詞的位置", "g": "be-pos", "tip": "把 be 動詞<b>搬到句首</b>，其他字順序不動，句尾改問號：He is a cook. → <b>Is</b> he a cook? 有 be 動詞就<b>不要</b>加 do。"}, "BE-ANS": {"name": "簡答", "g": "be-pos", "tip": "Yes／No 後面用<b>代名詞</b>（he／she／they），不用人名。肯定簡答<b>不能縮寫</b>：Yes, he is.（✗ Yes, he's.）；否定可以：No, he isn't."}, "POSS": {"name": "所有格", "g": "poss", "tip": "後面<b>接名詞</b>、要說「誰的」就用所有格：my、your、his、her、its、our、their；人名加 <b>'s</b>（Nick's）。🔴 its＝牠的，it's＝it is。"}, "PRON": {"name": "人稱代名詞", "g": "poss", "tip": "當主詞、後面接 be 動詞 → 用 I／you／he／she／it／we／they。男生 he、女生 she、動物或東西 it、兩個以上 they。"}, "FAM-WORD": {"name": "稱謂單字", "g": "family", "tip": "男女成對背：father／mother、son／daughter、brother／sister、uncle／aunt、husband／wife、grandson／granddaughter。cousin 不分男女。"}, "FAM-FLIP": {"name": "換角度的親屬關係", "g": "family", "tip": "A is B's father → 反過來 B is A's son／daughter。換角度時看<b>新的主詞是男是女</b>，再找成對的那個字。"}, "WH": {"name": "疑問詞選擇", "g": "wh", "tip": "問<b>人</b>用 Who；問<b>東西、名字、職業</b>用 What；問<b>年紀</b>用 How old。看答句在回答什麼，就知道問句用哪個字。Who 問句不能用 Yes／No 回答。"}, "DEM": {"name": "this／that／these／those", "g": "", "tip": "this、that 是一個；these、those 是兩個以上。回答時 this／that 用 it，these／those 用 they。（Lesson 2 正式教）"}, "PHR": {"name": "片語", "g": "", "tip": "片語要整組背，中間的字不能省：take care <b>of</b>、Nice to meet you, <b>too</b>、be <b>from</b>。"}, "MULTI": {"name": "一字多義", "g": "", "tip": "同一個字在不同句子裡意思和詞性會變，例如 cook 是「廚師」(n.)，也可以是「煮」(v.)。先看這個字前面有沒有 a／the（有＝名詞）。"}, "ORDER": {"name": "句子語序", "g": "adj", "tip": "形容詞放在名詞<b>前面</b>：a <b>tall</b> boy（✗ a boy tall）。冠詞 a／an 放在最前面：a tall boy。"}, "A-AN": {"name": "a／an", "g": "a-an", "tip": "看<b>緊接在後面那個字</b>的發音：母音開頭用 <b>an</b>（an old man、an aunt），子音開頭用 <b>a</b>（a young man）。"}, "CONJ": {"name": "and／but／too", "g": "conj", "tip": "意思一樣、往同方向 → <b>and</b>；意思相反 → <b>but</b>；「也」放句尾、前面加逗號 → <b>, too</b>。"}, "MECH": {"name": "大小寫和標點", "g": "mech", "tip": "①句首第一個字母大寫 ②人名、I 永遠大寫 ③句尾一定要有句點或問號。段考翻譯題沒寫標點會扣分。"}}, "words": [{"sec": "親屬", "w": "family", "pos": "n.", "zh": "家人；家庭", "ex": "My family is warm.", "exz": "我的家庭很溫暖。", "pl": "families", "plr": "ies", "der": ["the Lin family 林家（＝the Lins）", "family name 姓氏"], "note": "the Lin family 後面接 is；the Lins 後面接 are", "tex": "", "posq": true, "cap": 45}, {"sec": "親屬", "w": "father", "pos": "n.", "zh": "父親", "ex": "My father is a nurse.", "exz": "我爸爸是護理師。", "pl": "fathers", "plr": "s", "der": ["dad 爸爸（口語）", "grandfather 祖父"], "note": "", "tex": "Paul is my father.", "posq": true, "cap": 15}, {"sec": "親屬", "w": "dad", "pos": "n.", "zh": "爸爸", "ex": "My dad is tall.", "exz": "我爸爸很高。", "pl": "dads", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 8}, {"sec": "親屬", "w": "mother", "pos": "n.", "zh": "母親", "ex": "My mother is a doctor.", "exz": "我媽媽是醫生。", "pl": "mothers", "plr": "s", "der": ["mom 媽媽（口語）", "grandmother 祖母"], "note": "", "tex": "Lily is my mother.", "posq": true, "cap": 14}, {"sec": "親屬", "w": "mom", "pos": "n.", "zh": "媽媽", "ex": "My mom is beautiful.", "exz": "我媽媽很漂亮。", "pl": "moms", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 15}, {"sec": "親屬", "w": "parent", "pos": "n.", "zh": "雙親之一", "ex": "My parents are nice.", "exz": "我的爸媽人很好。", "pl": "parents", "plr": "s", "der": ["parents 父母（兩個人）", "grandparent 祖父母之一"], "note": "爸爸＋媽媽兩個人要用 parents", "tex": "", "posq": true, "cap": 24}, {"sec": "親屬", "w": "brother", "pos": "n.", "zh": "哥哥；弟弟", "ex": "Eddie is my brother.", "exz": "Eddie 是我的哥哥。", "pl": "brothers", "plr": "s", "der": [], "note": "英文不分哥哥、弟弟", "tex": "Eddie is my brother.", "posq": true, "cap": 17}, {"sec": "親屬", "w": "sister", "pos": "n.", "zh": "姊姊；妹妹", "ex": "Bella is my sister.", "exz": "Bella 是我的姊姊。", "pl": "sisters", "plr": "s", "der": [], "note": "英文不分姊姊、妹妹", "tex": "", "posq": true, "cap": 15}, {"sec": "親屬", "w": "son", "pos": "n.", "zh": "兒子", "ex": "Nick is Paul's son.", "exz": "Nick 是 Paul 的兒子。", "pl": "sons", "plr": "s", "der": ["grandson 孫子"], "note": "", "tex": "", "posq": true, "cap": 10}, {"sec": "親屬", "w": "daughter", "pos": "n.", "zh": "女兒", "ex": "Bella is Lily's daughter.", "exz": "Bella 是 Lily 的女兒。", "pl": "daughters", "plr": "s", "der": ["granddaughter 孫女"], "note": "gh 不發音", "tex": "", "posq": true, "cap": 8}, {"sec": "親屬", "w": "child", "pos": "n.", "zh": "孩子", "ex": "The child is cute.", "exz": "那個孩子很可愛。", "pl": "children", "plr": "irr", "der": ["grandchild 孫子女", "children 孩子們（複數）"], "note": "複數是 children，不加 s", "tex": "", "posq": true, "cap": 32}, {"sec": "親屬", "w": "husband", "pos": "n.", "zh": "丈夫", "ex": "Paul is Lily's husband.", "exz": "Paul 是 Lily 的丈夫。", "pl": "husbands", "plr": "s", "der": [], "note": "", "tex": "This is my husband, Paul.", "posq": true, "cap": 2}, {"sec": "親屬", "w": "wife", "pos": "n.", "zh": "妻子", "ex": "Lily is Paul's wife.", "exz": "Lily 是 Paul 的妻子。", "pl": "wives", "plr": "ves", "der": [], "note": "f／fe 結尾改 -ves", "tex": "This is my wife, Lily.", "posq": true, "cap": 8}, {"sec": "親屬", "w": "grandfather", "pos": "n.", "zh": "祖父；外祖父", "ex": "My grandfather is seventy-five.", "exz": "我爺爺七十五歲。", "pl": "grandfathers", "plr": "s", "der": ["grandpa 爺爺（口語）", "grand- 字首＝隔一代"], "note": "", "tex": "My grandfather is a farmer.", "posq": true, "cap": 4}, {"sec": "親屬", "w": "grandmother", "pos": "n.", "zh": "祖母；外祖母", "ex": "My grandmother is a cook.", "exz": "我奶奶是廚師。", "pl": "grandmothers", "plr": "s", "der": ["grandma 奶奶（口語）"], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "親屬", "w": "grandson", "pos": "n.", "zh": "孫子", "ex": "Nick is Dave's grandson.", "exz": "Nick 是 Dave 的孫子。", "pl": "grandsons", "plr": "s", "der": ["grand-＋son"], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "親屬", "w": "granddaughter", "pos": "n.", "zh": "孫女", "ex": "Ann is Tina's granddaughter.", "exz": "Ann 是 Tina 的孫女。", "pl": "granddaughters", "plr": "s", "der": ["grand-＋daughter"], "note": "中間有兩個 d", "tex": "", "posq": true, "cap": 0}, {"sec": "親屬", "w": "uncle", "pos": "n.", "zh": "叔叔；伯伯；舅舅；姑丈；姨丈", "ex": "Frank is Nick's uncle.", "exz": "Frank 是 Nick 的叔叔。", "pl": "uncles", "plr": "s", "der": [], "note": "英文一個字全包", "tex": "", "posq": true, "cap": 4}, {"sec": "親屬", "w": "aunt", "pos": "n.", "zh": "嬸嬸；伯母；姑姑；阿姨；舅媽", "ex": "Mia is Nick's aunt.", "exz": "Mia 是 Nick 的嬸嬸。", "pl": "aunts", "plr": "s", "der": [], "note": "母音開頭，前面用 an：an aunt", "tex": "", "posq": true, "cap": 4}, {"sec": "親屬", "w": "cousin", "pos": "n.", "zh": "堂（表）兄弟姊妹", "ex": "Ann is Nick's cousin.", "exz": "Ann 是 Nick 的堂妹。", "pl": "cousins", "plr": "s", "der": [], "note": "不分男女、不分堂表；ou 唸 /ʌ/", "tex": "This is Nick. He's my cousin.", "posq": true, "cap": 0}, {"sec": "人物外表", "w": "man", "pos": "n.", "zh": "男人", "ex": "That man is my uncle.", "exz": "那個男人是我叔叔。", "pl": "men", "plr": "irr", "der": ["men 男人們（複數）", "young man 年輕男子"], "note": "複數 men，不加 s", "tex": "Who's that young man?", "posq": true, "cap": 34}, {"sec": "人物外表", "w": "woman", "pos": "n.", "zh": "女人", "ex": "She is a beautiful woman.", "exz": "她是個美麗的女人。", "pl": "women", "plr": "irr", e": "", "tex": "", "posq": false, "cap": 83}, {"sec": "功能字", "w": "our", "pos": "pron.", "zh": "我們的", "ex": "He's our new PE teacher.", "exz": "他是我們的新體育老師。", "pl": "", "plr": "none", "der": ["we 我們 → our 我們的"], "note": "", "tex": "", "posq": false, "cap": 51}], "texts": [{"id": "d1", "title": "Dialogue 1（At school）", "src": "課本 p.11", "lines": [{"sp": "Ann", "en": "Good morning, Nick.", "zh": "早安，Nick。", "hl": false, "note": ""}, {"sp": "Nick", "en": "Good morning, Ann.", "zh": "早安，Ann。", "hl": false, "note": ""}, {"sp": "Ann", "en": "Nick, who's that young man? He's tall and handsome.", "zh": "Nick，那位年輕男子是誰？他又高又帥。", "hl": true, "note": "who's＝who is；He's＝He is。tall and handsome：兩個形容詞用 and 連起來。"}, {"sp": "Nick", "en": "He's our new PE teacher.", "zh": "他是我們的新體育老師。", "hl": true, "note": "our 是「我們的」，後面接名詞 teacher。"}, {"sp": "Ann", "en": "Really?", "zh": "真的嗎？", "hl": false, "note": ""}, {"sp": "Nick", "en": "Yes, he's Bella's friend, and his name is Scott.", "zh": "是的，他是 Bella 的朋友，他的名字叫 Scott。", "hl": false, "note": "同一句有兩種 's：he's＝he is；Bella's＝Bella 的（所有格）。he → his（他的）。"}]}, {"id": "d2", "title": "Dialogue 2（In the classroom）", "src": "課本 p.12", "lines": [{"sp": "Rita", "en": "Ann, we're in the same class again!", "zh": "Ann，我們又同班了！", "hl": true, "note": "the same class：same 前面要加 the。"}, {"sp": "Ann", "en": "Yeah, it's great! Hi, Rita. This is Nick. He's my cousin. He's in Class 701.", "zh": "對啊，太棒了！嗨，Rita。這是 Nick，他是我的堂哥。他在 701 班。", "hl": true, "note": "介紹別人：This is…＋He's…。"}, {"sp": "Rita", "en": "Nice to meet you, Nick. I'm Rita.", "zh": "很高興認識你，Nick。我是 Rita。", "hl": false, "note": ""}, {"sp": "Nick", "en": "Nice to meet you, too, Rita.", "zh": "我也很高興認識妳，Rita。", "hl": false, "note": "回答 Nice to meet you. 要加 too。"}, {"sp": "Ann", "en": "Hey, Rita. Good news! Bella is our English teacher!", "zh": "嘿，Rita。好消息！Bella 是我們的英文老師！", "hl": false, "note": ""}, {"sp": "Nick", "en": "Oh, no. That's not good.", "zh": "喔，不。那可不妙。", "hl": false, "note": ""}, {"sp": "Ann", "en": "What's the problem? She's a great teacher.", "zh": "有什麼問題？她是很棒的老師。", "hl": false, "note": ""}, {"sp": "Nick", "en": "Well... she's a strict teacher, too.", "zh": "嗯……她也是個嚴格的老師。", "hl": false, "note": ""}, {"sp": "Bella", "en": "Nick!", "zh": "Nick！", "hl": false, "note": ""}]}, {"id": "rd", "title": "Reading〈The Lins〉", "src": "課本 p.17", "lines": [{"sp": "", "en": "Hi, I'm Nick. I'm a junior high school student. I'm from a warm family.", "zh": "嗨，我是 Nick。我是國中生。我來自一個溫暖的家庭。", "hl": true, "note": "the Lins＝林家人，後面接複數 are；the Lin family＝林家，後面接單數 is。"}, {"sp": "", "en": "My grandfather is a farmer. My grandmother is a cook. They are nice.", "zh": "我的祖父是農夫。我的祖母是廚師。他們人很好。", "hl": false, "note": "主詞換成 They，be 動詞就要用 are。"}, {"sp": "", "en": "Paul is my father. He is a tall man. He is a nurse.", "zh": "Paul 是我的爸爸。他是個高個子的男人。他是護理師。", "hl": false, "note": ""}, {"sp": "", "en": "Lily is my mother. She is a beautiful woman. She is a doctor.", "zh": "Lily 是我的媽媽。她是個美麗的女人。她是醫生。", "hl": true, "note": ""}, {"sp": "", "en": "Bella is my sister. She is my English teacher, too.", "zh": "Bella 是我的姊姊。她也是我的英文老師。", "hl": false, "note": ""}, {"sp": "", "en": "Eddie is my brother. He's a senior high school student.", "zh": "Eddie 是我的哥哥。他是高中生。", "hl": false, "note": ""}, {"sp": "", "en": "Abby is our pet pig. She's cute.", "zh": "Abby 是我們的寵物豬。牠很可愛。", "hl": false, "note": ""}]}, {"id": "ru", "title": "Read Up〈The Park Family〉", "src": "課本 p.21（選讀）", "lines": [{"sp": "", "en": "Hi, I'm Gina Park. I'm a junior high school student.", "zh": "嗨，我是 Gina Park。我是國中生。", "hl": false, "note": ""}, {"sp": "", "en": "My dad is a firefighter, and my mom is a teacher.", "zh": "我爸爸是消防員，我媽媽是老師。", "hl": false, "note": ""}, {"sp": "", "en": "I have two brothers and one sister.", "zh": "我有兩個哥哥和一個姊姊。", "hl": false, "note": ""}, {"sp": "", "en": "My brothers work at a zoo. They take care of the animals there.", "zh": "我的哥哥們在動物園工作。他們在那裡照顧動物。", "hl": false, "note": "there＝前一句的 a zoo（代詞指涉，會考題型）。take care of＝照顧。"}, {"sp": "", "en": "My sister is a waste collector. They are my family. What about your family?", "zh": "我姊姊是清潔隊員。他們是我的家人。你的家人呢？", "hl": false, "note": ""}]}], "familyNick": {"id": "nick", "title": "Nick's Family（課本 p.9）", "people": [{"id": "Dave", "sex": "m", "age": 75, "x": 3.5, "y": 0, "par": [], "sp": "Tina"}, {"id": "Tina", "sex": "f", "age": 72, "x": 4.5, "y": 0, "par": [], "sp": "Dave"}, {"id": "Lily", "sex": "f", "age": 48, "x": 1.5, "y": 1, "par": [], "sp": "Paul"}, {"id": "Paul", "sex": "m", "age": 50, "x": 2.5, "y": 1, "par": ["Dave", "Tina"], "sp": "Lily"}, {"id": "Frank", "sex": "m", "age": 46, "x": 5.5, "y": 1, "par": ["Dave", "Tina"], "sp": "Mia"}, {"id": "Mia", "sex": "f", "age": 40, "x": 6.5, "y": 1, "par": [], "sp": "Frank"}, {"id": "Bella", "sex": "f", "age": 25, "x": 1, "y": 2, "par": ["Paul", "Lily"], "sp": ""}, {"id": "Eddie", "sex": "m", "age": 17, "x": 2, "y": 2, "par": ["Paul", "Lily"], "sp": ""}, {"id": "Nick", "sex": "m", "age": 12, "x": 3, "y": 2, "par": ["Paul", "Lily"], "sp": ""}, {"id": "Henry", "sex": "m", "age": 6, "x": 5.5, "y": 2, "par": ["Frank", "Mia"], "sp": ""}, {"id": "Ann", "sex": "f", "age": 12, "x": 6.5, "y": 2, "par": ["Frank", "Mia"], "sp": ""}]}, "familyWang": {"id": "wang", "title": "The Wang Family", "people": [{"id": "Tom", "sex": "m", "age": 66, "x": 3.5, "y": 0, "par": [], "sp": "Amy"}, {"id": "Amy", "sex": "f", "age": 63, "x": 4.5, "y": 0, "par": [], "sp": "Tom"}, {"id": "Lisa", "sex": "f", "age": 38, "x": 1.5, "y": 1, "par": [], "sp": "Ben"}, {"id": "Ben", "sex": "m", "age": 40, "x": 2.5, "y": 1, "par": ["Tom", "Amy"], "sp": "Lisa"}, {"id": "Grace", "sex": "f", "age": 35, "x": 5.5, "y": 1, "par": ["Tom", "Amy"], "sp": "Sam"}, {"id": "Sam", "sex": "m", "age": 37, "x": 6.5, "y": 1, "par": [], "sp": "Grace"}, {"id": "Kevin", "sex": "m", "age": 14, "x": 1.5, "y": 2, "par": ["Ben", "Lisa"], "sp": ""}, {"id": "Nina", "sex": "f", "age": 11, "x": 2.5, "y": 2, "par": ["Ben", "Lisa"], "sp": ""}, {"id": "Ella", "sex": "f", "age": 9, "x": 6, "y": 2, "par": ["Grace", "Sam"], "sp": ""}]}, "grammar": [{"id": "be-agr", "name": "be 動詞的搭配", "icon": "🔗", "c": ["BE-AGR"], "intro": "be 動詞有三個長相：am、is、are。用哪一個，<b>完全由主詞決定</b>。", "table": [["主詞", "be 動詞", "例句"], ["I", "am", "I <b>am</b> Nick."], ["he／she／it／一個人名", "is", "Ann <b>is</b> my cousin."], ["you", "are", "You <b>are</b> my friend."], ["we／they／兩個人以上", "are", "Ann and Henry <b>are</b> cousins."]], "flows": [{"title": "主詞從一個變成兩個", "steps": [{"tokens": ["Ann", "is", "my", "cousin", "."], "hl": [0, 1], "note": "主詞 Ann 是<b>一個人</b> → 用 is"}, {"tokens": ["Ann", "and", "Henry", "are", "my", "cousins", "."], "hl": [0, 1, 2, 3], "note": "主詞變成 Ann and Henry＝<b>兩個人</b> → is 要改成 are"}, {"tokens": ["They", "are", "my", "cousins", "."], "hl": [0, 1], "note": "兩個人可以用 They 代替 → 還是 are；cousin 也要加 s"}]}, {"title": "the Lins 和 the Lin family（課堂筆記）", "steps": [{"tokens": ["The", "Lins", "are", "nice", "."], "hl": [1, 2], "note": "the Lins＝林家的<b>每一個人</b>（複數）→ are"}, {"tokens": ["The", "Lin", "family", "is", "warm", "."], "hl": [2, 3], "note": "the Lin family＝林家這<b>一個</b>家庭 → is"}]}], "tutor": [{"say": "先考你：「Nick and Eddie ___ brothers.」空格要填什麼？", "ch": [{"t": "is", "ok": false, "re": "Nick and Eddie 是幾個人？兩個喔！一個人才用 is。"}, {"t": "are", "ok": true, "re": "對！兩個人以上就用 are。你是先數主詞才決定的，這就是訣竅。"}, {"t": "am", "ok": false, "re": "am 只跟 I 在一起。這裡的主詞是 Nick and Eddie。"}]}, {"say": "那「My family ___ warm.」呢？family 裡面明明有很多人……", "ch": [{"t": "are", "ok": false, "re": "陷阱！family 指的是「一個家庭」，算一個 → is。如果是 the Lins（林家每個人）才用 are。"}, {"t": "is", "ok": true, "re": "沒錯！family＝一個家庭，用 is。課本 The Lins 那課的筆記就是在講這個。"}]}, {"say": "最後一題：「You and I ___ in the same class.」", "ch": [{"t": "am", "ok": false, "re": "I 單獨出現才用 am。You and I 是兩個人＝we。"}, {"t": "are", "ok": true, "re": "對！You and I＝we，用 are。主詞裡有 I 也不一定用 am，要看整個主詞。"}, {"t": "is", "ok": false, "re": "兩個人不會用 is 喔。"}]}]}, {"id": "be-pos", "name": "be 動詞的位置（否定・問句・簡答）", "icon": "🔀", "c": ["BE-NEG", "BE-Q", "BE-ANS"], "intro": "同一個句子可以變出四種樣子。<b>其他字都不動，只有 be 動詞在搬家</b>，跟著字卡一步一步看。", "table": [["句型", "怎麼變", "例句"], ["直述句", "主詞＋be", "He <b>is</b> a cook."], ["否定句", "be 後面加 not", "He <b>is not</b> a cook.（＝He isn't／He's not）"], ["問句", "be 搬到句首，句尾改問號", "<b>Is</b> he a cook?"], ["簡答", "Yes／No＋代名詞＋be", "Yes, he <b>is</b>.／No, he <b>isn't</b>."]], "flows": [{"title": "直述句 → 否定句", "steps": [{"tokens": ["He", "is", "a", "cook", "."], "hl": [1], "note": "直述句：找到 be 動詞 <b>is</b>"}, {"tokens": ["He", "is", "not", "a", "cook", "."], "hl": [2], "note": "否定句：在 is 的<b>後面</b>插入 not"}, {"tokens": ["He", "isn't", "a", "cook", "."], "hl": [1], "note": "is not 可以縮成 <b>isn't</b>"}]}, {"title": "直述句 → 問句 → 簡答", "steps": [{"tokens": ["He", "is", "a", "cook", "."], "hl": [1], "note": "直述句：找到 be 動詞 <b>is</b>"}, {"tokens": ["Is", "he", "a", "cook", "?"], "hl": [0, 4], "note": "問句：is 搬到<b>句首</b>（大寫 Is），he 變小寫，句點改<b>問號</b>"}, {"tokens": ["Yes", ",", "he", "is", "."], "hl": [2, 3], "note": "肯定簡答：Yes, he is.（🔴 不能縮成 he's）"}, {"tokens": ["No", ",", "he", "isn't", "."], "hl": [3], "note": "否定簡答：No, he isn't.（可以縮寫）"}]}, {"title": "主詞是人名時的簡答", "steps": [{"tokens": ["Is", "Bella", "your", "sister", "?"], "hl": [1], "note": "問句的主詞是人名 Bella"}, {"tokens": ["Yes", ",", "she", "is", "."], "hl": [2], "note": "簡答要把 Bella 換成<b>代名詞</b> she"}]}, {"title": "I 的否定句", "steps": [{"tokens": ["I", "am", "a", "student", "."], "hl": [1], "note": "I 配 am"}, {"tokens": ["I", "am", "not", "a", "teacher", "."], "hl": [2], "note": "否定：am 後面加 not"}, {"tokens": ["I'm", "not", "a", "teacher", "."], "hl": [0], "note": "只能縮成 <b>I'm not</b>（🔴 沒有 amn't）"}]}], "tutor": [{"say": "「She is your aunt.」要改成問句，第一步做什麼？", "ch": [{"t": "在句首加 Do", "ok": false, "re": "有 be 動詞就不需要 do。Do 是一般動詞用的（七下才學）。"}, {"t": "把 is 搬到句首", "ok": true, "re": "對！Is she your aunt? 其他字的順序都不動。"}, {"t": "把 she 搬到句尾", "ok": false, "re": "主詞不用動喔，搬家的只有 be 動詞。"}]}, {"say": "「Is Frank Henry's father?」肯定的簡答是哪一個？", "ch": [{"t": "Yes, Frank is.", "ok": false, "re": "簡答要用代名詞，不重複人名。Frank 是男生 → he。"}, {"t": "Yes, he's.", "ok": false, "re": "🔴 肯定簡答不能縮寫，這是段考最愛考的陷阱。"}, {"t": "Yes, he is.", "ok": true, "re": "完美！代名詞 he＋不縮寫的 is。"}]}, {"say": "「I am a cook.」改否定，下面哪一個是錯的？", "ch": [{"t": "I am not a cook.", "ok": false, "re": "這個是對的喔，再看看其他選項。"}, {"t": "I'm not a cook.", "ok": false, "re": "這個也對，I am → I'm。"}, {"t": "I amn't a cook.", "ok": true, "re": "答對了，這個是錯的！am not 不能縮成 amn't。"}]}]}, {"id": "poss", "name": "所有格和代名詞", "icon": "👜", "c": ["POSS", "PRON"], "intro": "你覺得所有格很難，是因為不知道<b>什麼時候要用</b>。其實只要看一件事：<b>後面有沒有接名詞</b>。", "table": [["主格（當主詞）", "所有格（誰的）", "例句"], ["I", "my", "<b>My</b> name is Nick."], ["you", "your", "Is this <b>your</b> pig?"], ["he", "his", "<b>His</b> name is Scott."], ["she", "her", "<b>Her</b> name is Rita."], ["it", "its", "<b>Its</b> name is Abby."], ["we", "our", "He's <b>our</b> teacher."], ["they", "their", "<b>Their</b> son is Nick."], ["人名 Nick", "Nick's", "Dave is <b>Nick's</b> grandfather."]], "flows": [{"title": "判斷：要用 he 還是 his？", "steps": [{"tokens": ["___", "is", "tall", "."], "hl": [0], "note": "空格後面是 <b>is</b>（be 動詞）→ 這裡需要一個「主詞」"}, {"tokens": ["He", "is", "tall", "."], "hl": [0], "note": "主詞 → 用主格 <b>He</b>"}, {"tokens": ["___", "name", "is", "Scott", "."], "hl": [0, 1], "note": "空格後面是 <b>name</b>（名詞）→ 要說「誰的」名字"}, {"tokens": ["His", "name", "is", "Scott", "."], "hl": [0], "note": "名詞前面 → 用所有格 <b>His</b>"}]}, {"title": "一句話裡的兩種 's（課本 p.11）", "steps": [{"tokens": ["he's", "Bella's", "friend"], "hl": [0], "note": "<b>he's</b>＝he is（後面沒有名詞，是縮寫）"}, {"tokens": ["he's", "Bella's", "friend"], "hl": [1], "note": "<b>Bella's</b>＋friend（後面有名詞）＝Bella 的朋友（所有格）"}]}, {"title": "its 和 it's", "steps": [{"tokens": ["It's", "my", "pig", "."], "hl": [0], "note": "<b>It's</b>＝It is（有撇號＝縮寫）"}, {"tokens": ["Its", "name", "is", "Abby", "."], "hl": [0, 1], "note": "<b>Its</b>＋name＝牠的名字（沒撇號＝所有格）"}]}, {"title": "兩個人的所有格", "steps": [{"tokens": ["Paul", "and", "Lily", "are", "Nick's", "parents", "."], "hl": [4], "note": "Nick's＝Nick 的"}, {"tokens": ["Their", "son", "is", "Nick", "."], "hl": [0], "note": "Paul and Lily 是兩個人 → 他們的＝<b>Their</b>"}]}], "tutor": [{"say": "「Ann is my cousin. ___ is twelve.」空格後面是什麼？", "ch": [{"t": "是名詞", "ok": false, "re": "再看一次，空格後面是 is。"}, {"t": "是 be 動詞 is", "ok": true, "re": "對！後面是 be 動詞，所以要一個主詞。Ann 是女生 → She。"}]}, {"say": "那「Ann is my cousin. ___ mother is Mia.」呢？", "ch": [{"t": "She", "ok": false, "re": "空格後面是 mother（名詞），要說「她的」媽媽。"}, {"t": "Her", "ok": true, "re": "答對！名詞前面用所有格。Her mother＝她的媽媽。"}, {"t": "She's", "ok": false, "re": "She's＝She is，「她是媽媽」意思就不對了。"}]}, {"say": "「Look at the dog. ___ name is Lucky.」", "ch": [{"t": "It's", "ok": false, "re": "It's＝It is。「它是名字」不通喔。"}, {"t": "Its", "ok": true, "re": "對！Its＋name＝牠的名字。沒撇號才是所有格。"}, {"t": "His", "ok": false, "re": "動物一般用 it、its。"}]}]}, {"id": "family", "name": "🌳 家庭樹專區", "icon": "🌳", "c": ["FAM-WORD", "FAM-FLIP"], "intro": "家庭樹的題目要做三件事：<b>①看懂線 ②叫得出稱謂 ③換個人當主詞也不亂</b>。下面先學怎麼看線，再到互動家庭樹點點看。", "table": [["男生", "女生", "說明"], ["father（dad）", "mother（mom）", "父母＝parents"], ["son", "daughter", "兒子／女兒"], ["brother", "sister", "不分大小"], ["husband", "wife", "夫妻"], ["grandfather", "grandmother", "隔一代 grand-"], ["grandson", "granddaughter", "孫子／孫女"], ["uncle", "aunt", "爸媽的兄弟姊妹（和他們的另一半）"], ["cousin", "cousin", "uncle／aunt 的小孩，不分男女"]], "flows": [{"title": "家庭樹的線怎麼看", "steps": [{"tokens": ["Dave", "＝", "Tina"], "hl": [1], "note": "<b>橫線</b>連起來的兩個人＝夫妻（husband／wife）"}, {"tokens": ["Dave＆Tina", "↓", "Paul", "Frank"], "hl": [1], "note": "從夫妻中間<b>往下</b>的線＝他們的孩子（son／daughter）"}, {"tokens": ["Paul", "—", "Frank"], "hl": [1], "note": "同一條橫桿下面的人＝兄弟姊妹（brother／sister）"}]}, {"title": "換角度：Paul is Nick's father.", "steps": [{"tokens": ["Paul", "is", "Nick's", "father", "."], "hl": [0, 3], "note": "Paul（男）是 Nick 的<b>爸爸</b>"}, {"tokens": ["Nick", "is", "Paul's", "___", "."], "hl": [0, 3], "note": "換 Nick 當主詞：Nick 是男生，爸爸的「相反」是兒子"}, {"tokens": ["Nick", "is", "Paul's", "son", "."], "hl": [3], "note": "→ <b>son</b>（如果是 Bella 就是 daughter）"}]}, {"title": "cousin 是怎麼來的", "steps": [{"tokens": ["Frank", "is", "Nick's", "uncle", "."], "hl": [3], "note": "Frank 是 Nick 爸爸的弟弟 → uncle"}, {"tokens": ["Ann", "is", "Frank's", "daughter", "."], "hl": [3], "note": "Ann 是 Frank 的女兒"}, {"tokens": ["Ann", "is", "Nick's", "cousin", "."], "hl": [3], "note": "uncle 的小孩＝<b>cousin</b>（不分男女）"}]}], "tutor": [{"say": "Mia 是 Ann 的媽媽，Frank 是 Ann 的爸爸。Mia 是 Frank 的什麼人？", "ch": [{"t": "sister", "ok": false, "re": "Mia 和 Frank 是 Ann 的爸媽，他們是夫妻喔。"}, {"t": "wife", "ok": true, "re": "對！Mia is Frank's wife. 反過來 Frank is Mia's husband。"}, {"t": "mother", "ok": false, "re": "Mia 是 Ann 的媽媽，不是 Frank 的媽媽。"}]}, {"say": "Dave is Nick's grandfather. 反過來，Nick is Dave's ___?", "ch": [{"t": "grandfather", "ok": false, "re": "換角度後，主詞是 Nick（孫子那一輩）。"}, {"t": "grandson", "ok": true, "re": "答對！Nick 是男生 → grandson。Ann 就是 granddaughter。"}, {"t": "son", "ok": false, "re": "Nick 和 Dave 差兩代，要加 grand-。"}]}, {"say": "Lily is Henry's ___?（提示：Lily 是 Henry 爸爸的哥哥的太太）", "ch": [{"t": "aunt", "ok": true, "re": "完全正確！課本 p.10 Read and Fill In 第 3 題就是這題。"}, {"t": "mother", "ok": false, "re": "Henry 的媽媽是 Mia。"}, {"t": "cousin", "ok": false, "re": "cousin 是同一輩的。Lily 是 Henry 爸媽那一輩。"}]}]}, {"id": "plural", "name": "名詞複數規則", "icon": "🔢", "c": ["PL-REG", "PL-IRR"], "intro": "兩個以上就要用複數。大部分加 s，但有幾種字會變形，還有幾個字<b>完全不照規則</b>，一定要背。", "table": [["規則", "怎麼變", "例子"], ["一般", "加 -s", "cousin → cousins、teacher → teachers"], ["字尾 s／x／sh／ch", "加 -es（因為多一個音 /ɪz/）", "class → classes、box → boxes"], ["子音＋y", "去 y 加 -ies", "family → families、baby → babies"], ["母音＋y", "直接加 -s", "boy → boys、day → days"], ["字尾 f／fe", "去 f(e) 加 -ves", "wife → wives、knife → knives"], ["🔴 不規則", "整個字變，不加 s", "man → <b>men</b>、woman → <b>women</b>、child → <b>children</b>"], ["🔴 不規則（L2 會遇到）", "母音變了", "mouse → <b>mice</b>、foot → feet、tooth → teeth"], ["🔴 單複數同形", "不變", "sheep、fish、deer"], ["不可數", "沒有複數", "news、PE（字尾有 s 的 news 也是不可數）"]], "flows": [{"title": "man 變 men：主詞變複數時，整句都要跟著改", "steps": [{"tokens": ["The", "man", "is", "a", "doctor", "."], "hl": [1, 2], "note": "一個男人：man＋is"}, {"tokens": ["The", "men", "are", "doctors", "."], "hl": [1, 2, 3], "note": "兩個男人：<b>men</b>＋<b>are</b>＋doctor 也加 s，a 拿掉"}]}, {"title": "child 變 children", "steps": [{"tokens": ["The", "child", "is", "cute", "."], "hl": [1, 2], "note": "一個孩子"}, {"tokens": ["The", "children", "are", "cute", "."], "hl": [1, 2], "note": "很多孩子：<b>children</b>（🔴 不是 childs，也不是 childrens）"}]}], "tutor": [{"say": "「My uncle has two ___.（wife）」……等等，這句不合理！換一題：「Mia and Lily are ___.（wife）」", "ch": [{"t": "wifes", "ok": false, "re": "f／fe 結尾要改 -ves。"}, {"t": "wives", "ok": true, "re": "對！wife → wives。Mia and Lily are wives. 她們都是太太。"}]}, {"say": "「Three ___ are in the classroom.（woman）」", "ch": [{"t": "womans", "ok": false, "re": "woman 是不規則複數，不加 s。"}, {"t": "women", "ok": true, "re": "答對！woman → women。注意 women 的 o 唸 /ɪ/。"}, {"t": "womens", "ok": false, "re": "women 已經是複數了，不能再加 s。"}]}, {"say": "Good news! 的 news 是幾個？", "ch": [{"t": "複數，因為有 s", "ok": false, "re": "陷阱！news 字尾有 s，但它是不可數名詞。"}, {"t": "不可數，沒有單複數", "ok": true, "re": "對！所以是 The news <b>is</b> good."}]}]}, {"id": "a-an", "name": "a／an 怎麼選", "icon": "🅰", "c": ["A-AN"], "intro": "不是看字母，是看<b>緊接在後面那個字的發音</b>：母音開頭用 an，子音開頭用 a。", "table": [["後面那個字", "用", "例子"], ["子音開頭", "a", "a cook、a young man、a tall boy"], ["母音開頭", "an", "an aunt、an old man、an English teacher"]], "flows": [{"title": "中間插了形容詞，冠詞跟著變", "steps": [{"tokens": ["a", "man"], "hl": [0, 1], "note": "man 是 m 開頭（子音）→ a"}, {"tokens": ["an", "old", "man"], "hl": [0, 1], "note": "中間插了 old（o 母音開頭）→ 改成 <b>an</b>"}, {"tokens": ["a", "young", "man"], "hl": [0, 1], "note": "插 young（y 子音）→ 還是 a"}]}], "tutor": [{"say": "「My grandmother is ___ old woman.」", "ch": [{"t": "a", "ok": false, "re": "緊接在後面的是 old，o 是母音。"}, {"t": "an", "ok": true, "re": "對！看的是 old 不是 woman。"}]}, {"say": "「Bella is ___ English teacher.」", "ch": [{"t": "a", "ok": false, "re": "English 的 E 是母音開頭喔。"}, {"t": "an", "ok": true, "re": "對！an English teacher。"}]}]}, {"id": "wh", "name": "疑問詞：Who／What／How old", "icon": "❓", "c": ["WH"], "intro": "看答句在回答什麼，就知道要用哪個疑問詞。", "table": [["要問", "疑問詞", "例子"], ["人（是誰、什麼關係）", "Who", "<b>Who</b> is he? — He is my uncle."], ["名字", "What", "<b>What</b>'s your name? — I'm Nick."], ["職業、東西", "What", "<b>What</b> is your father? — He's a nurse."], ["年紀", "How old", "<b>How old</b> is Henry? — He's six."]], "flows": [{"title": "從答句倒推問句", "steps": [{"tokens": ["He", "is", "my", "uncle", "."], "hl": [2, 3], "note": "答句說的是「關係」→ 問人"}, {"tokens": ["Who", "is", "he", "?"], "hl": [0], "note": "→ 用 <b>Who</b>"}, {"tokens": ["He", "is", "seventeen", "."], "hl": [2], "note": "答句說的是「年紀」"}, {"tokens": ["How old", "is", "he", "?"], "hl": [0], "note": "→ 用 <b>How old</b>"}]}], "tutor": [{"say": "A: ___ is that girl? B: She's my cousin, Ann.", "ch": [{"t": "What", "ok": false, "re": "答句在說「她是誰」（關係），問人要用 Who。"}, {"t": "Who", "ok": true, "re": "對！問人用 Who。"}, {"t": "How old", "ok": false, "re": "答句沒有說年紀喔。"}]}, {"say": "A: Who is Mr. Lin? B: ___", "ch": [{"t": "Yes, he is.", "ok": false, "re": "🔴 Who 問句不能用 Yes／No 回答。"}, {"t": "He is my PE teacher.", "ok": true, "re": "對！問「是誰」就回答身分或關係。"}]}]}, {"id": "conj", "name": "and／but／too", "icon": "➕", "c": ["CONJ"], "intro": "連接兩句話時：同方向用 and，相反用 but，「也」用 too 放句尾。", "table": [["用法", "意思", "例子"], ["and", "而且（同方向）", "He is tall <b>and</b> handsome."], ["but", "但是（相反）", "I am tall, <b>but</b> my brother isn't."], [", too", "也（放句尾）", "She's a strict teacher<b>, too</b>."]], "flows": [{"title": "but 後面的句子可以省略", "steps": [{"tokens": ["I", "am", "tall", ",", "but", "my", "brother", "is", "not", "tall", "."], "hl": [4], "note": "意思相反 → but"}, {"tokens": ["I", "am", "tall", ",", "but", "my", "brother", "isn't", "."], "hl": [7], "note": "後面重複的 tall 可以省略"}]}], "tutor": [{"say": "「I am thin, ___ my sister is, ___.」（我很瘦，我妹妹也是）", "ch": [{"t": "but；too", "ok": false, "re": "兩個人都瘦＝同方向，不用 but。"}, {"t": "and；too", "ok": true, "re": "對！同方向 and，「也」用 too 放句尾。"}]}]}, {"id": "adj", "name": "形容詞放哪裡", "icon": "📍", "c": ["ORDER"], "intro": "形容詞有兩個位置：<b>be 動詞後面</b>，或<b>名詞前面</b>。", "table": [["位置", "例子"], ["be 動詞後面", "He is <b>young</b>."], ["a＋形容詞＋名詞", "He is a <b>young</b> man."]], "flows": [{"title": "同一個意思，兩種寫法", "steps": [{"tokens": ["He", "is", "tall", "."], "hl": [2], "note": "tall 放在 is 後面"}, {"tokens": ["He", "is", "a", "tall", "boy", "."], "hl": [2, 3, 4], "note": "加了名詞 boy：a＋tall＋boy（🔴 不是 a boy tall）"}]}], "tutor": [{"say": "「Is Eddie ___?」哪個順序對？", "ch": [{"t": "a boy tall", "ok": false, "re": "中文說「一個男孩高」不通，英文也一樣。形容詞放名詞前面。"}, {"t": "a tall boy", "ok": true, "re": "對！a＋形容詞＋名詞。"}]}]}, {"id": "mech", "name": "大小寫和標點", "icon": "✏", "c": ["MECH"], "intro": "段考的翻譯題、手寫題，<b>沒寫標點就扣分</b>。寫完每一句檢查三件事。", "table": [["檢查", "例子"], ["① 句首大寫", "<b>M</b>y name is Nick."], ["② 人名、地名、I 大寫", "<b>A</b>nn and <b>I</b> are cousins."], ["③ 句尾有句點或問號", "Who is he<b>?</b>"]], "flows": [{"title": "改正這一句", "steps": [{"tokens": ["my", "name", "is", "nick"], "hl": [0, 3], "note": "錯在哪？句首小寫、人名小寫、沒有句點"}, {"tokens": ["My", "name", "is", "Nick", "."], "hl": [0, 3, 4], "note": "改好了：<b>M</b>y、<b>N</b>ick、句點"}]}], "tutor": [{"say": "哪一句完全正確？", "ch": [{"t": "ann and i are cousins.", "ok": false, "re": "人名 Ann、I 都要大寫。"}, {"t": "Ann and I are cousins.", "ok": true, "re": "完美！"}, {"t": "Ann and I are cousins", "ok": false, "re": "少了句尾的句點。"}]}]}], "questions": [{"id": "mc01", "t": "mc", "set": "mc", "c": ["BE-AGR"], "q": "Sam and Leo ___ cousins.", "o": ["is", "am", "are", "be"], "a": 2, "x": "主詞 Sam and Leo 是兩個人 → are。"}, {"id": "mc02", "t": "mc", "set": "mc", "c": ["POSS", "MECH"], "q": "___ name is Tina. She is my aunt.", "o": ["She", "Her", "She's", "her"], "a": 1, "x": "後面接名詞 name → 所有格；放在句首要大寫 → Her。"}, {"id": "mc03", "t": "mc", "set": "mc", "c": ["BE-ANS"], "q": "A: Is your mother a doctor?<br>B: ___. She is a nurse.", "o": ["Yes, she is", "No, she isn't", "Yes, she isn't", "No, she is"], "a": 1, "x": "後面說她是護理師，所以不是醫生 → No, she isn't。Yes 配肯定、No 配否定。"}, {"id": "mc04", "t": "mc", "set": "mc", "c": ["WH"], "q": "A: ___ that tall man?<br>B: He is my uncle.", "o": ["What's", "Who's", "How old is", "What"], "a": 1, "x": "答句說的是關係（我叔叔）→ 問人用 Who。"}, {"id": "mc05", "t": "mc", "set": "mc", "c": ["FAM-WORD"], "q": "Frank is my father's brother. He is my ___.", "o": ["aunt", "cousin", "uncle", "grandfather"], "a": 2, "x": "爸爸的兄弟＝uncle。"}, {"id": "mc06", "t": "mc", "set": "mc", "c": ["FAM-WORD"], "q": "My aunt's daughter is my ___.", "o": ["sister", "cousin", "mother", "wife"], "a": 1, "x": "uncle、aunt 的小孩＝cousin。"}, {"id": "mc07", "t": "mc", "set": "mc", "c": ["ORDER", "A-AN"], "q": "A: Is Eddie ___?<br>B: Yes, he is.", "o": ["a boy tall", "tall a boy", "a tall boy", "tall boy"], "a": 2, "x": "冠詞 a 在最前面，形容詞放在名詞前面 → a tall boy。"}, {"id": "mc08", "t": "mc", "set": "mc", "c": ["A-AN"], "q": "My grandfather is ___ old farmer.", "o": ["a", "an", "the", "X"], "a": 1, "x": "緊接在後面的 old 是母音開頭 → an。"}, {"id": "mc09", "t": "mc", "set": "mc", "c": ["POSS"], "q": "Lily and Paul are Nick's parents. ___ son is Nick.", "o": ["His", "Her", "Their", "Our"], "a": 2, "x": "Lily and Paul 是兩個人 → 他們的＝Their。"}, {"id": "mc10", "t": "mc", "set": "mc", "c": ["POSS"], "q": "Your dog is cute. What's ___ name?", "o": ["it", "it's", "its", "their"], "a": 2, "x": "後面接名詞 name、指狗 → its（沒撇號）。it's＝it is。"}, {"id": "mc11", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "I am tall, ___ my brother isn't.", "o": ["and", "but", "too", "or"], "a": 1, "x": "我高、哥哥不高，意思相反 → but。"}, {"id": "mc12", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "My father is a cook, and my mother is a cook, ___.", "o": ["too", "but", "and", "X"], "a": 0, "x": "「也」放句尾、前面有逗號 → too。"}, {"id": "mc13", "t": "mc", "set": "mc", "c": ["BE-ANS"], "q": "A: Are Bella and Eddie your sister and brother?<br>B: Yes, ___.", "o": ["we are", "they are", "he is", "they're"], "a": 1, "x": "Bella and Eddie → they；肯定簡答不能縮寫，所以不能選 they're。"}, {"id": "mc14", "t": "mc", "set": "mc", "c": ["PRON"], "q": "That woman is Mia. ___ Ann's mother.", "o": ["He's", "She's", "It's", "Her"], "a": 1, "x": "woman 是女生，後面要「她是」→ She's（＝She is）。Her 是「她的」，後面沒有 const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const norm = s => String(s).replace(/[’‘`]/g,"'").replace(/\s+/g," ").trim();
const loose = s => norm(s).toLowerCase().replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();

/* ───────── 語音（瀏覽器內建，不用網路） ───────── */
let VOICE = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  VOICE = vs.find(v=>/Google|Samantha|Aria|Jenny|Zira/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, opt={}){
  return new Promise(res=>{
    if (!("speechSynthesis" in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="en-US"; if (VOICE) u.voice=VOICE;
    u.rate = opt.rate || 0.85; u.pitch = opt.pitch || 1;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
async function speakTalk(script){
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  for (const part of script.split("|")){
    const m = part.match(/^(W|M|Q):\s*(.*)$/);
    if (!m){ await speak(part); continue; }
    const pitch = m[1]==="W" ? 1.3 : m[1]==="M" ? 0.75 : 1;
    await speak((m[1]==="Q" ? "Question. " : "") + m[2], {pitch});
    await new Promise(r=>setTimeout(r,350));
  }
}
function sayBtn(text){ return `<button class="say" data-say="${esc(text)}" aria-label="播放">🔊</button>`; }
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-say]"); if (!b) return;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  speak(b.dataset.say);
});

  app.innerHTML = `<header class="top">${back!==undefined?`<button class="back" onclick="location.hash='${back}'">←</button>`:""}<h1>${title}</h1></header>${body}`;
  window.scrollTo(0,0);
}
function tile(ic, name, desc, href, off){
  return `<button class="tile${off?" off":""}" ${off?"disabled":`onclick="location.hash='${href}'"`}><span class="ic">${ic}</span><b>${name}</b><small>${desc}</small></button>`;
}

/* ───────── 家庭樹：關係計算 ───────── */
function famMap(F){ const m={}; F.people.forEach(p=>m[p.id]=p); return m; }
function siblings(m, id){ const p=m[id]; if(!p.par.length) return [];
  return Object.values(m).filter(q=>q.id!==id && q.par.some(x=>p.par.includes(x))).map(q=>q.id); }
function rel(F, a, b){ // a 是 b 的什麼人
  const m = famMap(F), A=m[a], B=m[b]; if(!A||!B||a===b) return null;
  const g = (mw,fw)=> A.sex==="m"?mw:fw;
  if (A.sp===b) return g("husband","wife");
  if (B.par.includes(a)) return g("father","mother");
  if (A.par.includes(b)) return g("son","daughter");
  if (siblings(m,a).includes(b)) return g("brother","sister");
  if (B.par.some(p=>m[p].par.includes(a))) return g("grandfather","grandmother");
  if (A.par.some(p=>m[p].par.includes(b))) return g("grandson","granddaughter");
  const bParSibs = B.par.flatMap(p=>siblings(m,p));
  if (bParSibs.includes(a) || bParSibs.some(s=>m[s].sp===a)) return g("uncle","aunt");
  if (A.par.some(p=>bParSibs.includes(p))) return "cousin";
  // uncle／aunt 的反方向（課外字，只顯示不出題）
  if (A.par.some(p=>siblings(m,p).includes(b) || siblings(m,p).some(s=>m[s].sp===b))) return g("nephew","niece");
  return null;
}
const EXTRA = {nephew:"姪子／外甥", niece:"姪女／外甥女"};
const REL_M = ["father","son","brother","husband","grandfather","grandson","uncle","cousin"];
const REL_F = ["mother","daughter","sister","wife","grandmother","granddaughter","aunt","cousin"];

function treeSVG(F, sel=[]){
  const m=famMap(F), W=66, H=120, R=23, ox=6, oy=30;
  const X=p=>ox+p.x*W+W/2, Y=p=>oy+p.y*H;
  const maxx=Math.max(...F.people.map(p=>p.x)), maxy=Math.max(...F.people.map(p=>p.y));
  let s=`<svg viewBox="0 0 ${ox*2+(maxx+1)*W} ${oy+maxy*H+80}" role="img" aria-label="${esc(F.title)}">`;
  const done=new Set();
  F.people.forEach(p=>{ if(p.sp && !done.has(p.sp)){ done.add(p.id); const q=m[p.sp];
    s+=`<line x1="${X(p)}" y1="${Y(p)}" x2="${X(q)}" y2="${Y(q)}" stroke="currentColor" stroke-width="2.5" opacity=".55"/>`; }});
  const groups={};
  F.people.forEach(p=>{ if(p.par.length){ const k=p.par.slice().sort().join("+"); (groups[k]=groups[k]||[]).push(p);} });
  Object.entries(groups).forEach(([k,kids])=>{
    const [a,b]=k.split("+").map(i=>m[i]); const mx=(X(a)+X(b))/2, py=Y(a), by=py+H*0.55;
    const xs=kids.map(X); const x1=Math.min(...xs,mx), x2=Math.max(...xs,mx);
    s+=`<g stroke="currentColor" stroke-width="2" opacity=".45"><line x1="${mx}" y1="${py}" x2="${mx}" y2="${by}"/><line x1="${x1}" y1="${by}" x2="${x2}" y2="${by}"/>`;
    kids.forEach(c=>s+=`<line x1="${X(c)}" y1="${by}" x2="${X(c)}" y2="${Y(c)-R}"/>`); s+=`</g>`;
  });
  F.people.forEach(p=>{
    const on = sel.indexOf(p.id);
    const fill = on===0 ? "#f472b6" : on===1 ? "#60a5fa" : (p.sex==="m"?"#bfdbfe":"#fbcfe8");
    s+=`<g class="pn" data-p="${p.id}"><circle cx="${X(p)}" cy="${Y(p)}" r="${R}" fill="${fill}" stroke="#334155" stroke-width="${on>=0?3:1}"/>`+
       `<text x="${X(p)}" y="${Y(p)+6}" text-anchor="middle" font-size="18">${p.sex==="m"?"👦":"👧"}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+19}" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor">${p.id}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+37}" text-anchor="middle" font-size="16" fill="currentColor" opacity=".7">${p.age}</text></g>`;
  });
  return s+"</svg>";
}
function famQuestions(F, n){
  const ids=F.people.map(p=>p.id), out=[], seen=new Set();
  let guard=0;
  while(out.length<n && guard++<500){
    const a=ids[Math.floor(Math.random()*ids.length)], b=ids[Math.floor(Math.random()*ids.length)];
    const r=rel(F,a,b); if(!r || EXTRA[r]) continue;
    const kind=["word","flip","who"][Math.floor(Math.random()*3)];
    const key=kind+a+b; if(seen.has(key)) continue; seen.add(key);
    const A=famMap(F)[a], pool=(A.sex==="m"?REL_M:REL_F).filter(x=>x!==r);
    if(kind==="word"){
      const o=shuffle([r,...pick(pool,3)]);
      out.push({id:`fam:${F.id}:w:${a}:${b}`,t:"mc",c:["FAM-WORD"],tree:F.id,q:`${a} is ${b}'s ___.`,o,a:o.indexOf(r),
        x:`看家庭樹：${a} 是 ${b} 的 <b>${r}</b>。`});
    } else if(kind==="flip"){
      const r2=rel(F,b,a); if(!r2 || EXTRA[r2]) continue;
      const B=famMap(F)[b]; const pool2=(B.sex==="m"?REL_M:REL_F).filter(x=>x!==r2);
      const o=shuffle([r2,...pick(pool2,3)]);
      out.push({id:`fam:${F.id}:f:${a}:${b}`,t:"mc",c:["FAM-FLIP"],tree:F.id,q:`${a} is ${b}'s ${r}.<br>So ${b} is ${a}'s ___.`,o,a:o.indexOf(r2),
        x:`換 ${b} 當主詞：${b} 是${B.sex==="m"?"男生":"女生"} → <b>${r2}</b>。`});
    } else {
      const ans=ids.filter(i=>rel(F,i,b)===r); if(ans.length!==1) continue;
      const o=shuffle([a,...pick(ids.filter(i=>i!==a&&i!==b),3)]);
      out.push({id:`fam:${F.id}:h:${a}:${b}`,t:"mc",c:["FAM-WORD","WH"],tree:F.id,q:`Who is ${b}'s ${r}?`,o,a:o.indexOf(a),
        x:`${b}'s ${r} 是 <b>${a}</b>。`});
    }
  }
  return out;
}

/* ───────── 題庫整理 ───────── */
const QS = D.questions.slice();
D.reading.forEach(g=>g.qs.forEach(q=>{ q.p=g.id; QS.push(q); }));
const QBY = {}; QS.forEach(q=>QBY[q.id]=q);
const READ = {}; D.reading.forEach(g=>READ[g.id]=g);
const FAM = {nick:D.familyNick, wang:D.familyWang};
const posq = D.words.filter(w=>w.posq);
function spellQ(w){ return {id:"sp:"+w.w, t:"spell", c:["V-SP","V-ZH"].concat(w.posq?["V-POS"]:[]), w}; }
function zhQ(w){ return {id:"ze:"+w.w, t:"fill", c:["V-SP"], q:`${w.zh}（${w.pos}）→ ___`, a:[w.w], x:`${w.w}：${w.zh}`}; }
function poolFor(code){
  let p = QS.filter(q=>q.c.includes(code));
  if (code==="FAM-WORD"||code==="FAM-FLIP") p = p.concat(famQuestions(FAM.nick,6).filter(q=>q.c.includes(code)));
  if (code==="V-SP"||code==="V-ZH") p = p.concat(pick(D.words,6).map(spellQ));
  if (code==="V-POS") p = p.concat(pick(posq,6).map(spellQ));
  if (code==="MECH") p = p.concat(pick(QS.filter(q=>q.t==="order"),3));
  return p;
}

/* ───────── 作答紀錄＋錯題本 ───────── */
function record(q, okByConcept){ // okByConcept: {code: bool}
  for (const [c,ok] of Object.entries(okByConcept)){
    const s = S.stats[c] || (S.stats[c]={n:0,w:0}); s.n++; if(!ok) s.w++;
  }
  const allOk = Object.values(okByConcept).every(Boolean);
  if (!allOk){ S.wrong[q.id] = {q, s:0}; }
  else if (S.wrong[q.id]){ S.wrong[q.id].s++; if (S.wrong[q.id].s>=2) delete S.wrong[q.id]; }
  save(); return allOk;
}

/* ═════════ 作答引擎 ═════════ */
let QZ = null;
function startQuiz(opt){
  QZ = Object.assign({i:0, res:[], recent:[], drill:null, back:"#/"}, opt);
  QZ.list = opt.qs.slice();
  if (location.hash === "#/quiz") return renderQuiz();
  // 從「直接開考」的網址進來時用 replace，按返回鍵才不會又重開一次
  if (/\/(do|ls|quiz)(\/|$)/.test(location.hash)) location.replace("#/quiz"); else location.hash = "#/quiz";
}
function curQ(){ return QZ.drill ? QZ.drill.list[QZ.drill.i] : QZ.list[QZ.i]; }
function renderQuiz(){
  if (!QZ) return route("#/");
  if (QZ.cp) return renderCheckpoint();
  const total = QZ.drill ? QZ.drill.list.length : QZ.list.length, idx = QZ.drill ? QZ.drill.i : QZ.i;
  if (idx >= total){ return QZ.drill ? endDrill() : renderResult(); }
  const q = curQ();
  const head = QZ.drill ? `<div class="fb warn">🎯 加練：${CN[QZ.drill.code].name}（答對才回到原本的題目）</div>` : "";
  page(QZ.title, `${head}<div class="sub">${idx+1} / ${total}</div><div class="prog"><i style="width:${idx/total*100}%"></i></div><div class="card" id="qbox"></div>`, QZ.back);
  const box = $("#qbox");
  ({mc:qMC, fill:qFill, spell:qSpell, order:qOrder, listen:qListen})[q.t](q, box);
}
function afterAnswer(q, okByConcept, box, html, given){
  const ok = record(q, okByConcept);
  if (QZ.drill){
    if (!ok){ const d=QZ.drill; d.req[q.id]=(d.req[q.id]||0)+1; if (d.req[q.id]<=2) d.list.push(q); }
  } else { QZ.res.push({q, ok, okByConcept, given}); QZ.recent.push({q, okByConcept}); }
  if (QZ.exam){ return next(); }
  box.insertAdjacentHTML("beforeend", `<div class="fb ${ok?"ok":"ng"}">${ok?"✅ 答對了！":"❌ 再看一次"}${html?"<br>"+html:""}</div><button class="btn" id="nx">下一題 →</button>`);
  $("#nx").onclick = next; $("#nx").scrollIntoView({block:"nearest"});
}
function next(){
  if (QZ.drill){ QZ.drill.i++; return renderQuiz(); }
  QZ.i++;
  if (QZ.checkpoint && QZ.recent.length>=8){ QZ.cp = true; }
  renderQuiz();
}
function passageHTML(q){
  let h="";
  if (q.p){ const g=READ[q.p]; h+=`<div class="passage"><b>${g.title}</b>${g.tree?`<div class="tree">${treeSVG(FAM[g.tree])}</div>`:""}<div>${g.p}</div></div>`; }
  if (q.tree && !q.p){ h+=`<div class="passage tree">${treeSVG(FAM[q.tree])}</div>`; }
  return h;
}
function qMC(q, box){
  box.innerHTML = passageHTML(q)+`<div class="q">${q.q}</div><div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">(${"ABCD"[i]}) ${o}</button>`).join("")}</div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=i===q.a;
    box.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(!QZ.exam){ if(+x.dataset.i===q.a) x.classList.add("ok"); else if(x===b) x.classList.add("ng"); }});
    const m={}; q.c.forEach(c=>m[c]=ok);
    afterAnswer(q, m, box, q.x, q.o[i]);
  });
}
function blankify(s){ return s.replace(/___/g,'<span class="blank">&nbsp;</span>'); }
function qFill(q, box){
  box.innerHTML = passageHTML(q)+`<div class="q">${blankify(q.q)}</div><input class="ans" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡輸入"><button class="btn" id="go">確認</button>`;
  const inp=$("#in"); inp.focus();
  const go=()=>{
    const v=inp.value; if(!v.trim()) return; inp.disabled=true; $("#go").remove();
    const hit = q.a.find(a=>loose(a)===loose(v));
    const ok = !!hit;
    const m={}; q.c.forEach(c=>m[c]=ok);
    let extra="";
    if (ok && q.c.includes("MECH") && norm(v.replace(/[.?!]$/,""))!==norm(hit.replace(/[.?!]$/,""))){
      m.MECH=false; extra=`<div class="fb warn">⚠ 拼字對了，但大小寫要注意：<b>${esc(hit)}</b>。段考會扣分。</div>`;
    }
    afterAnswer(q, m, box, `${ok?"":`正確答案：<b>${esc(q.a[0])}</b><br>`}${q.x||""}${extra}`, v);
  };
  $("#go").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
}
function qSpell(q, box){
  const w=q.w, res={};
  let same = D.words.filter(x=>x.zh!==w.zh && x.sec===w.sec);
  if (same.length<3) same = D.words.filter(x=>x.zh!==w.zh);
  const zhOpts = shuffle([w.zh, ...pick(same,3).map(x=>x.zh)]);
  box.innerHTML = `<div class="sub">聽發音，打出英文拼字</div><div class="row" style="margin:10px 0"><button class="btn" id="play">🔊 播放</button><button class="btn ghost small" id="slow">🐢 慢速</button></div>
    <input class="ans" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英文拼字"><button class="btn" id="go">確認拼字</button><div id="st2"></div>`;
  const play=(r)=>{ window.speechSynthesis && speechSynthesis.cancel(); speak(w.w,{rate:r}); };
  $("#play").onclick=()=>play(0.8); $("#slow").onclick=()=>play(0.5); setTimeout(()=>play(0.8),250);
  const inp=$("#in"); inp.focus();
  const step1=()=>{
    const v=inp.value; if(!v.trim()) return; inp.disabled=true; $("#go").remove();
    res["V-SP"] = loose(v)===loose(w.w);
    $("#st2").innerHTML = `<div class="fb ${res["V-SP"]?"ok":"ng"}">${res["V-SP"]?"✅ 拼對了：":"❌ 正確拼法："}<b>${esc(w.w)}</b></div>
      <h3>這個字的中文是？</h3><div class="opts">${zhOpts.map(z=>`<button class="opt" data-z="${esc(z)}">${esc(z)}</button>`).join("")}</div><div id="st3"></div>`;
    $("#st2").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      res["V-ZH"] = b.dataset.z===w.zh;
      $("#st2").querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.z===w.zh) x.classList.add("ok"); else if(x===b) x.classList.add("ng");});
      if (!w.posq) return finish();
      $("#st3").innerHTML = `<h3>詞性是？</h3><div class="opts" style="grid-template-columns:repeat(4,1fr)">${["n.","v.","adj.","adv."].map(p=>`<button class="opt" data-p="${p}">${p}</button>`).join("")}</div>`;
      $("#st3").querySelectorAll(".opt").forEach(c=>c.onclick=()=>{
        res["V-POS"] = c.dataset.p===w.pos;
        $("#st3").querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(x.dataset.p===w.pos) x.classList.add("ok"); else if(x===c) x.classList.add("ng");});
        finish();
      });
    });
  };
  const finish=()=>{
    const pl = w.pl ? `複數：${w.pl}` : (w.plr==="unc"?"不可數":"");
    afterAnswer(q, res, box, `<b>${esc(w.w)}</b> ${w.pos} ${esc(w.zh)}${pl?"｜"+pl:""}<span class="eg">${esc(w.ex)}　${esc(w.exz)}</span>`, "");
  };
  $("#go").onclick=step1; inp.onkeydown=e=>{ if(e.key==="Enter") step1(); };
}
function mechCheck(v){
  const t=norm(v), probs=[];
  if (!/^[A-Z]/.test(t)) probs.push("句首第一個字母要大寫");
  if (!/[.?!]$/.test(t)) probs.push("句尾要有標點符號");
  if (/(^|\s)i(\s|'|$)/.test(t)) probs.push("I（我）永遠大寫");
  return probs;
}
function qOrder(q, box){
  const toks = q.en.split(" "); let tries=0, phase1ok=true;
  let pool = shuffle(toks.map((t,i)=>({t,i}))), ans=[];
  box.innerHTML = `<div class="q">${q.zh}</div><div class="sub">第 1 步：點字卡排出正確順序</div>
    <div class="chips card" id="ansrow" style="margin:8px 0"></div><div class="chips" id="poolrow"></div>
    <button class="btn" id="chk">檢查順序</button><div id="ph2"></div>`;
  const draw=()=>{
    $("#ansrow").innerHTML = ans.map((o,k)=>`<button class="chipw opt" data-k="${k}" style="padding:8px 10px">${esc(o.t)}</button>`).join("") || `<span class="muted">（點下面的字卡）</span>`;
    $("#poolrow").innerHTML = pool.map((o,k)=>`<button class="chipw opt" data-k="${k}" style="padding:8px 10px">${esc(o.t)}</button>`).join("");
    $("#ansrow").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ pool.push(ans.splice(+b.dataset.k,1)[0]); draw(); });
    $("#poolrow").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ ans.push(pool.splice(+b.dataset.k,1)[0]); draw(); });
  };
  draw();
  $("#chk").onclick=()=>{
    if (pool.length) return;
    const good = ans.map(o=>o.t).join(" ")===q.en;
    if (!good){
      tries++; phase1ok=false;
      if (tries<2){ $("#ph2").innerHTML=`<div class="fb ng">順序還不對，想想 be 動詞和形容詞的位置，再試一次。</div>`; return; }
      $("#ph2").innerHTML=`<div class="fb ng">正確順序：<b>${esc(q.en)}</b></div>`;
    }
    $("#chk").remove(); $("#poolrow").remove();
    $("#ph2").insertAdjacentHTML("beforeend", `<div class="sub" style="margin-top:12px">第 2 步：${good?"排對了！":""}現在不看字卡，自己打出完整句子（注意大小寫和標點）</div>
      <input class="ans" id="in" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="go">確認</button>`);
    $("#ansrow").style.opacity=".25"; $("#ansrow").style.filter="blur(5px)";
    const inp=$("#in"); inp.focus();
    const go=()=>{
      const v=inp.value; if(!v.trim()) return; inp.disabled=true; $("#go").remove();
      const okType = [q.en,...q.alt].some(a=>loose(a)===loose(v));
      const m={}; q.c.forEach(c=>m[c]=phase1ok && okType);
      let extra="";
      if (okType){ const p=mechCheck(v); if(p.length){ m.MECH=false; extra=`<div class="fb warn">⚠ 句子對了，但${p.join("、")}。段考會扣分。</div>`; } else m.MECH=true; }
      afterAnswer(q, m, box, `${okType?"":"參考答案："}<b>${esc(q.en)}</b>${q.alt.length?`<span class="eg">也可以：${q.alt.map(esc).join("／")}</span>`:""}${q.x?"<br>"+q.x:""}${extra}`, v);
    };
    $("#go").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
  };
}
function qListen(q, box){

/* ───────── 每 8 題弱點分析卡 ───────── */
function worstConcept(items){
  const miss={};
  items.forEach(r=>Object.entries(r.okByConcept).forEach(([c,ok])=>{ if(!ok) miss[c]=(miss[c]||0)+1; }));
  const rate=c=>{const s=S.stats[c]; return s&&s.n? s.w/s.n : 0;};
  const arr=Object.keys(miss).sort((a,b)=>miss[b]-miss[a] || rate(b)-rate(a));
  return arr.length ? {code:arr[0], miss:miss[arr[0]]} : null;
}
function stepWidget(flow, id){
  return `<div class="card" id="${id}" data-i="0"><b>${flow.title}</b><div class="chips"></div><div class="stepnote"></div>
    <div class="row"><button class="btn ghost small" data-act="prev">◀ 上一步</button><button class="btn small" data-act="next">下一步 ▶</button><span class="muted sc"></span></div></div>`;
}
function bindStep(flow, id){
  const el=$("#"+id); if(!el) return;
  const draw=()=>{ const i=+el.dataset.i, st=flow.steps[i];
    el.querySelector(".chips").innerHTML = st.tokens.map((t,k)=>`<span class="chipw ${st.hl.includes(k)?"on":""}">${esc(t)}</span>`).join("");
    el.querySelector(".stepnote").innerHTML = st.note;
    el.querySelector(".sc").textContent = `${i+1} / ${flow.steps.length}`;
    el.querySelector('[data-act="prev"]').disabled = i===0;
    el.querySelector('[data-act="next"]').disabled = i===flow.steps.length-1; };
  el.querySelector('[data-act="prev"]').onclick=()=>{ el.dataset.i=Math.max(0,+el.dataset.i-1); draw(); };
  el.querySelector('[data-act="next"]').onclick=()=>{ el.dataset.i=Math.min(flow.steps.length-1,+el.dataset.i+1); draw(); };
  draw();
}
function renderCheckpoint(){

  const C=CN[w.code], G=D.grammar.find(g=>g.id===C.g), flow=G&&G.flows[0];
  page(QZ.title, `<div class="card"><div class="sub">🔍 弱點分析（剛剛 8 題）</div><h2>最需要加強：${C.name}</h2><p class="muted">這個觀念錯了 ${w.miss} 次</p>

  };

function renderResult(){
  const n=QZ.res.length, ok=QZ.res.filter(r=>r.ok).length;

  if (QZ.exam){
    const sec={listen:"聽力",mc:"綜合選擇",read:"閱讀",hand:"手寫"}, sc={};
    QZ.res.forEach(r=>{ const k=r.q.sec; sc[k]=sc[k]||{n:0,ok:0}; sc[k].n++; if(r.ok) sc[k].ok++; });
    const total = Object.entries(sc).reduce((s,[k,v])=>s+v.ok*D.exam.weight[k],0);
    body += `<div class="card center"><div class="sub">段考模擬成績</div><div class="score">${total}</div><div class="muted">滿分 100</div></div>
      <div class="card"><table><tr><th>大題</th><th>答對</th><th>得分</th></tr>${Object.entries(sc).map(([k,v])=>`<tr><td>${sec[k]}</td><td>${v.ok} / ${v.n}</td><td>${v.ok*D.exam.weight[k]}</td></tr>`).join("")}</table></div>`;

  const wrong = QZ.res.filter(r=>!r.ok);
  if (wrong.length) body += `<div class="card"><h3>錯題回顧</h3>${wrong.map(r=>`<div style="border-bottom:1px dashed var(--line);padding:8px 0">${qText(r.q)}<br><span class="muted">你的答案：${esc(r.given||"")}</span><br>✔ ${ansText(r.q)}${r.q.x?`<span class="eg">${r.q.x}</span>`:""}</div>`).join("")}</div>`;

    <tr><td>聽力</td><td>${D.exam.listen}</td><td>30%</td></tr><tr><td>綜合選擇</td><td>${D.exam.mc}</td><td>40%</td></tr>
    <tr><td>閱讀</td><td>${D.exam.read}</td><td>20%</td></tr><tr><td>手寫</td><td>${D.exam.hand}</td><td>10%</td></tr></table>
    <p class="sub">範圍：Lesson 1（L2、Review 1 完成後會加進來）。模擬考中途<b>不顯示對錯</b>，交卷後再看成績、錯題和弱點。</p>
    <button class="btn" id="go">開始考試</button></div>`, "#/");
  $("#go").onclick=()=>{
    const tag=(arr,sec)=>arr.map(q=>Object.assign({},q,{sec}));
    const reads=[...READ.r1.qs,...READ.r2.qs,...READ.r3.qs].map(q=>Object.assign({},q,{p:q.p||D.reading.find(g=>g.qs.includes(q)).id}));
    const qs=[...tag(QS.filter(q=>q.t==="listen").slice(0,D.exam.listen),"listen"),
      ...tag(pick(QS.filter(q=>q.set==="mc"),D.exam.mc),"mc"),
      ...tag(reads.slice(0,D.exam.read),"read"),
      ...tag(pick(QS.filter(q=>q.set==="hand"),D.exam.hand),"hand")];
    startQuiz({title:"段考模擬", qs, exam:true, checkpoint:false, back:"#/exam"});
  };
}

/* ───────── 路由 ───────── */
function route(h){
  if (h!==undefined && location.hash!==h){ location.hash=h; return; }
  const p=(location.hash||"#/").slice(2).split("/");
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (p[0]==="quiz") return renderQuiz();
  QZ=null;
  if (!p[0]) return vHome();
  if (p[0]==="weak") return p[1]?vWeakOne(p[1]):vWeak();
  if (p[0]==="wrong") return vWrong();
  if (p[0]==="exam") return vExam();
  if (p[0]==="L1"){
    if (!p[1]) return vLesson();
    if (p[1]==="words") return vWords();
    if (p[1]==="text") return p[2]?vText(p[2]):vTextList();
    if (p[1]==="grammar") return vGrammarList();
    if (p[1]==="g") return vGrammar(p[2]);
    if (p[1]==="handout") return vHandout();
    if (p[1]==="do") return vDo(p[2]);
    if (p[1]==="quiz") return vQuiz();
    if (p[1]==="listen") return vListen();
    if (p[1]==="ls") return vLs(p[2]);
  }
  vHome();
}
window.addEventListener("hashchange", ()=>route());
route();

if ("serviceWorker" in navigator && /^https:|localhost|127\.0\.0\.1/.test(location.href)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
