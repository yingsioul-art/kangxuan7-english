<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七上英文（康軒）</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ───────── 設計基準：8px 網格｜灰階分層｜Indigo 為唯一強調色 ───────── */
:root{
  --accent:#4f46e5; --accent-ink:#4338ca; --accent-soft:#eef2ff; --accent-line:rgba(79,70,229,.18);
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f4f4f5; --line:#e4e4e7;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
  --ok:#15803d; --ok-soft:#f0fdf4; --ng:#b91c1c; --ng-soft:#fef2f2; --warn:#a16207; --warn-soft:#fefce8;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(24,24,27,.04),0 1px 3px rgba(24,24,27,.06);
  --sh-2:0 8px 24px rgba(24,24,27,.08),0 2px 6px rgba(24,24,27,.04);
  --ease:cubic-bezier(.2,.8,.2,1);
  --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --accent:#818cf8; --accent-ink:#a5b4fc; --accent-soft:rgba(129,140,248,.14); --accent-line:rgba(129,140,248,.28);
    --bg:#0c0c0e; --surface:#18181b; --surface-2:#232328; --line:#2e2e34;
    --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.10); --ng:#f87171; --ng-soft:rgba(248,113,113,.10); --warn:#facc15; --warn-soft:rgba(250,204,21,.10);
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px rgba(0,0,0,.5); }
}
@media (min-width:600px){ :root{ --pad:24px; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:0 16px 96px}

/* 標題列：毛玻璃、黏在頂端 */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;margin:0 -16px 8px;padding:16px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;line-height:1.3}
header.top .back{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--surface);color:var(--ink);
  font-size:18px;cursor:pointer;box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
header.top .back:hover{box-shadow:var(--sh-2)}
header.top .back:active{transform:scale(.92)}

h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin:32px 0 16px}
h3{font-size:16px;font-weight:600;margin:24px 0 8px}
p{margin:8px 0 16px}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3);font-size:14px}
b{font-weight:600}

/* 卡片 */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--pad);margin:16px 0;box-shadow:var(--sh-1)}

/* 首頁方塊 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);border:0;border-radius:var(--r-lg);
  padding:16px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;box-shadow:var(--sh-1);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:var(--r-md);background:var(--surface-2);display:grid;place-items:center;font-size:20px}
.tile b{font-size:16px;line-height:1.3}
.tile small{color:var(--ink-3);font-size:13px;line-height:1.5}
.tile.off{opacity:.45;cursor:default;box-shadow:none;background:var(--surface-2)}
.tile.off:hover{transform:none}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:var(--r-md);
  background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:0 16px;margin:8px 8px 0 0;cursor:pointer;
  transition:transform .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{box-shadow:0 4px 12px var(--accent-line)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost:hover{box-shadow:none;background:var(--accent-line)}
.btn.small{min-height:32px;font-size:13px;padding:0 16px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.35;pointer-events:none}
.say{width:32px;height:32px;flex:none;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:14px;cursor:pointer;
  transition:transform .2s var(--ease),background .2s var(--ease),color .2s var(--ease)}
.say:hover{background:var(--accent-soft);color:var(--accent)}
.say:active{transform:scale(.9)}

/* 表格 */
.tablewrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
@media (min-width:600px){ th,td{padding:8px 16px} }
th{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
th:first-child{border-top-left-radius:var(--r-sm)}
th:last-child{border-top-right-radius:var(--r-sm)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{white-space:nowrap}

/* 單字卡 */
.word{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.word:first-child{padding-top:0}
.word:last-child{border:0;padding-bottom:0}
.word .w{font-size:20px;font-weight:700;letter-spacing:-.01em}
.word .pos{color:var(--accent);font-weight:600;font-size:14px;margin:0 8px}
.badge{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin:8px 8px 0 0}
.badge.cap{background:var(--accent-soft);color:var(--accent-ink)}
.badge.irr{background:var(--ng-soft);color:var(--ng)}
.eg{display:block;color:var(--ink-2);font-size:14px;margin-top:8px}
.eg .say{width:24px;height:24px;font-size:11px;vertical-align:middle;margin-right:4px}

/* 課文 */
.line{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.line:first-child{padding-top:0}
.line:last-child{border:0;padding-bottom:0}
.line .sp{font-weight:600;font-size:14px;min-width:40px;color:var(--ink-3);padding-top:4px}
.line .en{font-size:17px}
.line .hl{background:linear-gradient(transparent 58%,var(--accent-line) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.line .zh{color:var(--ink-3);font-size:14px;margin-top:4px}
.note{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:8px 16px;font-size:14px;color:var(--ink-2);margin-top:8px}

/* 文法字卡 */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px 0}
.chipw{padding:8px 16px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);font-size:18px;font-weight:600;
  border:0;transition:all .4s var(--ease)}
.chipw.on{background:var(--accent);color:#fff;transform:translateY(-4px);box-shadow:0 6px 16px var(--accent-line)}
.stepnote{min-height:48px;font-size:15px;color:var(--ink-2);margin:8px 0}

/* 小老師對話 */
.bubble{border-radius:var(--r-lg);padding:16px;margin:8px 0;max-width:88%;font-size:15px}
.bubble.t{background:var(--surface-2);border-top-left-radius:4px}
.bubble.ok{background:var(--ok-soft);margin-left:auto;border-top-right-radius:4px}
.bubble.ng{background:var(--warn-soft);margin-left:auto;border-top-right-radius:4px}

/* 選項 */
.opts{display:grid;gap:8px;margin-top:16px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;padding:12px 16px;border-radius:var(--r-md);cursor:pointer;
  transition:border-color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.big{font-size:40px;text-align:center;padding:8px}
.opts.pic{grid-template-columns:repeat(3,1fr)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default}
.chips .opt{padding:8px 16px}
.dropzone{background:var(--surface-2);border-radius:var(--r-md);padding:8px;margin:16px 0 8px;min-height:64px;align-items:center}
.dropzone .opt{background:var(--surface);box-shadow:var(--sh-1);border-color:transparent}
.dropzone.over{outline:2px dashed var(--accent);outline-offset:2px}
/* 句子打字：一字一格 */
.wb{display:flex;flex-wrap:wrap;gap:8px 8px;align-items:flex-end;margin:16px 0 8px}
.wbw{display:inline-flex;align-items:flex-end;gap:2px}
.wbi{font:inherit;font-size:18px;padding:8px 4px;min-width:40px;text-align:center;border:0;border-bottom:2px solid var(--ink-3);
  border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--surface-2);color:var(--ink);outline:none;
  transition:border-color .2s var(--ease),background .2s var(--ease)}
.wbi:focus{border-color:var(--accent);background:var(--accent-soft)}
.wbi.ok{border-color:var(--ok);background:var(--ok-soft)}
.wbi.ng{border-color:var(--ng);background:var(--ng-soft)}
.wbp{font-size:20px;font-weight:700;padding-bottom:6px}
.verdict{margin-top:16px;padding:12px 16px;border-radius:var(--r-md);font-size:20px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:2px solid var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng);border:2px solid var(--ng)}
/* 學生答案逐字母比對 */
.yours{margin-top:8px;font-size:18px;line-height:1.9}
.ya{margin:16px 0 8px;border-radius:var(--r-md);overflow:hidden;border:2px solid var(--line);background:var(--surface)}
.ya.is-ok{border-color:var(--ok)} .ya.is-ng{border-color:var(--ng)}
.ya-row{display:flex;align-items:baseline;gap:16px;padding:12px 16px}
.ya-row+.ya-row{border-top:1px solid var(--line);background:var(--surface-2)}
.ya-lab{flex:none;width:64px;font-size:13px;font-weight:600;color:var(--ink-3)}
.ya-val{font-size:22px;font-weight:600;line-height:1.5;word-break:break-word}
.ya-ok{color:var(--ok)}
.ya-note{padding:8px 16px;font-size:13px;color:var(--ok);background:var(--ok-soft)}
.dword{font-weight:600;letter-spacing:.02em}
.dbad{background:var(--ng-soft);color:var(--ng);text-decoration:line-through;border-radius:3px;padding:0 1px}
.dmiss{color:var(--ng);border:1px dashed var(--ng);border-radius:3px;padding:0 2px;margin:0 1px}
/* 句子解析 */
.sxbox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 16px 16px}
.sxbox summary{font-weight:600;color:var(--accent);padding:8px 0}
.sx{padding:8px 0;border-bottom:1px solid var(--line)}
.sx-type{font-size:14px;margin-bottom:8px}
.sx-row{display:flex;flex-wrap:wrap;gap:8px}
.sx-chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:var(--r-sm);font-weight:600;font-size:16px}
.sx-chip small{font-size:11px;font-weight:500;opacity:.75}
.r-s{background:var(--accent-soft);color:var(--accent-ink)}
.r-v{background:var(--accent);color:#fff}
.r-not{background:var(--ng-soft);color:var(--ng)}
.r-c{background:var(--surface-2);color:var(--ink)}
.r-wh{background:var(--warn-soft);color:var(--warn)}
.r-cj{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-2)}
.r-ph{background:var(--ok-soft);color:var(--ok)}
.sx-sec{margin-top:16px;font-size:14px;line-height:1.7}
.sx-sec>b{display:block;font-size:13px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:4px}
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.dropzone .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.dropzone .opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:scale(1.08);box-shadow:var(--sh-2);background:var(--surface)!important;opacity:.95}

/* 作答 */
.q{font-size:19px;line-height:1.7;font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink-3);margin:0 4px}
input.ans{font:inherit;font-size:18px;width:100%;padding:12px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);margin-top:16px;outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
input.ans:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-line)}
.fb{border-radius:var(--r-md);padding:12px 16px;margin-top:16px;font-size:15px}
.fb.ok{background:var(--ok-soft)}
.fb.ng{background:var(--ng-soft)}
.fb.warn{background:var(--warn-soft)}
.prog{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 16px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s var(--ease)}
.passage{background:var(--surface-2);border-radius:var(--r-md);padding:16px;font-size:15px;margin-bottom:16px;max-height:45vh;overflow:auto}
.passage .gloss{font-size:13px;color:var(--ink-3);margin-top:8px}
table.info td,table.info th{padding:8px}

/* 弱點條 */
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* 家庭樹 */
.tree svg{width:100%;height:auto;display:block;color:var(--ink)}
.tree .pn{cursor:pointer}
.tree .pn circle{transition:fill .25s var(--ease)}
.relbox{min-height:64px}
.big{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent)}
.center{text-align:center}
.score{font-size:48px;font-weight:700;letter-spacing:-.02em;color:var(--accent);line-height:1.2}
label.row{color:var(--ink-2);font-size:14px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>

<script>
const D = {"concepts": {"V-SP": {"name": "單字拼字", "g": "", "tip": "聽到發音先拆音節，再對照字母。容易錯的字：handsome（d 不發音）、cousin（ou 唸 /ʌ/）、daughter（gh 不發音）、junior。"}, "V-POS": {"name": "詞性", "g": "", "tip": "人、事、物＝<b>n.</b>（名詞）；形容人事物的樣子＝<b>adj.</b>（形容詞）；動作＝<b>v.</b>（動詞）。看例句裡這個字在做什麼。"}, "V-ZH": {"name": "中文字義", "g": "", "tip": "把例句整句讀一遍，再決定字義。英文一個字常有好幾個意思，例如 short＝矮的／短的。"}, "PL-REG": {"name": "規則複數", "g": "plural", "tip": "一般加 <b>-s</b>；字尾 s、x、sh、ch 加 <b>-es</b>（class→classes）；子音＋y 改 y 為 i 加 <b>-es</b>（family→families）；f／fe 改 <b>-ves</b>（wife→wives）。"}, "PL-IRR": {"name": "特殊複數", "g": "plural", "tip": "不加 s 的字要整個背：man→<b>men</b>、woman→<b>women</b>、child→<b>children</b>。🔴 不可以寫 mans、childs、childrens。"}, "BE-AGR": {"name": "主詞和 be 動詞的搭配", "g": "be-agr", "tip": "I 配 <b>am</b>；you 和所有複數（we、they、兩個人以上）配 <b>are</b>；he、she、it、一個人名配 <b>is</b>。先找主詞，再數是一個還是很多個。"}, "BE-NEG": {"name": "否定句 not 的位置", "g": "be-pos", "tip": "not 永遠放在 be 動詞的<b>後面</b>：He is <b>not</b>…。I am not 只能縮成 <b>I'm not</b>，沒有 amn't。"}, "BE-Q": {"name": "問句 be 動詞的位置", "g": "be-pos", "tip": "把 be 動詞<b>搬到句首</b>，其他字順序不動，句尾改問號：He is a cook. → <b>Is</b> he a cook? 有 be 動詞就<b>不要</b>加 do。"}, "BE-ANS": {"name": "簡答", "g": "be-pos", "tip": "Yes／No 後面用<b>代名詞</b>（he／she／they），不用人名。肯定簡答<b>不能縮寫</b>：Yes, he is.（✗ Yes, he's.）；否定可以：No, he isn't."}, "POSS": {"name": "所有格", "g": "poss", "tip": "後面<b>接名詞</b>、要說「誰的」就用所有格：my、your、his、her、its、our、their；人名加 <b>'s</b>（Nick's）。🔴 its＝牠的，it's＝it is。"}, "PRON": {"name": "人稱代名詞", "g": "poss", "tip": "當主詞、後面接 be 動詞 → 用 I／you／he／she／it／we／they。男生 he、女生 she、動物或東西 it、兩個以上 they。"}, "FAM-WORD": {"name": "稱謂單字", "g": "family", "tip": "男女成對背：father／mother、son／daughter、brother／sister、uncle／aunt、husband／wife、grandson／granddaughter。cousin 不分男女。"}, "FAM-FLIP": {"name": "換角度的親屬關係", "g": "family", "tip": "A is B's father → 反過來 B is A's son／daughter。換角度時看<b>新的主詞是男是女</b>，再找成對的那個字。"}, "WH": {"name": "疑問詞選擇", "g": "wh", "tip": "問<b>人</b>用 Who；問<b>東西、名字、職業</b>用 What；問<b>年紀</b>用 How old。看答句在回答什麼，就知道問句用哪個字。Who 問句不能用 Yes／No 回答。"}, "DEM": {"name": "this／that／these／those", "g": "dem", "tip": "近的用 this（一個）／these（很多個），遠的用 that／those。<b>回答時 this、that 換成 it；these、those 換成 they</b>。🔴 問 What are these? 不能回答 Those are…。"}, "PHR": {"name": "片語", "g": "", "tip": "片語要整組背，中間的字不能省：take care <b>of</b>、Nice to meet you, <b>too</b>、be <b>from</b>。"}, "MULTI": {"name": "一字多義", "g": "", "tip": "同一個字在不同句子裡意思和詞性會變，例如 cook 是「廚師」(n.)，也可以是「煮」(v.)。先看這個字前面有沒有 a／the（有＝名詞）。"}, "ORDER": {"name": "句子語序", "g": "adj", "tip": "形容詞放在名詞<b>前面</b>：a <b>tall</b> boy（✗ a boy tall）。冠詞 a／an 放在最前面：a tall boy。"}, "A-AN": {"name": "a／an", "g": "a-an", "tip": "看<b>緊接在後面那個字</b>的發音：母音開頭用 <b>an</b>（an old man、an aunt），子音開頭用 <b>a</b>（a young man）。"}, "CONJ": {"name": "and／but／too", "g": "conj", "tip": "意思一樣、往同方向 → <b>and</b>；意思相反 → <b>but</b>；「也」放句尾、前面加逗號 → <b>, too</b>。"}, "MECH": {"name": "大小寫和標點", "g": "mech", "tip": "①句首第一個字母大寫 ②人名、I 永遠大寫 ③句尾一定要有句點或問號。段考翻譯題沒寫標點會扣分。"}}, "exam": {"listen": 15, "mc": 20, "read": 10, "hand": 5, "weight": {"listen": 2, "mc": 2, "read": 2, "hand": 2}}, "lessons": [{"id": "L1", "short": "Lesson 1", "title": "Lesson 1　Who's That Young Man?", "sub": "課本 p.9–22｜初次見面・請多指教｜Nick 這一家", "scope": ["L1"], "words": [{"sec": "親屬", "w": "family", "pos": "n.", "zh": "家人；家庭", "ex": "My family is warm.", "exz": "我的家庭很溫暖。", "pl": "families", "plr": "ies", "der": ["the Lin family 林家（＝the Lins）", "family name 姓氏"], "note": "the Lin family 後面接 is；the Lins 後面接 are", "tex": "", "posq": true, "cap": 45}, {"sec": "親屬", "w": "father", "pos": "n.", "zh": "父親", "ex": "My father is a nurse.", "exz": "我爸爸是護理師。", "pl": "fathers", "plr": "s", "der": ["dad 爸爸（口語）", "grandfather 祖父"], "note": "", "tex": "Paul is my father.", "posq": true, "cap": 15}, {"sec": "親屬", "w": "dad", "pos": "n.", "zh": "爸爸", "ex": "My dad is tall.", "exz": "我爸爸很高。", "pl": "dads", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 8}, {"sec": "親屬", "w": "mother", "pos": "n.", "zh": "母親", "ex": "My mother is a doctor.", "exz": "我媽媽是醫生。", "pl": "mothers", "plr": "s", "der": ["mom 媽媽（口語）", "grandmother 祖母"], "note": "", "tex": "Lily is my mother.", "posq": true, "cap": 14}, {"sec": "親屬", "w": "mom", "pos": "n.", "zh": "媽媽", "ex": "My mom is beautiful.", "exz": "我媽媽很漂亮。", "pl": "moms", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 15}, {"sec": "親屬", "w": "parent", "pos": "n.", "zh": "雙親之一", "ex": "My parents are nice.", "exz": "我的爸媽人很好。", "pl": "parents", "plr": "s", "der": ["parents 父母（兩個人）", "grandparent 祖父母之一"], "note": "爸爸＋媽媽兩個人要用 parents", "tex": "", "posq": true, "cap": 24}, {"sec": "親屬", "w": "brother", "pos": "n.", "zh": "哥哥；弟弟", "ex": "Eddie is my brother.", "exz": "Eddie 是我的哥哥。", "pl": "brothers", "plr": "s", "der": [], "note": "英文不分哥哥、弟弟", "tex": "Eddie is my brother.", "posq": true, "cap": 17}, {"sec": "親屬", "w": "sister", "pos": "n.", "zh": "姊姊；妹妹", "ex": "Bella is my sister.", "exz": "Bella 是我的姊姊。", "pl": "sisters", "plr": "s", "der": [], "note": "英文不分姊姊、妹妹", "tex": "", "posq": true, "cap": 15}, {"sec": "親屬", "w": "son", "pos": "n.", "zh": "兒子", "ex": "Nick is Paul's son.", "exz": "Nick 是 Paul 的兒子。", "pl": "sons", "plr": "s", "der": ["grandson 孫子"], "note": "", "tex": "", "posq": true, "cap": 10}, {"sec": "親屬", "w": "daughter", "pos": "n.", "zh": "女兒", "ex": "Bella is Lily's daughter.", "exz": "Bella 是 Lily 的女兒。", "pl": "daughters", "plr": "s", "der": ["granddaughter 孫女"], "note": "gh 不發音", "tex": "", "posq": true, "cap": 8}, {"sec": "親屬", "w": "child", "pos": "n.", "zh": "孩子", "ex": "The child is cute.", "exz": "那個孩子很可愛。", "pl": "children", "plr": "irr", "der": ["grandchild 孫子女", "children 孩子們（複數）"], "note": "複數是 children，不加 s", "tex": "", "posq": true, "cap": 32}, {"sec": "親屬", "w": "husband", "pos": "n.", "zh": "丈夫", "ex": "Paul is Lily's husband.", "exz": "Paul 是 Lily 的丈夫。", "pl": "husbands", "plr": "s", "der": [], "note": "", "tex": "This is my husband, Paul.", "posq": true, "cap": 2}, {"sec": "親屬", "w": "wife", "pos": "n.", "zh": "妻子", "ex": "Lily is Paul's wife.", "exz": "Lily 是 Paul 的妻子。", "pl": "wives", "plr": "ves", "der": [], "note": "f／fe 結尾改 -ves", "tex": "This is my wife, Lily.", "posq": true, "cap": 8}, {"sec": "親屬", "w": "grandfather", "pos": "n.", "zh": "祖父；外祖父", "ex": "My grandfather is seventy-five.", "exz": "我爺爺七十五歲。", "pl": "grandfathers", "plr": "s", "der": ["grandpa 爺爺（口語）", "grand- 字首＝隔一代"], "note": "", "tex": "My grandfather is a farmer.", "posq": true, "cap": 4}, {"sec": "親屬", "w": "grandmother", "pos": "n.", "zh": "祖母；外祖母", "ex": "My grandmother is a cook.", "exz": "我奶奶是廚師。", "pl": "grandmothers", "plr": "s", "der": ["grandma 奶奶（口語）"], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "親屬", "w": "grandson", "pos": "n.", "zh": "孫子", "ex": "Nick is Dave's grandson.", "exz": "Nick 是 Dave 的孫子。", "pl": "grandsons", "plr": "s", "der": ["grand-＋son"], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "親屬", "w": "granddaughter", "pos": "n.", "zh": "孫女", "ex": "Ann is Tina's granddaughter.", "exz": "Ann 是 Tina 的孫女。", "pl": "granddaughters", "plr": "s", "der": ["grand-＋daughter"], "note": "中間有兩個 d", "tex": "", "posq": true, "cap": 0}, {"sec": "親屬", "w": "uncle", "pos": "n.", "zh": "叔叔；伯伯；舅舅；姑丈；姨丈", "ex": "Frank is Nick's uncle.", "exz": "Frank 是 Nick 的叔叔。", "pl": "uncles", "plr": "s", "der": [], "note": "英文一個字全包", "tex": "", "posq": true, "cap": 4}, {"sec": "親屬", "w": "aunt", "pos": "n.", "zh": "嬸嬸；伯母；姑姑；阿姨；舅媽", "ex": "Mia is Nick's aunt.", "exz": "Mia 是 Nick 的嬸嬸。", "pl": "aunts", "plr": "s", "der": [], "note": "母音開頭，前面用 an：an aunt", "tex": "", "posq": true, "cap": 4}, {"sec": "親屬", "w": "cousin", "pos": "n.", "zh": "堂（表）兄弟姊妹", "ex": "Ann is Nick's cousin.", "exz": "Ann 是 Nick 的堂妹。", "pl": "cousins", "plr": "s", "der": [], "note": "不分男女、不分堂表；ou 唸 /ʌ/", "tex": "This is Nick. He's my cousin.", "posq": true, "cap": 0}, {"sec": "人物外表", "w": "man", "pos": "n.", "zh": "男人", "ex": "That man is my uncle.", "exz": "那個男人是我叔叔。", "pl": "men", "plr": "irr", "der": ["men 男人們（複數）", "young man 年輕男子"], "note": "複數 men，不加 s", "tex": "Who's that young man?", "posq": true, "cap": 34}, {"sec": "人物外表", "w": "woman", "pos": "n.", "zh": "女人", "ex": "She is a beautiful woman.", "exz": "她是個美麗的女人。", "pl": "women", "plr": "irr", "der": ["women 女人們（複數，唸 /ˈwɪmɪn/）"], "note": "複數 women，不加 s", "tex": "She is a beautiful woman.", "posq": true, "cap": 32}, {"sec": "人物外表", "w": "friend", "pos": "n.", "zh": "朋友", "ex": "Scott is Bella's friend.", "exz": "Scott 是 Bella 的朋友。", "pl": "friends", "plr": "s", "der": [], "note": "", "tex": "He's Bella's friend, and his name is Scott.", "posq": true, "cap": 43}, {"sec": "人物外表", "w": "young", "pos": "adj.", "zh": "年輕的", "ex": "My PE teacher is young.", "exz": "我的體育老師很年輕。", "pl": "", "plr": "none", "der": ["反義：old 年老的"], "note": "", "tex": "Who's that young man?", "posq": true, "cap": 15}, {"sec": "人物外表", "w": "old", "pos": "adj.", "zh": "年老的；……歲的", "ex": "My grandfather is old.", "exz": "我爺爺年紀大了。", "pl": "", "plr": "none", "der": ["How old are you? 你幾歲？", "反義：young 年輕的"], "note": "母音開頭：an old man", "tex": "", "posq": true, "cap": 38}, {"sec": "人物外表", "w": "tall", "pos": "adj.", "zh": "高的", "ex": "He is tall and handsome.", "exz": "他又高又帥。", "pl": "", "plr": "none", "der": ["反義：short 矮的"], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "人物外表", "w": "short", "pos": "adj.", "zh": "矮的；短的", "ex": "My brother is short.", "exz": "我弟弟很矮。", "pl": "", "plr": "none", "der": ["反義：tall 高的（人）／long 長的（東西）"], "note": "", "tex": "", "posq": true, "cap": 7}, {"sec": "人物外表", "w": "thin", "pos": "adj.", "zh": "瘦的", "ex": "The cat is thin.", "exz": "那隻貓很瘦。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "人物外表", "w": "handsome", "pos": "adj.", "zh": "英俊的", "ex": "Scott is handsome.", "exz": "Scott 很帥。", "pl": "", "plr": "none", "der": ["多形容男生；女生用 beautiful"], "note": "d 不發音", "tex": "He's tall and handsome.", "posq": true, "cap": 4}, {"sec": "人物外表", "w": "beautiful", "pos": "adj.", "zh": "漂亮的；美麗的", "ex": "My aunt is beautiful.", "exz": , "der": [], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "學校對話", "w": "same", "pos": "adj.", "zh": "一樣的", "ex": "We are in the same class.", "exz": "我們同班。", "pl": "", "plr": "none", "der": ["前面幾乎都加 the：the same"], "note": "", "tex": "We're in the same class again!", "posq": true, "cap": 41}, {"sec": "學校對話", "w": "again", "pos": "adv.", "zh": "再一次", "ex": "We're in the same class again!", "exz": "我們又同班了！", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 23}, {"sec": "學校對話", "w": "news", "pos": "n.", "zh": "消息；新聞", "ex": "Good news! Bella is our teacher.", "exz": "好消息！Bella 是我們的老師。", "pl": "", "plr": "unc", "der": ["Good news! 好消息！"], "note": "字尾有 s 但不可數，沒有複數", "tex": "", "posq": true, "cap": 39}, {"sec": "學校對話", "w": "problem", "pos": "n.", "zh": "問題", "ex": "What's the problem?", "exz": "怎麼了？", "pl": "problems", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 40}, {"sec": "學校對話", "w": "PE", "pos": "n.", "zh": "體育", "ex": "PE is fun.", "exz": "體育課很好玩。", "pl": "", "plr": "unc", "der": ["physical education 的縮寫"], "note": "", "tex": "", "posq": true, "cap": 2}, {"sec": "學校對話", "w": "really", "pos": "adv.", "zh": "真地；真的", "ex": "Really? He is our teacher?", "exz": "真的嗎？他是我們的老師？", "pl": "", "plr": "none", "der": ["Really? 真的嗎？"], "note": "", "tex": "", "posq": true, "cap": 28}, {"sec": "學校對話", "w": "too", "pos": "adv.", "zh": "也", "ex": "She's a strict teacher, too.", "exz": "她也是個嚴格的老師。", "pl": "", "plr": "none", "der": ["放句尾，前面加逗號：…, too."], "note": "", "tex": "", "posq": true, "cap": 51}, {"sec": "學校對話", "w": "junior high school", "pos": "n.", "zh": "國民中學", "ex": "I'm a junior high school student.", "exz": "我是國中生。", "pl": "", "plr": "none", "der": ["senior high school 高中"], "note": "", "tex": "", "posq": true, "cap": 2}, {"sec": "學校對話", "w": "senior high school", "pos": "n.", "zh": "高級中學", "ex": "Eddie is a senior high school student.", "exz": "Eddie 是高中生。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "功能字", "w": "who", "pos": "pron.", "zh": "誰", "ex": "Who's that young man?", "exz": "那個年輕男子是誰？", "pl": "", "plr": "none", "der": ["who's＝who is"], "note": "", "tex": "", "posq": false, "cap": 83}, {"sec": "功能字", "w": "our", "pos": "pron.", "zh": "我們的", "ex": "He's our new PE teacher.", "exz": "他是我們的新體育老師。", "pl": "", "plr": "none", "der": ["we 我們 → our 我們的"], "note": "", "tex": "", "posq": false, "cap": 51}], "texts": [{"id": "d1", "title": "Dialogue 1（At school）", "src": "課本 p.11", "lines": [{"sp": "Ann", "en": "Good morning, Nick.", "zh": "早安，Nick。", "hl": false, "note": ""}, {"sp": "Nick", "en": "Good morning, Ann.", "zh": "早安，Ann。", "hl": false, "note": ""}, {"sp": "Ann", "en": "Nick, who's that young man? He's tall and handsome.", "zh": "Nick，那位年輕男子是誰？他又高又帥。", "hl": true, "note": "who's＝who is；He's＝He is。tall and handsome：兩個形容詞用 and 連起來。"}, {"sp": "Nick", "en": "He's our new PE teacher.", "zh": "他是我們的新體育老師。", "hl": true, "note": "our 是「我們的」，後面接名詞 teacher。"}, {"sp": "Ann", "en": "Really?", "zh": "真的嗎？", "hl": false, "note": ""}, {"sp": "Nick", "en": "Yes, he's Bella's friend, and his name is Scott.", "zh": "是的，他是 Bella 的朋友，他的名字叫 Scott。", "hl": false, "note": "同一句有兩種 's：he's＝he is；Bella's＝Bella 的（所有格）。he → his（他的）。"}]}, {"id": "d2", "title": "Dialogue 2（In the classroom）", "src": "課本 p.12", "lines": [{"sp": "Rita", "en": "Ann, we're in the same class again!", "zh": "Ann，我們又同班了！", "hl": true, "note": "the same class：same 前面要加 the。"}, {"sp": "Ann", "en": "Yeah, it's great! Hi, Rita. This is Nick. He's my cousin. He's in Class 701.", "zh": "對啊，太棒了！嗨，Rita。這是 Nick，他是我的堂哥。他在 701 班。", "hl": true, "note": "介紹別人：This is…＋He's…。"}, {"sp": "Rita", "en": "Nice to meet you, Nick. I'm Rita.", "zh": "很高興認識你，Nick。我是 Rita。", "hl": false, "note": ""}, {"sp": "Nick", "en": "Nice to meet you, too, Rita.", "zh": "我也很高興認識妳，Rita。", "hl": false, "note": "回答 Nice to meet you. 要加 too。"}, {"sp": "Ann", "en": "Hey, Rita. Good news! Bella is our English teacher!", "zh": "嘿，Rita。好消息！Bella 是我們的英文老師！", "hl": false, "note": ""}, {"sp": "Nick", "en": "Oh, no. That's not good.", "zh": "喔，不。那可不妙。", "hl": false, "note": ""}, {"sp": "Ann", "en": "What's the problem? She's a great teacher.", "zh": "有什麼問題？她是很棒的老師。", "hl": false, "note": ""}, {"sp": "Nick", "en": "Well... she's a strict teacher, too.", "zh": "嗯……她也是個嚴格的老師。", "hl": false, "note": ""}, {"sp": "Bella", "en": "Nick!", "zh": "Nick！", "hl": false, "note": ""}]}, {"id": "rd", "title": "Reading〈The Lins〉", "src": "課本 p.17", "lines": [{"sp": "", "en": "Hi, I'm Nick. I'm a junior high school student. I'm from a warm family.", "zh": "嗨，我是 Nick。我是國中生。我來自一個溫暖的家庭。", "hl": true, "note": "the Lins＝林家人，後面接複數 are；the Lin family＝林家，後面接單數 is。"}, {"sp": "", "en": "My grandfather is a farmer. My grandmother is a cook. They are nice.", "zh": "我的祖父是農夫。我的祖母是廚師。他們人很好。", "hl": false, "note": "主詞換成 They，be 動詞就要用 are。"}, {"sp": "", "en": "Paul is my father. He is a tall man. He is a nurse.", "zh": "Paul 是我的爸爸。他是個高個子的男人。他是護理師。", "hl": false, "note": ""}, {"sp": "", "en": "Lily is my mother. She is a beautiful woman. She is a doctor.", "zh": "Lily 是我的媽媽。她是個美麗的女人。她是醫生。", "hl": true, "note": ""}, {"sp": "", "en": "Bella is my sister. She is my English teacher, too.", "zh": "Bella 是我的姊姊。她也是我的英文老師。", "hl": false, "note": ""}, {"sp": "", "en": "Eddie is my brother. He's a senior high school student.", "zh": "Eddie 是我的哥哥。他是高中生。", "hl": false, "note": ""}, {"sp": "", "en": "Abby is our pet pig. She's cute.", "zh": "Abby 是我們的寵物豬。牠很可愛。", "hl": false, "note": ""}]}, {"id": "ru", "title": "Read Up〈The Park Family〉", "src": "課本 p.21（選讀）", "lines": [{"sp": "", "en": "Hi, I'm Gina Park. I'm a junior high school student.", "zh": "嗨，我是 Gina Park。我是國中生。", "hl": false, "note": ""}, {"sp": "", "en": "My dad is a firefighter, and my mom is a teacher.", "zh": "我爸爸是消防員，我媽媽是老師。", "hl": false, "note": ""}, {"sp": "", "en": "I have two brothers and one sister.", "zh": "我有兩個哥哥和一個姊姊。", "hl": false, "note": ""}, {"sp": "", "en": "My brothers work at a zoo. They take care of the animals there.", "zh": "我的哥哥們在動物園工作。他們在那裡照顧動物。", "hl": false, "note": "there＝前一句的 a zoo（代詞指涉，會考題型）。take care of＝照顧。"}, {"sp": "", "en": "My sister is a waste collector. They are my family. What about your family?", "zh": "我姊姊是清潔隊員。他們是我的家人。你的家人呢？", "hl": false, "note": ""}]}], "grammar": [{"id": "be-agr", "name": "be 動詞的搭配", "icon": "🔗", "c": ["BE-AGR"], "intro": "be 動詞有三個長相：am、is、are。用哪一個，<b>完全由主詞決定</b>。", "table": [["主詞", "be 動詞", "例句"], ["I", "am", "I <b>am</b> Nick."], ["he／she／it／一個人名", "is", "Ann <b>is</b> my cousin."], ["you", "are", "You <b>are</b> my friend."], ["we／they／兩個人以上", "are", "Ann and Henry <b>are</b> cousins."]], "flows": [{"title": "主詞從一個變成兩個", "steps": [{"tokens": ["Ann", "is", "my", "cousin", "."], "hl": [0, 1], "note": "主詞 Ann 是<b>一個人</b> → 用 is"}, {"tokens": ["Ann", "and", "Henry", "are", "my", "cousins", "."], "hl": [0, 1, 2, 3], "note": "主詞變成 Ann and Henry＝<b>兩個人</b> → is 要改成 are"}, {"tokens": ["They", "are", "my", "cousins", "."], "hl": [0, 1], "note": "兩個人可以用 They 代替 → 還是 are；cousin 也要加 s"}]}, {"title": "the Lins 和 the Lin family（課堂筆記）", "steps": [{"tokens": ["The", "Lins", "are", "nice", "."], "hl": [1, 2], "note": "the Lins＝林家的<b>每一個人</b>（複數）→ are"}, {"tokens": ["The", "Lin", "family", "is", "warm", "."], "hl": [2, 3], "note": "the Lin family＝林家這<b>一個</b>家庭 → is"}]}], "tutor": [{"say": "先考你：「Nick and Eddie ___ brothers.」空格要填什麼？", "ch": [{"t": "is", "ok": false, "re": "Nick and Eddie 是幾個人？兩個喔！一個人才用 is。"}, {"t": "are", "ok": true, "re": "對！兩個人以上就用 are。你是先數主詞才決定的，這就是訣竅。"}, {"t": "am", "ok": false, "re": "am 只跟 I 在一起。這裡的主詞是 Nick and Eddie。"}]}, {"say": "那「My family ___ warm.」呢？family 裡面明明有很多人……", "ch": [{"t": "are", "ok": false, "re": "陷阱！family 指的是「一個家庭」，算一個 → is。如果是 the Lins（林家每個人）才用 are。"}, {"t": "is", "ok": true, "re": "沒錯！family＝一個家庭，用 is。課本 The Lins 那課的筆記就是在講這個。"}]}, {"say": "最後一題：「You and I ___ in the same class.」", "ch": [{"t": "am", "ok": false, "re": "I 單獨出現才用 am。You and I 是兩個人＝we。"}, {"t": "are", "ok": true, "re": "對！You and I＝we，用 are。主詞裡有 I 也不一定用 am，要看整個主詞。"}, {"t": "is", "ok": false, "re": "兩個人不會用 is 喔。"}]}]}, {"id": "be-pos", "name": "be 動詞的位置（否定・問句・簡答）", "icon": "🔀", "c": ["BE-NEG", "BE-Q", "BE-ANS"], "intro": "同一個句子可以變出四種樣子。<b>其他字都不動，只有 be 動詞在搬家</b>，跟著字卡一步一步看。", "table": [["句型", "怎麼變", "例句"], ["直述句", "主詞＋be", "He <b>is</b> a cook."], ["否定句", "be 後面加 not", "He <b>is not</b> a cook.（＝He isn't／He's not）"], ["問句", "be 搬到句首，句尾改問號", "<b>Is</b> he a cook?"], ["簡答", "Yes／No＋代名詞＋be", "Yes, he <b>is</b>.／No, he <b>isn't</b>."]], "flows": [{"title": "直述句 → 否定句", "steps": [{"tokens": ["He", "is", "a", "cook", "."], "hl": [1], "note": "直述句：找到 be 動詞 <b>is</b>"}, {"tokens": ["He", "is", "not", "a", "cook", "."], "hl": [2], "note": "否定句：在 is 的<b>後面</b>插入 not"}, {"tokens": ["He", "isn't", "a", "cook", "."], "hl": [1], "note": "is not 可以縮成 <b>isn't</b>"}]}, {"title": "直述句 → 問句 → 簡答", "steps": [{"tokens": ["He", "is", "a", "cook", "."], "hl": [1], "note": "直述句：找到 be 動詞 <b>is</b>"}, {"tokens": ["Is", "he", "a", "cook", "?"], "hl": [0, 4], "note": "問句：is 搬到<b>句首</b>（大寫 Is），he 變小寫，句點改<b>問號</b>"}, {"tokens": ["Yes", ",", "he", "is", "."], "hl": [2, 3], "note": "肯定簡答：Yes, he is.（🔴 不能縮成 he's）"}, {"tokens": ["No", ",", "he", "isn't", "."], "hl": [3], "note": "否定簡答：No, he isn't.（可以縮寫）"}]}, {"title": "主詞是人名時的簡答", "steps": [{"tokens": ["Is", "Bella", "your", "sister", "?"], "hl": [1], "note": "問句的主詞是人名 Bella"}, {"tokens": ["Yes", ",", "she", "is", "."], "hl": [2], "note": "簡答要把 Bella 換成<b>代名詞</b> she"}]}, {"title": "I 的否定句", "steps": [{"tokens": ["I", "am", "a", "student", "."], "hl": [1], "note": "I 配 am"}, {"tokens": ["I", "am", "not", "a", "teacher", "."], "hl": [2], "note": "否定：am 後面加 not"}, {"tokens": ["I'm", "not", "a", "teacher", "."], "hl": [0], "note": "只能縮成 <b>I'm not</b>（🔴 沒有 amn't）"}]}], "tutor": [{"say": "「She is your aunt.」要改成問句，第一步做什麼？", "ch": [{"t": "在句首加 Do", "ok": false, "re": "有 be 動詞就不需要 do。Do 是一般動詞用的（七下才學）。"}, {"t": "把 is 搬到句首", "ok": true, "re": "對！Is she your aunt? 其他字的順序都不動。"}, {"t": "把 she 搬到句尾", "ok": false, "re": "主詞不用動喔，搬家的只有 be 動詞。"}]}, {"say": "「Is Frank Henry's father?」肯定的簡答是哪一個？", "ch": [{"t": "Yes, Frank is.", "ok": false, "re": "簡答要用代名詞，不重複人名。Frank 是男生 → he。"}, {"t": "Yes, he's.", "ok": false, "re": "🔴 肯定簡答不能縮寫，這是段考最愛考的陷阱。"}, {"t": "Yes, he is.", "ok": true, "re": "完美！代名詞 he＋不縮寫的 is。"}]}, {"say": "「I am a cook.」改否定，下面哪一個是錯的？", "ch": [{"t": "I am not a cook.", "ok": false, "re": "這個是對的喔，再看看其他選項。"}, {"t": "I'm not a cook.", "ok": false, "re": "這個也對，I am → I'm。"}, {"t": "I amn't a cook.", "ok": true, "re": "答對了，這個是錯的！am not 不能縮成 amn't。"}]}]}, {"id": "poss", "name": "所有格和代名詞", "icon": "👜", "c": ["POSS", "PRON"], "intro": "你覺得所有格很難，是因為不知道<b>什麼時候要用</b>。其實只要看一件事：<b>後面有沒有接名詞</b>。", "table": [["主格（當主詞）", "所有格（誰的）", "例句"], ["I", "my", "<b>My</b> name is Nick."], ["you", "your", "Is this <b>your</b> pig?"], ["he", "his", "<b>His</b> name is Scott."], ["she", "her", "<b>Her</b> name is Rita."], ["it", "its", "<b>Its</b> name is Abby."], ["we", "our", "He's <b>our</b> teacher."], ["they", "their", "<b>Their</b> son is Nick."], ["人名 Nick", "Nick's", "Dave is <b>Nick's</b> grandfather."]], "flows": [{"title": "判斷：要用 he 還是 his？", "steps": [{"tokens": ["___", "is", "tall", "."], "hl": [0], "note": "空格後面是 <b>is</b>（be 動詞）→ 這裡需要一個「主詞」"}, {"tokens": ["He", "is", "tall", "."], "hl": [0], "note": "主詞 → 用主格 <b>He</b>"}, {"tokens": ["___", "name", "is", "Scott", "."], "hl": [0, 1], "note": "空格後面是 <b>name</b>（名詞）→ 要說「誰的」名字"}, {"tokens": ["His", "name", "is", "Scott", "."], "hl": [0], "note": "名詞前面 → 用所有格 <b>His</b>"}]}, {"title": "一句話裡的兩種 's（課本 p.11）", "steps": [{"tokens": ["he's", "Bella's", "friend"], "hl": [0], "note": "<b>he's</b>＝he is（後面沒有名詞，是縮寫）"}, {"tokens": ["he's", "Bella's", "friend"], "hl": [1], "note": "<b>Bella's</b>＋friend（後面有名詞）＝Bella 的朋友（所有格）"}]}, {"title": "its 和 it's", "steps": [{"tokens": ["It's", "my", "pig", "."], "hl": [0], "note": "<b>It's</b>＝It is（有撇號＝縮寫）"}, {"tokens": ["Its", "name", "is", "Abby", "."], "hl": [0, 1], "note": "<b>Its</b>＋name＝牠的名字（沒撇號＝所有格）"}]}, {"title": "兩個人的所有格", "steps": [{"tokens": ["Paul", "and", "Lily", "are", "Nick's", "parents", "."], "hl": [4], "note": "Nick's＝Nick 的"}, {"tokens": ["Their", "son", "is", "Nick", "."], "hl": [0], "note": "Paul and Lily 是兩個人 → 他們的＝<b>Their</b>"}]}], "tutor": [{"say": "「Ann is my cousin. ___ is twelve.」空格後面是什麼？", "ch": [{"t": "是名詞", "ok": false, "re": "再看一次，空格後面是 is。"}, {"t": "是 be 動詞 is", "ok": true, "re": "對！後面是 be 動詞，所以要一個主詞。Ann 是女生 → She。"}]}, {"say": "那「Ann is my cousin. ___ mother is Mia.」呢？", "ch": [{"t": "She", "ok": false, "re": "空格後面是 mother（名詞），要說「她的」媽媽。"}, {"t": "Her", "ok": true, "re": "答對！名詞前面用所有格。Her mother＝她的媽媽。"}, {"t": "She's", "ok": false, "re": "She's＝She is，「她是媽媽」意思就不對了。"}]}, {"say": "「Look at the dog. ___ name is Lucky.」", "ch": [{"t": "It's", "ok": false, "re": "It's＝It is。「它是名字」不通喔。"}, {"t": "Its", "ok": true, "re": "對！Its＋name＝牠的名字。沒撇號才是所有格。"}, {"t": "His", "ok": false, "re": "動物一般用 it、its。"}]}]}, {"id": "family", "name": "🌳 家庭樹專區", "icon": "🌳", "c": ["FAM-WORD", "FAM-FLIP"], "intro": "家庭樹的題目要做三件事：<b>①看懂線 ②叫得出稱謂 ③換個人當主詞也不亂</b>。下面先學怎麼看線，再到互動家庭樹點點看。", "table": [["男生", "女生", "說明"], ["father（dad）", "mother（mom）", "父母＝parents"], ["son", "daughter", "兒子／女兒"], ["brother", "sister", "不分大小"], ["husband", "wife", "夫妻"], ["grandfather", "grandmother", "隔一代 grand-"], ["grandson", "granddaughter", "孫子／孫女"], ["uncle", "aunt", "爸媽的兄弟姊妹（和他們的另一半）"], ["cousin", "cousin", "uncle／aunt 的小孩，不分男女"]], "flows": [{"title": "家庭樹的線怎麼看", "steps": [{"tokens": ["Dave", "＝", "Tina"], "hl": [1], "note": "<b>橫線</b>連起來的兩個人＝夫妻（husband／wife）"}, {"tokens": ["Dave＆Tina", "↓", "Paul", "Frank"], "hl": [1], "note": "從夫妻中間<b>往下</b>的線＝他們的孩子（son／daughter）"}, {"tokens": ["Paul", "—", "Frank"], "hl": [1], "note": "同一條橫桿下面的人＝兄弟姊妹（brother／sister）"}]}, {"title": "換角度：Paul is Nick's father.", "steps": [{"tokens": ["Paul", "is", "Nick's", "father", "."], "hl": [0, 3], "note": "Paul（男）是 Nick 的<b>爸爸</b>"}, {"tokens": ["Nick", "is", "Paul's", "___", "."], "hl": [0, 3], "note": "換 Nick 當主詞：Nick 是男生，爸爸的「相反」是兒子"}, {"tokens": ["Nick", "is", "Paul's", "son", "."], "hl": [3], "note": "→ <b>son</b>（如果是 Bella 就是 daughter）"}]}, {"title": "cousin 是怎麼來的", "steps": [{"tokens": ["Frank", "is", "Nick's", "uncle", "."], "hl": [3], "note": "Frank 是 Nick 爸爸的弟弟 → uncle"}, {"tokens": ["Ann", "is", "Frank's", "daughter", "."], "hl": [3], "note": "Ann 是 Frank 的女兒"}, {"tokens": ["Ann", "is", "Nick's", "cousin", "."], "hl": [3], "note": "uncle 的小孩＝<b>cousin</b>（不分男女）"}]}], "tutor": [{"say": "Mia 是 Ann 的媽媽，Frank 是 Ann 的爸爸。Mia 是 Frank 的什麼人？", "ch": [{"t": "sister", "ok": false, "re": "Mia 和 Frank 是 Ann 的爸媽，他們是夫妻喔。"}, {"t": "wife", "ok": true, "re": "對！Mia is Frank's wife. 反過來 Frank is Mia's husband。"}, {"t": "mother", "ok": false, "re": "Mia 是 Ann 的媽媽，不是 Frank 的媽媽。"}]}, {"say": "Dave is Nick's grandfather. 反過來，Nick is Dave's ___?", "ch": [{"t": "grandfather", "ok": false, "re": "換角度後，主詞是 Nick（孫子那一輩）。"}, {"t": "grandson", "ok": true, "re": "答對！Nick 是男生 → grandson。Ann 就是 granddaughter。"}, {"t": "son", "ok": false, "re": "Nick 和 Dave 差兩代，要加 grand-。"}]}, {"say": "Lily is Henry's ___?（提示：Lily 是 Henry 爸爸的哥哥的太太）", "ch": [{"t": "aunt", "ok": true, "re": "完全正確！課本 p.10 Read and Fill In 第 3 題就是這題。"}, {"t": "mother", "ok": false, "re": "Henry 的媽媽是 Mia。"}, {"t": "cousin", "ok": false, "re": "cousin 是同一輩的。Lily 是 Henry 爸媽那一輩。"}]}]}, {"id": "plural", "name": "名詞複數規則", "icon": "🔢", "c": ["PL-REG", "PL-IRR"], "intro": "兩個以上就要用複數。大部分加 s，但有幾種字會變形，還有幾個字<b>完全不照規則</b>，一定要背。", "table": [["規則", "怎麼變", "例子"], ["一般", "加 -s", "cousin → cousins、teacher → teachers"], ["字尾 s／x／sh／ch", "加 -es（因為多一個音 /ɪz/）", "class → classes、box → boxes"], ["子音＋y", "去 y 加 -ies", "family → families、baby → babies"], ["母音＋y", "直接加 -s", "boy → boys、day → days"], ["字尾 f／fe", "去 f(e) 加 -ves", "wife → wives、knife → knives"], ["🔴 不規則", "整個字變，不加 s", "man → <b>men</b>、woman → <b>women</b>、child → <b>children</b>"], ["🔴 不規則（L2 會遇到）", "母音變了", "mouse → <b>mice</b>、foot → feet、tooth → teeth"], ["🔴 單複數同形", "不變", "sheep、fish、deer"], ["不可數", "沒有複數", "news、PE（字尾有 s 的 news 也是不可數）"]], "flows": [{"title": "man 變 men：主詞變複數時，整句都要跟著改", "steps": [{"tokens": ["The", "man", "is", "a", "doctor", "."], "hl": [1, 2], "note": "一個男人：man＋is"}, {"tokens": ["The", "men", "are", "doctors", "."], "hl": [1, 2, 3], "note": "兩個男人：<b>men</b>＋<b>are</b>＋doctor 也加 s，a 拿掉"}]}, {"title": "child 變 children", "steps": [{"tokens": ["The", "child", "is", "cute", "."], "hl": [1, 2], "note": "一個孩子"}, {"tokens": ["The", "children", "are", "cute", "."], "hl": [1, 2], "note": "很多孩子：<b>children</b>（🔴 不是 childs，也不是 childrens）"}]}], "tutor": [{"say": "「My uncle has two ___.（wife）」……等等，這句不合理！換一題：「Mia and Lily are ___.（wife）」", "ch": [{"t": "wifes", "ok": false, "re": "f／fe 結尾要改 -ves。"}, {"t": "wives", "ok": true, "re": "對！wife → wives。Mia and Lily are wives. 她們都是太太。"}]}, {"say": "「Three ___ are in the classroom.（woman）」", "ch": [{"t": "womans", "ok": false, "re": "woman 是不規則複數，不加 s。"}, {"t": "women", "ok": true, "re": "答對！woman → women。注意 women 的 o 唸 /ɪ/。"}, {"t": "womens", "ok": false, "re": "women 已經是複數了，不能再加 s。"}]}, {"say": "Good news! 的 news 是幾個？", "ch": [{"t": "複數，因為有 s", "ok": false, "re": "陷阱！news 字尾有 s，但它是不可數名詞。"}, {"t": "不可數，沒有單複數", "ok": true, "re": "對！所以是 The news <b>is</b> good."}]}]}, {"id": "a-an", "name": "a／an 怎麼選", "icon": "🅰", "c": ["A-AN"], "intro": "不是看字母，是看<b>緊接在後面那個字的發音</b>：母音開頭用 an，子音開頭用 a。", "table": [["後面那個字", "用", "例子"], ["子音開頭", "a", "a cook、a young man、a tall boy"], ["母音開頭", "an", "an aunt、an old man、an English teacher"]], "flows": [{"title": "中間插了形容詞，冠詞跟著變", "steps": [{"tokens": ["a", "man"], "hl": [0, 1], "note": "man 是 m 開頭（子音）→ a"}, {"tokens": ["an", "old", "man"], "hl": [0, 1], "note": "中間插了 old（o 母音開頭）→ 改成 <b>an</b>"}, {"tokens": ["a", "young", "man"], "hl": [0, 1], "note": "插 young（y 子音）→ 還是 a"}]}], "tutor": [{"say": "「My grandmother is ___ old woman.」", "ch": [{"t": "a", "ok": false, "re": "緊接在後面的是 old，o 是母音。"}, {"t": "an", "ok": true, "re": "對！看的是 old 不是 woman。"}]}, {"say": "「Bella is ___ English teacher.」", "ch": [{"t": "a", "ok": false, "re": "English 的 E 是母音開頭喔。"}, {"t": "an", "ok": true, "re": "對！an English teacher。"}]}]}, {"id": "wh", "name": "疑問詞：Who／What／How old", "icon": "❓", "c": ["WH"], "intro": "看答句在回答什麼，就知道要用哪個疑問詞。", "table": [["要問", "疑問詞", "例子"], ["人（是誰、什麼關係）", "Who", "<b>Who</b> is he? — He is my uncle."], ["名字", "What", "<b>What</b>'s your name? — I'm Nick."], ["職業、東西", "What", "<b>What</b> is your father? — He's a nurse."], ["年紀", "How old", "<b>How old</b> is Henry? — He's six."]], "flows": [{"title": "從答句倒推問句", "steps": [{"tokens": ["He", "is", "my", "uncle", "."], "hl": [2, 3], "note": "答句說的是「關係」→ 問人"}, {"tokens": ["Who", "is", "he", "?"], "hl": [0], "note": "→ 用 <b>Who</b>"}, {"tokens": ["He", "is", "seventeen", "."], "hl": [2], "note": "答句說的是「年紀」"}, {"tokens": ["How old", "is", "he", "?"], "hl": [0], "note": "→ 用 <b>How old</b>"}]}], "tutor": [{"say": "A: ___ is that girl? B: She's my cousin, Ann.", "ch": [{"t": "What", "ok": false, "re": "答句在說「她是誰」（關係），問人要用 Who。"}, {"t": "Who", "ok": true, "re": "對！問人用 Who。"}, {"t": "How old", "ok": false, "re": "答句沒有說年紀喔。"}]}, {"say": "A: Who is Mr. Lin? B: ___", "ch": [{"t": "Yes, he is.", "ok": false, "re": "🔴 Who 問句不能用 Yes／No 回答。"}, {"t": "He is my PE teacher.", "ok": true, "re": "對！問「是誰」就回答身分或關係。"}]}]}, {"id": "conj", "name": "and／but／too", "icon": "➕", "c": ["CONJ"], "intro": "連接兩句話時：同方向用 and，相反用 but，「也」用 too 放句尾。", "table": [["用法", "意思", "例子"], ["and", "而且（同方向）", "He is tall <b>and</b> handsome."], ["but", "但是（相反）", "I am tall, <b>but</b> my brother isn't."], [", too", "也（放句尾）", "She's a strict teacher<b>, too</b>."]], "flows": [{"title": "but 後面的句子可以省略", "steps": [{"tokens": ["I", "am", "tall", ",", "but", "my", "brother", "is", "not", "tall", "."], "hl": [4], "note": "意思相反 → but"}, {"tokens": ["I", "am", "tall", ",", "but", "my", "brother", "isn't", "."], "hl": [7], "note": "後面重複的 tall 可以省略"}]}], "tutor": [{"say": "「I am thin, ___ my sister is, ___.」（我很瘦，我妹妹也是）", "ch": [{"t": "but；too", "ok": false, "re": "兩個人都瘦＝同方向，不用 but。"}, {"t": "and；too", "ok": true, "re": "對！同方向 and，「也」用 too 放句尾。"}]}]}, {"id": "adj", "name": "形容詞放哪裡", "icon": "📍", "c": ["ORDER"], "intro": "形容詞有兩個位置：<b>be 動詞後面</b>，或<b>名詞前面</b>。", "table": [["位置", "例子"], ["be 動詞後面", "He is <b>young</b>."], ["a＋形容詞＋名詞", "He is a <b>young</b> man."]], "flows": [{"title": "同一個意思，兩種寫法", "steps": [{"tokens": ["He", "is", "tall", "."], "hl": [2], "note": "tall 放在 is 後面"}, {"tokens": ["He", "is", "a", "tall", "boy", "."], "hl": [2, 3, 4], "note": "加了名詞 boy：a＋tall＋boy（🔴 不是 a boy tall）"}]}], "tutor": [{"say": "「Is Eddie ___?」哪個順序對？", "ch": [{"t": "a boy tall", "ok": false, "re": "中文說「一個男孩高」不通，英文也一樣。形容詞放名詞前面。"}, {"t": "a tall boy", "ok": true, "re": "對！a＋形容詞＋名詞。"}]}]}, {"id": "mech", "name": "大小寫和標點", "icon": "✏", "c": ["MECH"], "intro": "段考的翻譯題、手寫題，<b>沒寫標點就扣分</b>。寫完每一句檢查三件事。", "table": [["檢查", "例子"], ["① 句首大寫", "<b>M</b>y name is Nick."], ["② 人名、地名、I 大寫", "<b>A</b>nn and <b>I</b> are cousins."], ["③ 句尾有句點或問號", "Who is he<b>?</b>"]], "flows": [{"title": "改正這一句", "steps": [{"tokens": ["my", "name", "is", "nick"], "hl": [0, 3], "note": "錯在哪？句首小寫、人名小寫、沒有句點"}, {"tokens": ["My", "name", "is", "Nick", "."], "hl": [0, 3, 4], "note": "改好了：<b>M</b>y、<b>N</b>ick、句點"}]}], "tutor": [{"say": "哪一句完全正確？", "ch": [{"t": "ann and i are cousins.", "ok": false, "re": "人名 Ann、I 都要大寫。"}, {"t": "Ann and I are cousins.", "ok": true, "re": "完美！"}, {"t": "Ann and I are cousins", "ok": false, "re": "少了句尾的句點。"}]}]}], "questions": [{"id": "L1:mc01", "t": "mc", "set": "mc", "c": ["BE-AGR"], "q": "Sam and Leo ___ cousins.", "o": ["is", "am", "are", "be"], "a": 2, "x": "主詞 Sam and Leo 是兩個人 → are。", "L": "L1"}, {"id": "L1:mc02", "t": "mc", "set": "mc", "c": ["POSS", "MECH"], "q": "___ name is Tina. She is my aunt.", "o": ["She", "Her", "She's", "her"], "a": 1, "x": "後面接名詞 name → 所有格；放在句首要大寫 → Her。", "L": "L1"}, {"id": "L1:mc03", "t": "mc", "set": "mc", "c": ["BE-ANS"], "q": "A: Is your mother a doctor?<br>B: ___. She is a nurse.", "o": ["Yes, she is", "No, she isn't", "Yes, she isn't", "No, she is"], "a": 1, "x": "後面說她是護理師，所以不是醫生 → No, she isn't。Yes 配肯定、No 配否定。", "L": "L1"}, {"id": "L1:mc04", "t": "mc", "set": "mc", "c": ["WH"], "q": "A: ___ that tall man?<br>B: He is my uncle.", "o": ["What's", "Who's", "How old is", "What"], "a": 1, "x": "答句說的是關係（我叔叔）→ 問人用 Who。", "L": "L1"}, {"id": "L1:mc05", "t": "mc", "set": "mc", "c": ["FAM-WORD"], "q": "Frank is my father's brother. He is my ___.", "o": ["aunt", "cousin", "uncle", "grandfather"], "a": 2, "x": "爸爸的兄弟＝uncle。", "L": "L1"}, {"id": "L1:mc06", "t": "mc", "set": "mc", "c": ["FAM-WORD"], "q": "My aunt's daughter is my ___.", "o": ["sister", "cousin", "mother", "wife"], "a": 1, "x": "uncle、aunt 的小孩＝cousin。", "L": "L1"}, {"id": "L1:mc07", "t": "mc", "set": "mc", "c": ["ORDER", "A-AN"], "q": "A: Is Eddie ___?<br>B: Yes, he is.", "o": ["a boy tall", "tall a boy", "a tall boy", "tall boy"], "a": 2, "x": "冠詞 a 在最前面，形容詞放在名詞前面 → a tall boy。", "L": "L1"}, {"id": "L1:mc08", "t": "mc", "set": "mc", "c": ["A-AN"], "q": "My grandfather is ___ old farmer.", "o": ["a", "an", "the", "X"], "a": 1, "x": "緊接在後面的 old 是母音開頭 → an。", "L": "L1"}, {"id": "L1:mc09", "t": "mc", "set": "mc", "c": ["POSS"], "q": "Lily and Paul are Nick's parents. ___ son is Nick.", "o": ["His", "Her", "Their", "Our"], "a": 2, "x": "Lily and Paul 是兩個人 → 他們的＝Their。", "L": "L1"}, {"id": "L1:mc10", "t": "mc", "set": "mc", "c": ["POSS"], "q": "Your dog is cute. What's ___ name?", "o": ["it", "it's", "its", "their"], "a": 2, "x": "後面接名詞 name、指狗 → its（沒撇號）。it's＝it is。", "L": "L1"}, {"id": "L1:mc11", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "I am tall, ___ my brother isn't.", "o": ["and", "but", "too", "or"], "a": 1, "x": "我高、哥哥不高，意思相反 → but。", "L": "L1"}, {"id": "L1:mc12", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "My father is a cook, and my mother is a cook, ___.", "o": ["too", "but", "and", "X"], "a": 0, "x": "「也」放句尾、前面有逗號 → too。", "L": "L1"}, {"id": "L1:mc13", "t": "mc", "set": "mc", "c": ["BE-ANS"], "q": "A: Are Bella and Eddie your sister and brother?<br>B: Yes, ___.", "o": ["we are", "they are", "he is", "they're"], "a": 1, "x": "Bella and Eddie → they；肯定簡答不能縮寫，所以不能選 they're。", "L": "L1"}, {"id": "L1:mc14", "t": "mc", "set": "mc", "c": ["PRON"], "q": "That woman is Mia. ___ Ann's mother.", "o": ["He's", "She's", "It's", "Her"], "a": 1, "x": "woman 是女生，後面要「她是」→ She's（＝She is）。Her 是「她的」，後面沒有 be 動詞。", "L": "L1"}, {"id": "L1:mc15", "t": "mc", "set": "mc", "c": ["PL-IRR"], "q": "The ___ are in the classroom.", "o": ["child", "childs", "children", "childrens"], "a": 2, "x": "are 表示複數；child 的複數是 children（不加 s）。", "L": "L1"}, {"id": "L1:mc16", "t": "mc", "set": "mc", "c": ["PL-IRR"], "q": "Two ___ are at the door. They are my uncles.", "o": ["man", "mans", "men", "mens"], "a": 2, "x": "man 的複數是 men。", "L": "L1"}, {"id": "L1:mc17", "t": "mc", "set": "mc", "c": ["POSS", "PL-REG"], "q": "Our new ___ names are Ann and Rita.", "o": ["classmate's", "classmates'", "classmates", "classmate"], "a": 1, "x": "兩個同學的名字 → 複數 classmates，所有格只加撇號 → classmates'。（段考考過）", "L": "L1"}, {"id": "L1:mc18", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "Good ___! We are in the same class again.", "o": ["new", "news", "problem", "nice"], "a": 1, "x": "Good news! 好消息！news（消息）和 new（新的）差一個 s。", "L": "L1"}, {"id": "L1:mc19", "t": "mc", "set": "mc", "c": ["PHR"], "q": "A: Nice to meet you.<br>B: ___", "o": ["Nice to meet you, too.", "You're welcome.", "I'm fine.", "Good night."], "a": 0, "x": "回答 Nice to meet you. 要加 too。", "L": "L1"}, {"id": "L1:mc20", "t": "mc", "set": "mc", "c": ["V-ZH"], "q": "Mr. Lin is our ___ teacher. He is tall and strong.", "o": ["PE", "cook", "farm", "pet"], "a": 0, "x": "體育老師＝PE teacher。", "L": "L1"}, {"id": "L1:mc21", "t": "mc", "set": "mc", "c": ["MULTI"], "q": "My grandmother is a good ___. Her food is great.", "o": ["cook", "cooker", "farmer", "nurse"], "a": 0, "x": "做飯的人是 cook（廚師）。🔴 cooker 是炊具。 e) math teacher.", "a": ["her"], "x": "she 的所有格 → her。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj2", "t": "fill", "set": "teacher", "c": ["POSS"], "q": "【填所有格】That is a cat. ___ (it) name is Lulu.", "a": ["Its"], "x": "🔴 its＝牠的；it's＝it is。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj3", "t": "fill", "set": "teacher", "c": ["POSS"], "q": "【填所有格】It is ___ (we) new house. It is big.", "a": ["our"], "x": "🔴 we 的所有格是 our（不是 its）。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj4", "t": "fill", "set": "teacher", "c": ["PRON"], "q": "【填人稱代名詞】My sister is a doctor. ___ is cool.", "a": ["She"], "x": "後面接 is、當主詞 → She。🔴 不是 her（her 後面要接名詞）。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj5", "t": "fill", "set": "teacher", "c": ["PRON", "BE-ANS"], "q": "【填人稱代名詞】A: Is that a pig? B: Yes, ___ is.", "a": ["it"], "x": "動物、一隻 → it（不是 its）。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj6", "t": "fill", "set": "teacher", "c": ["PRON"], "q": "【填人稱代名詞】My dad is a cook. ___ is nice.", "a": ["He"], "x": "當主詞 → He（不是 his）。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj7", "t": "fill", "set": "teacher", "c": ["BE-AGR"], "q": "【填 be 動詞】A: Are you a cook? B: No, I ___ a farmer.", "a": ["am"], "x": "I 配 am。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj8", "t": "fill", "set": "teacher", "c": ["BE-AGR"], "q": "【填 be 動詞】The teacher ___ from a junior high school.", "a": ["is"], "x": "the teacher 一個人 → is。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj9", "t": "fill", "set": "teacher", "c": ["BE-Q", "BE-AGR"], "q": "【填 be 動詞】A: ___ your aunt tall and beautiful? B: Yes, that's right.", "a": ["Is"], "x": "🔴 主詞是 your aunt（一個人）→ Is，不是 are。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj10", "t": "fill", "set": "teacher", "c": ["BE-Q"], "q": "【填 be 動詞】___ that man old?", "a": ["Is"], "x": "that man → Is。", "L": "L1", "tsec": "judge"}, {"id": "L1:tj11", "t": "fill", "set": "teacher", "c": ["BE-Q"], "q": "【填 be 動詞】___ your pet young?", "a": ["Is"], "x": "🔴 your pet（一隻）→ Is，不是 are。", "L": "L1", "tsec": "judge"}, {"id": "L ", "set": "workbook", "c": ["FAM-FLIP"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill）（說話的人是 John）Lily is my ___.", "a": ["aunt"], "x": "伯父 Kent 的太太 → aunt。", "L": "L1", "tsec": "wk-flip"}, {"id": "L1:wf4", "t": "fill", "set": "workbook", "c": ["FAM-FLIP"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill）（說話的人是 Tom）Susan is my ___.", "a": ["wife"], "x": "Tom 和 Susan 是夫妻 → wife。", "L": "L1", "tsec": "wk-flip"}, {"id": "L1:wf5", "t": "fill", "set": "workbook", "c": ["FAM-FLIP"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill）（說話的人是 Anna）Jacob is my ___.", "a": ["husband"], "x": "Anna 和 Jacob 是夫妻 → husband。", "L": "L1", "tsec": "wk-flip"}, {"id": "L1:wa1", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ family", "a": ["a"], "x": "f 子音 → a。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:wa2", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ orange", "a": ["an"], "x": "o 母音 → an。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:wa3", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ egg", "a": ["an"], "x": "e 母音 → an。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:wa4", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ watch", "a": ["a"], "x": "w 子音 → a。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:wa5", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ igloo", "a": ["an"], "x": "i 母音 → an（igloo 冰屋）。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:ws1", "t": "order", "set": "workbook", "c": ["BE-NEG", "ORDER"], "zh": "重組句子：teacher. / I'm / a / not / junior high school", "en": "I'm not a junior high school teacher.", "alt": ["I am not a junior high school teacher."], "x": "not 放在 am 後面；a＋junior high school＋teacher。", "L": "L1", "tsec": "wk-write"}, {"id": "L1:ws2", "t": "order", "set": "workbook", "c": ["WH"], "zh": "依畫線部分造原問句：The woman is <u>my aunt</u>.", "en": "Who is the woman?", "alt": ["Who's the woman?"], "x": "畫線的是「關係」→ 用 Who 問。🔴 不是 She is your aunt?", "L": "L1", "tsec": "wk-write"}, {"id": "L1:ws3", "t": "order", "set": "workbook", "c": ["ORDER"], "zh": "加入 beautiful 並改寫句子：Mia is a nurse.", "en": "Mia is a beautiful nurse.", "alt": [], "x": "形容詞放名詞前；beautiful 子音開頭，a 不用改。", "L": "L1", "tsec": "wk-write"}, {"id": "L1:ws4", "t": "order", "set": "workbook", "c": ["BE-ANS", "PRON"], "zh": "Is Mr. Wilson tall and young?（先簡答，再用 short and old 詳答）", "en": "No, he isn't. He's short and old.", "alt": ["No, he is not. He is short and old.", "No, he isn't. He is short and old."], "x": "Mr. Wilson → he；不高不年輕 → No，再詳答 short and old。", "L": "L1", "tsec": "wk-write"}, {"id": "L1:wr1", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文：Hi! This is my family. The woman is Mandy. She is a great cook. The man is her brother. His name is George. He is a PE teacher. Cathy is his daughter. She is my good friend. Who am I? I'm Crispy, Cathy's pet dog and good friend.） Which is NOT right?", "o": ["Mandy is a great cook.", "George's daughter is Cathy.", "George is a young student.", "Cathy's pet dog is her good friend."], "a": 2, "x": "George 是 PE teacher，不是學生。", "L": "L1", "tsec": "wk-read"}, {"id": "L1:wr2", "t": "mc", "set": "workbook", "c": ["FAM-WORD"], "q": "（短文：Hi! This is my family. The woman is Mandy. She is a great cook. The man is her brother. His name is George. He is a PE teacher. Cathy is his daughter. She is my good friend. Who am I? I'm Crispy, Cathy's pet dog and good friend.） Which family tree is right?", "o": ["Mandy 和 George 是兄妹；George 有一個女兒 Cathy。", "Mandy 和 George 是夫妻；他們有一個女兒。", "一對夫妻有兩個女兒。", "一對老夫妻有三個孩子。"], "a": 0, "x": "The man is her brother → Mandy 和 George 是兄妹（不是夫妻）；Cathy is his daughter → Cathy 是 George 的女兒。（習作原題是四張家庭樹圖，這裡改成文字）", "L": "L1", "tsec": "wk-read"}], "reading": [{"id": "L1:r1", "title": "閱讀（一）家庭樹", "tree": "wang", "p": "Look at the Wang family. The numbers are their ages.", "qs": [{"id": "L1:r1a", "t": "mc", "set": "read", "c": ["FAM-WORD"], "q": "There are ___ people in the family tree.", "o": ["seven", "eight", "nine", "ten"], "a": 2, "x": "Tom、Amy、Ben、Lisa、Grace、Sam、Kevin、Nina、Ella，共 9 人。", "L": "L1"}, {"id": "L1:r1b", "t": "mc", "set": "read", "c": ["FAM-WORD", "WH"], "q": "How old is Kevin's aunt?", "o": ["35", "37", "38", "40"], "a": 0, "x": "Kevin 的爸爸 Ben 的妹妹是 Grace（35）。Sam 是 uncle，Lisa 是媽媽。", "L": "L1"}, {"id": "L1:r1c", "t": "mc", "set": "read", "c": ["FAM-WORD", "FAM-FLIP"], "q": "Which is true?", "o": ["Sam is Ella's grandfather.", "Lisa is Amy's daughter.", "Ella is Nina's cousin.", "Ben is Grace's husband."], "a": 2, "x": "Ella 和 Nina 的爸媽是兄妹 → cousins。Sam 是 Ella 的爸爸；Lisa 是嫁進來的；Ben 和 Grace 是兄妹。", "L": "L1"}, {"id": "L1:r1d", "t": "mc", "set": "read", "c": ["FAM-FLIP"], "q": "Who is Tom's granddaughter?", "o": ["Lisa", "Grace", "Nina", "Kevin"], "a": 2, "x": "孫女＝兒女的女兒：Nina（Kevin 是孫子）。", "L": "L1"}]}, {"id": "L1:r2", "title": "閱讀（二）自我介紹", "tree": "", "p": "Hi, I'm Mia Chen. I'm thirteen years old, and I'm a junior high school student. My family is not big. My father is a doctor, and my mother is a doctor, too. They are busy, but they are nice. Ben is my brother. He isn't a student. He's a cook. <b>His</b> food is great! Lucky is our pet dog. It's old, but it's cute. What about your family?<div class='gloss'>busy 忙碌的　food 食物</div>", "qs": [{"id": "L1:r2a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is Mia's mother?", "o": ["A cook.", "A doctor.", "A nurse.", "A student."], "a": 1, "x": "my mother is a doctor, too.", "L": "L1"}, {"id": "L1:r2b", "t": "mc", "set": "read", "c": ["BE-NEG"], "q": "Which is true?", "o": ["Ben is a junior high school student.", "Mia's parents are not nice.", "Lucky is a young dog.", "Ben is a cook."], "a": 3, "x": "He isn't a student. He's a cook.", "L": "L1"}, {"id": "L1:r2c", "t": "mc", "set": "read", "c": ["POSS"], "q": "The word “His” in the passage means ___.", "o": ["Mia's father's", "Ben's", "Lucky's", "Mia's"], "a": 1, "x": "His 前一句講的是 Ben → Ben 的食物。（代詞指涉）", "L": "L1"}, ses", "plr": "es", "der": [], "note": "", "tex": "", "posq": true, "cap": 25}, {"sec": "文法例字", "w": "box", "pos": "n.", "zh": "盒子", "ex": "These boxes are big.", "exz": "這些盒子很大。", "pl": "boxes", "plr": "es", "der": [], "note": "", "tex": "", "posq": true, "cap": 6}, {"sec": "文法例字", "w": "watch", "pos": "n.", "zh": "手錶", "ex": "These are great watches.", "exz": "這些是很棒的手錶。", "pl": "watches", "plr": "es", "der": [], "note": "", "tex": "", "posq": true, "cap": 10}, {"sec": "選讀 Read Up", "w": "remember", "pos": "v.", "zh": "記得", "ex": "I remember your birthday.", "exz": "我記得你的生日。", "pl": "", "plr": "none", "der": ["反義：forget 忘記"], "note": "", "tex": "", "posq": true, "cap": 17}, {"sec": "選讀 Read Up", "w": "forget", "pos": "v.", "zh": "忘記", "ex": "An elephant never forgets.", "exz": "大象從不忘記。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 9}, {"sec": "選讀 Read Up", "w": "never", "pos": "adv.", "zh": "從不", "ex": "An elephant never forgets.", "exz": "大象從不忘記。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 45}, {"sec": "選讀 Read Up", "w": "world", "pos": "n.", "zh": "世界", "ex": "Today is World Elephant Day.", "exz": "今天是世界大象日。", "pl": "worlds", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 33}, {"sec": "功能字", "w": "this", "pos": "pron.", "zh": "這個", "ex": "What is this?", "exz": "這是什麼？", "pl": "", "plr": "none", "der": ["複數 these", "this is 不可以縮寫"], "note": "", "tex": "", "posq": false, "cap": 151}, {"sec": "功能字", "w": "that", "pos": "pron.", "zh": "那個", "ex": "What is that?", "exz": "那是什麼？", "pl": "", "plr": "none", "der": ["複數 those", "that is → that's"], "note": "", "tex": "", "posq": false, "cap": 191}, {"sec": "功能字", "w": "these", "pos": "pron.", "zh": "這些", "ex": "What are these?", "exz": "這些是什麼？", "pl": "", "plr": "none", "der": ["回答用 they"], "note": "", "tex": "", "posq": false, "cap": 42}, {"sec": "功能字", "w": "those", "pos": "pron.", "zh": "那些", "ex": "What are those?", "exz": "那些是什麼？", "pl": "", "plr": "none", "der": ["回答用 they"], "note": "", "tex": "", "posq": false, "cap": 25}, {"sec": "功能字", "w": "their", "pos": "pron.", "zh": "他們的；牠們的", "ex": "Their ears are big.", "exz": "牠們的耳朵很大。", "pl": "", "plr": "none", "der": ["they → their", "🔴 they're＝they are"], "note": "", "tex": "", "posq": false, "cap": 105}, {"sec": "功能字", "w": "or", "pos": "conj.", "zh": "或者", "ex": "Are they lions or tigers?", "exz": "牠們是獅子還是老虎？", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": false, "cap": 65}, {"sec": "功能字", "w": "but", "pos": "conj.", "zh": "但是", "ex": "A rat is big, but a mouse is small.", "exz": "大老鼠很大，但小老鼠很小。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": false, "cap": 150}], "texts": [{"id": "d1", "title": "Dialogue 1（In a movie theater）", "src": "課本 p.25", "lines": [{"sp": "Bella", "en": "These dolls are cute.", "zh": "這些娃娃好可愛。", "hl": false, "note": "these（這些）→ 後面用 are，名詞用複數 dolls。"}, {"sp": "Scott", "en": "What are these? Hey, aren't they the Chinese zodiac animal signs?", "zh": "這些是什麼？嘿，它們不就是中國的十二生肖嗎？", "hl": true, "note": "講義佳句。aren't they…? 是否定問句：「難道不是……嗎？」"}, {"sp": "Bella", "en": "No, they aren't. The Chinese zodiac animal signs are the rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, and pig.", "zh": "不，它們不是。中國的十二生肖是鼠、牛、虎、兔、龍、蛇、馬、羊、猴、雞、狗和豬。", "hl": true, "note": "講義佳句。回答否定問句看事實：不是 → No, they aren't."}]}, {"id": "d2", "title": "Dialogue 2（What's my animal sign?）", "src": "課本 p.26", "lines": [{"sp": "Scott", "en": "Wow! What's my animal sign?", "zh": "哇！我屬什麼？", "hl": false, "note": ""}, {"sp": "Bella", "en": "Your birth year is 2000. You're a dragon. A dragon is smart and energetic.", "zh": "你的出生年是 2000 年。你屬龍。龍聰明又充滿活力。", "hl": false, "note": ""}, {"sp": "Scott", "en": "That's true. What's your animal sign, Bella?", "zh": "沒錯。Bella，妳屬什麼？", "hl": false, "note": ""}, {"sp": "Bella", "en": "My birth year is 1999. I'm a rabbit. A rabbit is nice and warm.", "zh": "我的出生年是 1999 年。我屬兔。兔子親切又溫暖。", "hl": false, "note": ""}, {"sp": "Scott", "en": "No wonder you are a people person. What about Abby the pig?", "zh": "難怪妳人緣好。那 Abby 這隻豬呢？", "hl": true, "note": "講義佳句。No wonder 難怪；What about…? ……呢？"}, {"sp": "Bella", "en": "Her birth year is 2024. She's a dragon, too.", "zh": "牠的出生年是 2024 年。牠也屬龍。", "hl": false, "note": ""}, {"sp": "Scott", "en": "No wonder she's smart! Ha ha!", "zh": "難怪牠這麼聰明！哈哈！", "hl": false, "note": ""}]}, {"id": "rd", "title": "Reading〈Asian Elephants VS. African Elephants〉", "src": "課本 p.31", "lines": [{"sp": "", "en": "Are they Asian elephants or African elephants?", "zh": "牠們是亞洲象還是非洲象？", "hl": true, "note": "講義佳句。A or B 的問句不能用 Yes／No 回答，要選一個。"}, {"sp": "Size", "en": "African elephants are different from Asian elephants. African elephants are very big, and their ears are big, too.", "zh": "非洲象和亞洲象不同。非洲象非常大，牠們的耳朵也很大。", "hl": false, "note": "be different from 和……不同；their＝牠們的。"}, {"sp": "", "en": "Asian elephants are small, and their ears are short.", "zh": "亞洲象比較小，牠們的耳朵很短。", "hl": false, "note": ""}, {"sp": "", "en": "An African elephant is about 3.2 meters tall, but an Asian elephant is only about 2.75 meters tall.", "zh": "一頭非洲象大約 3.2 公尺高，但一頭亞洲象只有大約 2.75 公尺高。", "hl": true, "note": "講義佳句。about 大約；only 只有；but 前後意思相反。"}, {"sp": "Lifespan", "en": "Asian elephants' lifespans are about 60 years, but African elephants' lifespans are about 70 years.", "zh": "亞洲象的壽命大約 60 年，但非洲象的壽命大約 70 年。", "hl": true, "note": "講義佳句。elephants' 是複數名詞的所有格：字尾已經有 s，只加 '。"}]}, {"id": "ru", "title": "Read Up〈Ben's Blog〉", "src": "課本 p.35（選讀）", "lines": [{"sp": "", "en": "Today is World Elephant Day. Let's see some idioms about elephants.", "zh": "今天是世界大象日。我們來看一些和大象有關的慣用語。", "hl": false, "note": ""}, {"sp": "1", "en": "the elephant in the room", "zh": "房間裡的大象（大家都知道、卻沒人敢提的問題）", "hl": false, "note": ""}, {"sp": "", "en": "Our noisy neighbor is a big problem for us. We can't go on like this — it's the elephant in the room.", "zh": "我們吵鬧的鄰居是個大問題。我們不能再這樣下去了——這就是房間裡的大象。", "hl": false, "note": ""}, {"sp": "2", "en": "an elephant never forgets", "zh": "大象從不忘記（記性很好）", "hl": false, "note": ""}, {"sp": "", "en": "Ann: How could you remember my birthday? Ben: An elephant never forgets.", "zh": "Ann：你怎麼記得我的生日？Ben：大象從不忘記。", "hl": false, "note": ""}]}], "grammar": [{"id": "dem", "name": "this／that／these／those", "icon": "👉", "c": ["DEM"], "intro": "先看<b>遠近</b>，再看<b>幾個</b>。回答的時候，this、that 一律換成 <b>it</b>；these、those 一律換成 <b>they</b>。", "table": [["", "一個（單數）", "很多個（複數）"], ["近的", "this 這個", "these 這些"], ["遠的", "that 那個", "those 那些"], ["回答用", "it", "they"]], "flows": [{"title": "單數：What is this?", "steps": [{"tokens": ["What", "is", "this", "?"], "hl": [1, 2], "note": "this＝一個 → 用 is"}, {"tokens": ["It", "is", "a", "pen", "."], "hl": [0, 1], "note": "回答把 this 換成 <b>It</b>（也可以說 This is a pen.）"}, {"tokens": ["It's", "a", "pen", "."], "hl": [0], "note": "It is 可以縮成 It's；🔴 但 this is <b>不能</b>縮寫"}]}, {"title": "複數：What are these?", "steps": [{"tokens": ["What", "are", "these", "?"], "hl": [1, 2], "note": "these＝很多個 → 用 are"}, {"tokens": ["They", "are", "dogs", "."], "hl": [0, 2], "note": "回答換成 <b>They</b>，名詞也要用複數 dogs"}]}, {"title": "🔴 常見錯誤（課本 p.29 的寫法）", "steps": [{"tokens": ["What", "are", "these", "?"], "hl": [2], "note": "問的是 these（近的）"}, {"tokens": ["Those", "are", "sheep", "."], "hl": [0], "note": "✗ 回答變成 those（遠的）——遠近對不上"}, {"tokens": ["They", "are", "sheep", "."], "hl": [0], "note": "✓ 回答一律用 <b>They</b>（或 These），就不會錯"}]}], "tutor": [{"say": "A: What are those? B: ___ are monkeys.", "ch": [{"t": "It", "ok": false, "re": "those 是複數，回答要用 They。"}, {"t": "They", "ok": true, "re": "對！these、those 的回答都用 They。"}, {"t": "This", "ok": false, "re": "this 是單數、近的，跟 those 對不上。"}]}, {"say": "哪一個縮寫是錯的？", "ch": [{"t": "what's", "ok": false, "re": "what is → what's 可以。"}, {"t": "that's", "ok": false, "re": "that is → that's 可以。"}, {"t": "this's", "ok": true, "re": "答對！this is 不能縮寫，要寫完整的 This is。"}]}, {"say": "A: Are those your pens? B: Yes, ___.", "ch": [{"t": ? John: That's right. __3__ my pet pigs. They are cute, too.） 第 3 格：", "o": ["It is", "They are", "You are", "That is"], "a": 1, "x": "pigs 複數 → They are。", "L": "L2", "tsec": "wk-cloze"}, {"id": "L2:wv1", "t": "order", "set": "workbook", "c": ["DEM", "A-AN"], "zh": "What is that under the tree?（用 fox 回答）", "en": "It's a fox.", "alt": ["It is a fox."], "x": "that 的回答用 It；一隻 → a fox。", "L": "L2", "tsec": "wk-write"}, {"id": "L2:wv2", "t": "order", "set": "workbook", "c": ["WH", "DEM"], "zh": "依畫線部分造原問句：They're <u>my grandma's pigs</u>.", "en": "What are they?", "alt": ["What are those?", "What are these?"], "x": "畫線的是「東西」→ 用 What 問；They're → are they。", "L": "L2", "tsec": "wk-write"}, {"id": "L2:wv3", "t": "order", "set": "workbook", "c": ["DEM", "PL-IRR", "BE-AGR"], "zh": "改為複數句：That child is happy.", "en": "Those children are happy.", "alt": [], "x": "that → those、child → children、is → are。", "L": "L2", "tsec": "wk-write"}, {"id": "L2:wv4", "t": "order", "set": "workbook", "c": ["DEM", "PL-REG"], "zh": "What are these?（用 toy car 回答）", "en": "They're toy cars.", "alt": ["They are toy cars."], "x": "these 的回答用 They；car → cars。", "L": "L2", "tsec": "wk-write"}], "reading": [{"id": "L2:r1", "title": "閱讀（一）Lions VS. Tigers", "tree": "", "p": "Are they lions or tigers? Lions are different from tigers. A lion is yellow and brown, but a tiger is orange and black. Lions are from Africa, and tigers are from Asia. A male lion is about 1.2 meters tall, but a tiger is only about 1 meter tall. Lions' lifespans are about 12 years, and tigers' lifespans are about 15 years.<div class='gloss'>yellow 黃色的　brown 棕色的　orange 橘色的　Africa 非洲　Asia 亞洲　male 公的</div>", "qs": [{"id": "L2:r1a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is the reading mainly about?", "o": ["Where lions are from.", "How lions and tigers are different.", "How old tigers are.", "What color lions are."], "a": 1, "x": "整篇都在比較獅子和老虎的不同（顏色、產地、身高、壽命）。看第二句 different from 就知道主題。", "L": "L2"}, {"id": "L2:r1b", "t": "mc", "set": "read", "c": ["POSS"], "q": "Which is true?", "o": ["Tigers are from Africa.", "A lion is orange and black.", "Tigers' lifespans are about 15 years.", "Lions and tigers are the same."], "a": 2, "x": "tigers' lifespans are about 15 years。", "L": "L2"}, {"id": "L2:r1c", "t": "mc", "set": "read", "c": ["PL-REG"], "q": "A male lion is about ___ tall.", "o": ["1 meter", "1.2 meters", "12 meters", "15 meters"], "a": 1, "x": "about 1.2 meters tall。", "L": "L2"}]}, {"id": "L2:r2", "title": "閱讀（二）Animal Riddles", "tree": "", "p": "<b>Riddle 1</b>　I am big and gray. My nose is very long, and my ears are big.<br><b>Riddle 2</b>　I am black and white, but I am not a bear. I am like a horse.<br><b>Riddle 3</b>　I am small and cute. My ears are long. I am the fourth Chinese zodiac animal sign.<br><b>Riddle 4</b>　I am long. I have no legs.<br><b>Riddle 5</b>　I am big, yellow, and brown. I am the king of animals.<div class='gloss'>riddle 謎語　gray 灰色的　nose 鼻子　like 像　fourth 第四　have no legs 沒有腳　king 國王</div>", "qs": [{"id": "L2:r2a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 1 is ___.", "o": ["a zebra", "an elephant", "a pig", "a mouse"], "a": 1, "x": "很大、灰色、長鼻子、大耳朵 → 大象。", "L": "L2"}, {"id": "L2:r2b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 2 is ___.", "o": ["a zebra", "a bear", "a horse", "a goat"], "a": 0, "x": "黑白色、像馬、不是熊 → 斑馬。", "L": "L2"}, {"id": "L2:r2c", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 3 is ___.", "o": ["a rat", "an ox", "a tiger", "a rabbit"], "a": 3, "x": "鼠牛虎兔，第四個是兔。", "L": "L2"}, {"id": "L2:r2d", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 4 is ___.", "o": ["a dragon", "a snake", "a monkey", "a dog"], "a": 1, "x": "很長、沒有腳 → 蛇。", "L": "L2"}, {"id": "L2:r2e", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 5 is ___.", "o": ["a lion", "a fox", "a tiger", "a rooster"], "a": 0, "x": "萬獸之王 → 獅子。", "L": "L2"}]}, {"id": "L2:r3", "title": "閱讀（三）生肖表", "tree": "", "p": "<table class='info'><tr><th>Name</th><th> ant。", "文法例字": "這些是 Grammar 頁的例字，拿來練 this／that／these／those 和複數字尾。字尾 s、x、sh、ch 要加 <b>-es</b>：bus→buses、box→boxes、watch→watches。", "選讀 Read Up": "Read Up 是選讀，認識就好：remember（記得）↔ forget（忘記）、never（從不）。", "功能字": "this（這個）／that（那個）／these（這些）／those（那些）；their＝他們的、牠們的。"}, "tiles": [["🔤", "單字卡", "選類別→學習單字或拼字", "words"], ["📖", "課文", "對話＋閱讀・講義佳句", "text"], ["⭐", "佳句練習", "中翻英：先排字再打字", "do/best"], ["🧩", "文法", "this/these・What・複數所有格", "grammar"], ["👉", "this／that／these／those", "遠近・單複數・回答用 it／they", "g/dem"], ["🔢", "複數規則＋發音", "-s/-es/-ies/-ves・特殊複數", "g/plural2"], ["📝", "老師講義（附答案）", "8 頁原題：看答案或直接作答", "teacher"], ["📒", "習作（附答案）", "習作 p.9–12：看答案或直接作答", "workbook"], ["📄", "講義型練習", "片語・一字多義・句型…", "handout"], ["👂", "聽力", "看圖・聽音辨字・問答・對話", "listen"], ["✅", "本課小考", "16 題混合", "quiz"]]}, {"id": "R1", "short": "Review 1", "title": "Review 1　總複習", "sub": "課本 p.37–40｜be 動詞問句・Wh- 問句・介紹他人・食物鏈", "scope": ["L1", "L2", "R1"], "words": [{"sec": "介紹他人", "w": "actor", "pos": "n.", "zh": "（男）演員", "ex": "He is an actor.", "exz": "他是演員。", "pl": "actors", "plr": "s", "der": ["act 表演＋-or＝做這件事的人"], "note": "母音開頭：an actor", "tex": "", "posq": true, "cap": 5}, {"sec": "介紹他人", "w": "strong", "pos": "adj.", "zh": "強壯的", "ex": "He is tall and strong.", "exz": "他又高又壯。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "He is tall and strong.", "posq": true, "cap": 17}, {"sec": "介紹他人", "w": "hero", "pos": "n.", "zh": "英雄", "ex": "He is my hero.", "exz": "他是我的英雄。", "pl": "heroes", "plr": "es", "der": [], "note": "複數 heroes（子音＋o 加 es）", "tex": "", "posq": true, "cap": 0}, {"sec": "介紹他人", "w": "age", "pos": "n.", "zh": "年齡", "ex": "Age: 600 years old", "exz": "年齡：600 歲", "pl": "ages", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 7}, {"sec": "介紹他人", "w": "appearance", "pos": "n.", "zh": "外表", "ex": "Appearance: tall and strong", "exz": "外表：又高又壯", "pl": "", "plr": "unc", "der": [], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "介紹他人", "w": "great", "pos": "adj.", "zh": "很好的；很棒的", "ex , "cousin", "aunt", "daughter"], "a": 1, "x": "兩人的爸媽是兄妹 → cousin。", "L": "R1", "tsec": "wk-vocab"}, {"id": "R1:wv3", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "Our pet dog is ___. It's one year old.", "o": ["same", "young", "fat", "old"], "a": 1, "x": "一歲 → young。", "L": "R1", "tsec": "wk-vocab"}, {"id": "R1:wv4", "t": "mc", "set": "workbook", "c": ["FAM-WORD"], "q": "My ___ are doctors, and my sister is a cook. We are a happy family.", "o": ["pets", "people", "farmers", "parents"], "a": 3, "x": "are doctors（醫生）＋家人 → parents 爸媽。", "L": "R1", "tsec": "wk-vocab"}, {"id": "R1:wv5", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "A: What's your favorite (最喜愛的) ___? B: The sheep.", "o": ["animal", "number", "person", "horse"], "a": 0, "x": "回答 sheep → 問最喜歡的動物。", "L": "R1", "tsec": "wk-vocab"}, {"id": "R1:wm1", "t": "mc", "set": "workbook", "c": ["BE-ANS", "PRON"], "q": "A: Is Sam thin? B: Yes, ___.", "o": ["Sam is", "he is", "I am", "it is"], "a": 1, "x": "簡答用代名詞 → he is。", "L": "R1", "tsec": "wk-mixed"}, {"id": "R1:wm2", "t": "mc", "set": "workbook", "c": ["WH", "DEM"], "q": "A: ___ are those? B: They are foxes.", "o": ["How", "Who", "What", "How old"], "a": 2, "x": "回答是動物（東西）→ What。", "L": "R1", "tsec": "wk-mixed"}, {"id": "R1:wm3", "t": "mc", "set": "workbook", "c": ["WH"], "q": "A: How old is Tom? B: ___ He is a junior high school student.", "o": ["Thirteen.", "Three.", "One.", "Three-year-old."], "a": 0, "x": "國中生 → 13 歲。", "L": "R1", "tsec": "wk-mixed"}, {"id": "R1:wm4", "t": "mc", "set": "workbook", "c": ["POSS"], "q": "Ms. Green is ___ teacher. She is beautiful and young.", "o": ["Jay", "you", "he", "Jay's"], "a": 3, "x": "後面接 teacher → 所有格 Jay's。", "L": "R1", "tsec": "wk-mixed"}, {"id": "R1:wm5", "t": "mc", "set": "workbook", "c": ["WH", "FAM-WORD"], "q": "A: Who is the beautiful woman? B: She is ___.", "o": ["a woman", "students", "my sister", "smart"], "a": 2, "x": "Who 問身分／關係 → my sister。", "L": "R1", "tsec": "wk-mixed"}, {"id": "R1:wm6", "t": "mc"     u.lang="en-US"; if (VOICE) u.voice=VOICE;
    u.rate = opt.rate || 0.85; u.pitch = opt.pitch || 1;

async function speakTalk(script){

    const pitch = m[1]==="W" ? 1.3 : m[1]==="M" ? 0.75 : 1;

/* ───────── 家庭樹：關係計算 ───────── */
function famMap(F){ const m={}; F.people.forEach(p=>m[p.id]=p); return m; }
function siblings(m, id){ const p=m[id]; if(!p.par.length) return [];
  return Object.values(m).filter(q=>q.id!==id && q.par.some(x=>p.par.includes(x))).map(q=>q.id); }
function rel(F, a, b){ // a 是 b 的什麼人
  const m = famMap(F), A=m[a], B=m[b]; if(!A||!B||a===b) return null;
  const g = (mw,fw)=> A.sex==="m"?mw:fw;
  if (A.sp===b) return g("husband","wife");
  if (B.par.includes(a)) return g("father","mother");
  if (A.par.includes(b)) return g("son","daughter");
  if (siblings(m,a).includes(b)) return g("brother","sister");
  if (B.par.some(p=>m[p].par.includes(a))) return g("grandfather","grandmother");
  if (A.par.some(p=>m[p].par.includes(b))) return g("grandson","granddaughter");
  const bParSibs = B.par.flatMap(p=>siblings(m,p));
  if (bParSibs.includes(a) || bParSibs.some(s=>m[s].sp===a)) return g("uncle","aunt");
  if (A.par.some(p=>bParSibs.includes(p))) return "cousin";
  // uncle／aunt 的反方向（課外字，只顯示不出題）
  if (A.par.some(p=>siblings(m,p).includes(b) || siblings(m,p).some(s=>m[s].sp===b))) return g("nephew","niece");
  return null;
}
const EXTRA = {nephew:"姪子／外甥", niece:"姪女／外甥女"};
const REL_M = ["father","son","brother","husband","grandfather","grandson","uncle","cousin"];
const REL_F = ["mother","daughter","sister","wife","grandmother","granddaughter","aunt","cousin"];

function treeSVG(F, sel=[]){
  const m=famMap(F), W=66, H=120, R=23, ox=6, oy=30;
  const X=p=>ox+p.x*W+W/2, Y=p=>oy+p.y*H;
  const maxx=Math.max(...F.people.map(p=>p.x)), maxy=Math.max(...F.people.map(p=>p.y));
  let s=`<svg viewBox="0 0 ${ox*2+(maxx+1)*W} ${oy+maxy*H+80}" role="img" aria-label="${esc(F.title)}">`;
  const done=new Set();
  F.people.forEach(p=>{ if(p.sp && !done.has(p.sp)){ done.add(p.id); const q=m[p.sp];
    s+=`<line x1="${X(p)}" y1="${Y(p)}" x2="${X(q)}" y2="${Y(q)}" stroke="var(--ink-3)" stroke-width="2"/>`; }});
  const groups={};
  F.people.forEach(p=>{ if(p.par.length){ const k=p.par.slice().sort().join("+"); (groups[k]=groups[k]||[]).push(p);} });
  Object.entries(groups).forEach(([k,kids])=>{
    const [a,b]=k.split("+").map(i=>m[i]); const mx=(X(a)+X(b))/2, py=Y(a), by=py+H*0.55;
    const xs=kids.map(X); const x1=Math.min(...xs,mx), x2=Math.max(...xs,mx);
    s+=`<g stroke="var(--ink-3)" stroke-width="1.5" opacity=".7"><line x1="${mx}" y1="${py}" x2="${mx}" y2="${by}"/><line x1="${x1}" y1="${by}" x2="${x2}" y2="${by}"/>`;
    kids.forEach(c=>s+=`<line x1="${X(c)}" y1="${by}" x2="${X(c)}" y2="${Y(c)-R}"/>`); s+=`</g>`;
  });
  F.people.forEach(p=>{
    const on = sel.indexOf(p.id);
    const fill = on===0 ? "var(--accent)" : on===1 ? "var(--accent-line)" : "var(--surface-2)";
    s+=`<g class="pn" data-p="${p.id}"><circle cx="${X(p)}" cy="${Y(p)}" r="${R}" fill="${fill}" stroke="${on>=0?"var(--accent)":"var(--line)"}" stroke-width="${on>=0?2.5:1.5}"/>`+
       `<text x="${X(p)}" y="${Y(p)+6}" text-anchor="middle" font-size="18">${p.sex==="m"?"👦":"👧"}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+19}" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor">${p.id}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+37}" text-anchor="middle" font-size="15" fill="var(--ink-3)">${p.age}</text></g>`;
  });
  return s+"</svg>";
}
function famQuestions(F, n){
  const ids=F.people.map(p=>p.id), out=[], seen=new Set();
  let guard=0;
  while(out.length<n && guard++<500){
    const a=ids[Math.floor(Math.random()*ids.length)], b=ids[Math.floor(Math.random()*ids.length)];
    const r=rel(F,a,b); if(!r || EXTRA[r]) continue;
    const kind=["word","flip","who"][Math.floor(Math.random()*3)];
    const key=kind+a+b; if(seen.has(key)) continue; seen.add(key);
    const A=famMap(F)[a], pool=(A.sex==="m"?REL_M:REL_F).filter(x=>x!==r);
    if(kind==="word"){
      const o=shuffle([r,...pick(pool,3)]);
      out.push({id:`fam:${F.id}:w:${a}:${b}`,t:"mc",c:["FAM-WORD"],tree:F.id,q:`${a} is ${b}'s ___.`,o,a:o.indexOf(r),
        x:`看家庭樹：${a} 是 ${b} 的 <b>${r}</b>。`});
    } else if(kind==="flip"){
      const r2=rel(F,b,a); if(!r2 || EXTRA[r2]) continue;
      const B=famMap(F)[b]; const pool2=(B.sex==="m"?REL_M:REL_F).filter(x=>x!==r2);
      const o=shuffle([r2,...pick(pool2,3)]);
      out.push({id:`fam:${F.id}:f:${a}:${b}`,t:"mc",c:["FAM-FLIP"],tree:F.id,q:`${a} is ${b}'s ${r}.<br>So ${b} is ${a}'s ___.`,o,a:o.indexOf(r2),
        x:`換 ${b} 當主詞：${b} 是${B.sex==="m"?"男生":"女生"} → <b>${r2}</b>。`});
    } else {
      const ans=ids.filter(i=>rel(F,i,b)===r); if(ans.length!==1) continue;
      const o=shuffle([a,...pick(ids.filter(i=>i!==a&&i!==b),3)]);
      out.push({id:`fam:${F.id}:h:${a}:${b}`,t:"mc",c:["FAM-WORD","WH"],tree:F.id,q:`Who is ${b}'s ${r}?`,o,a:o.indexOf(a),
        x:`${b}'s ${r} 是 <b>${a}</b>。`});
    }
  }
  return out;
}

  if (code==="V-POS") p = p.concat(pick(posq,6).map(spellQ));
  if (code==="MECH") p = p.concat(pick(QS.filter(q=>q.t==="order"),3));
  return p;
}

/* ───────── 作答紀錄＋錯題本 ───────── */
function record(q, okByConcept){ // okByConcept: {code: bool}
  for (const [c,ok] of Object.entries(okByConcept)){
    const s = S.stats[c] || (S.stats[c]={n:0,w:0}); s.n++; if(!ok) s.w++;
  }
  // 大小寫標點（MECH）只提醒、另外記統計，不影響這題的對錯
  const allOk = Object.entries(okByConcept).filter(([c])=>c!=="MECH").every(([,v])=>v);
  if (!allOk){ S.wrong[q.id] = {q, s:0}; }
  else if (S.wrong[q.id]){ S.wrong[q.id].s++; if (S.wrong[q.id].s>=2) delete S.wrong[q.id]; }
  save(); return allOk;
}
