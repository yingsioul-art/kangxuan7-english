<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七上英文（康軒）</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* ───────── 設計基準：8px 網格｜灰階分層｜Indigo 為唯一強調色 ───────── */
:root{
  --accent:#4f46e5; --accent-ink:#4338ca; --accent-soft:#eef2ff; --accent-line:rgba(79,70,229,.18);
  --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f4f4f5; --line:#e4e4e7;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#a1a1aa;
  --ok:#15803d; --ok-soft:#f0fdf4; --ng:#b91c1c; --ng-soft:#fef2f2; --warn:#a16207; --warn-soft:#fefce8;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --sh-1:0 1px 2px rgba(24,24,27,.04),0 1px 3px rgba(24,24,27,.06);
  --sh-2:0 8px 24px rgba(24,24,27,.08),0 2px 6px rgba(24,24,27,.04);
  --ease:cubic-bezier(.2,.8,.2,1);
  --pad:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --accent:#818cf8; --accent-ink:#a5b4fc; --accent-soft:rgba(129,140,248,.14); --accent-line:rgba(129,140,248,.28);
    --bg:#0c0c0e; --surface:#18181b; --surface-2:#232328; --line:#2e2e34;
    --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
    --ok:#4ade80; --ok-soft:rgba(74,222,128,.10); --ng:#f87171; --ng-soft:rgba(248,113,113,.10); --warn:#facc15; --warn-soft:rgba(250,204,21,.10);
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 24px rgba(0,0,0,.5); }
}
@media (min-width:600px){ :root{ --pad:24px; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased}
#app{max-width:720px;margin:0 auto;padding:0 16px 96px}

/* 標題列：毛玻璃、黏在頂端 */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;margin:0 -16px 8px;padding:16px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;flex:1;line-height:1.3}
header.top .back{width:40px;height:40px;flex:none;border:0;border-radius:50%;background:var(--surface);color:var(--ink);
  font-size:18px;cursor:pointer;box-shadow:var(--sh-1);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
header.top .back:hover{box-shadow:var(--sh-2)}
header.top .back:active{transform:scale(.92)}

h2{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);margin:32px 0 16px}
h3{font-size:16px;font-weight:600;margin:24px 0 8px}
p{margin:8px 0 16px}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3);font-size:14px}
b{font-weight:600}

/* 卡片 */
.card{background:var(--surface);border-radius:var(--r-lg);padding:var(--pad);margin:16px 0;box-shadow:var(--sh-1)}

/* 首頁方塊 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);border:0;border-radius:var(--r-lg);
  padding:16px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;box-shadow:var(--sh-1);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:var(--r-md);background:var(--surface-2);display:grid;place-items:center;font-size:20px}
.tile b{font-size:16px;line-height:1.3}
.tile small{color:var(--ink-3);font-size:13px;line-height:1.5}
.tile.off{opacity:.45;cursor:default;box-shadow:none;background:var(--surface-2)}
.tile.off:hover{transform:none}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:var(--r-md);
  background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:600;padding:0 16px;margin:8px 8px 0 0;cursor:pointer;
  transition:transform .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{box-shadow:0 4px 12px var(--accent-line)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost:hover{box-shadow:none;background:var(--accent-line)}
.btn.small{min-height:32px;font-size:13px;padding:0 16px;border-radius:var(--r-sm)}
.btn:disabled{opacity:.35;pointer-events:none}
.say{width:32px;height:32px;flex:none;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:14px;cursor:pointer;
  transition:transform .2s var(--ease),background .2s var(--ease),color .2s var(--ease)}
.say:hover{background:var(--accent-soft);color:var(--accent)}
.say:active{transform:scale(.9)}

/* 表格 */
.tablewrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
@media (min-width:600px){ th,td{padding:8px 16px} }
th{font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2)}
th:first-child{border-top-left-radius:var(--r-sm)}
th:last-child{border-top-right-radius:var(--r-sm)}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{white-space:nowrap}

/* 單字卡 */
.word{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.word:first-child{padding-top:0}
.word:last-child{border:0;padding-bottom:0}
.word .w{font-size:20px;font-weight:700;letter-spacing:-.01em}
.word .pos{color:var(--accent);font-weight:600;font-size:14px;margin:0 8px}
.badge{display:inline-block;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);margin:8px 8px 0 0}
.badge.cap{background:var(--accent-soft);color:var(--accent-ink)}
.badge.irr{background:var(--ng-soft);color:var(--ng)}
.eg{display:block;color:var(--ink-2);font-size:14px;margin-top:8px}
.eg .say{width:24px;height:24px;font-size:11px;vertical-align:middle;margin-right:4px}

/* 課文 */
.line{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.line:first-child{padding-top:0}
.line:last-child{border:0;padding-bottom:0}
.line .sp{font-weight:600;font-size:14px;min-width:40px;color:var(--ink-3);padding-top:4px}
.line .en{font-size:17px}
.line .hl{background:linear-gradient(transparent 58%,var(--accent-line) 58%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.line .zh{color:var(--ink-3);font-size:14px;margin-top:4px}
.note{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:8px 16px;font-size:14px;color:var(--ink-2);margin-top:8px}

/* 文法字卡 */
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px 0}
.chipw{padding:8px 16px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink);font-size:18px;font-weight:600;
  border:0;transition:all .4s var(--ease)}
.chipw.on{background:var(--accent);color:#fff;transform:translateY(-4px);box-shadow:0 6px 16px var(--accent-line)}
.stepnote{min-height:48px;font-size:15px;color:var(--ink-2);margin:8px 0}

/* 小老師對話 */
.bubble{border-radius:var(--r-lg);padding:16px;margin:8px 0;max-width:88%;font-size:15px}
.bubble.t{background:var(--surface-2);border-top-left-radius:4px}
.bubble.ok{background:var(--ok-soft);margin-left:auto;border-top-right-radius:4px}
.bubble.ng{background:var(--warn-soft);margin-left:auto;border-top-right-radius:4px}

/* 選項 */
.opts{display:grid;gap:8px;margin-top:16px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;padding:12px 16px;border-radius:var(--r-md);cursor:pointer;
  transition:border-color .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.big{font-size:40px;text-align:center;padding:8px}
.opts.pic{grid-template-columns:repeat(3,1fr)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt:disabled{cursor:default}
.chips .opt{padding:8px 16px}
.dropzone{background:var(--surface-2);border-radius:var(--r-md);padding:8px;margin:16px 0 8px;min-height:64px;align-items:center}
.dropzone .opt{background:var(--surface);box-shadow:var(--sh-1);border-color:transparent}
.dropzone.over{outline:2px dashed var(--accent);outline-offset:2px}
/* 句子打字：一字一格 */
.wb{display:flex;flex-wrap:wrap;gap:8px 8px;align-items:flex-end;margin:16px 0 8px}
.wbw{display:inline-flex;align-items:flex-end;gap:2px}
.wbi{font:inherit;font-size:18px;padding:8px 4px;min-width:40px;text-align:center;border:0;border-bottom:2px solid var(--ink-3);
  border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--surface-2);color:var(--ink);outline:none;
  transition:border-color .2s var(--ease),background .2s var(--ease)}
.wbi:focus{border-color:var(--accent);background:var(--accent-soft)}
.wbi.ok{border-color:var(--ok);background:var(--ok-soft)}
.wbi.ng{border-color:var(--ng);background:var(--ng-soft)}
.wbp{font-size:20px;font-weight:700;padding-bottom:6px}
.verdict{margin-top:16px;padding:12px 16px;border-radius:var(--r-md);font-size:20px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok);border:2px solid var(--ok)}
.verdict.ng{background:var(--ng-soft);color:var(--ng);border:2px solid var(--ng)}
/* 學生答案逐字母比對 */
.yours{margin-top:8px;font-size:18px;line-height:1.9}
.ya{margin:16px 0 8px;border-radius:var(--r-md);overflow:hidden;border:2px solid var(--line);background:var(--surface)}
.ya.is-ok{border-color:var(--ok)} .ya.is-ng{border-color:var(--ng)}
.ya-row{display:flex;align-items:baseline;gap:16px;padding:12px 16px}
.ya-row+.ya-row{border-top:1px solid var(--line);background:var(--surface-2)}
.ya-lab{flex:none;width:64px;font-size:13px;font-weight:600;color:var(--ink-3)}
.ya-val{font-size:22px;font-weight:600;line-height:1.5;word-break:break-word}
.ya-ok{color:var(--ok)}
.ya-note{padding:8px 16px;font-size:13px;color:var(--ok);background:var(--ok-soft)}
.dword{font-weight:600;letter-spacing:.02em}
.dbad{background:var(--ng-soft);color:var(--ng);text-decoration:line-through;border-radius:3px;padding:0 1px}
.dmiss{color:var(--ng);border:1px dashed var(--ng);border-radius:3px;padding:0 2px;margin:0 1px}
/* 句子解析 */
.sxbox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 16px 16px}
.sxbox summary{font-weight:600;color:var(--accent);padding:8px 0}
.sx{padding:8px 0;border-bottom:1px solid var(--line)}
.sx-type{font-size:14px;margin-bottom:8px}
.sx-row{display:flex;flex-wrap:wrap;gap:8px}
.sx-chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:8px 12px;border-radius:var(--r-sm);font-weight:600;font-size:16px}
.sx-chip small{font-size:11px;font-weight:500;opacity:.75}
.r-s{background:var(--accent-soft);color:var(--accent-ink)}
.r-v{background:var(--accent);color:#fff}
.r-not{background:var(--ng-soft);color:var(--ng)}
.r-c{background:var(--surface-2);color:var(--ink)}
.r-wh{background:var(--warn-soft);color:var(--warn)}
.r-cj{background:transparent;border:1px dashed var(--ink-3);color:var(--ink-2)}
.r-ph{background:var(--ok-soft);color:var(--ok)}
.sx-sec{margin-top:16px;font-size:14px;line-height:1.7}
.sx-sec>b{display:block;font-size:13px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:4px}
.drag{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.dropzone .opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.dropzone .opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.drag-ghost{position:fixed;z-index:50;pointer-events:none;margin:0;transform:scale(1.08);box-shadow:var(--sh-2);background:var(--surface)!important;opacity:.95}

/* 作答 */
.q{font-size:19px;line-height:1.7;font-weight:500}
.blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink-3);margin:0 4px}
input.ans{font:inherit;font-size:18px;width:100%;padding:12px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);margin-top:16px;outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
input.ans:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-line)}
.fb{border-radius:var(--r-md);padding:12px 16px;margin-top:16px;font-size:15px}
.fb.ok{background:var(--ok-soft)}
.fb.ng{background:var(--ng-soft)}
.fb.warn{background:var(--warn-soft)}
.prog{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 16px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s var(--ease)}
.passage{background:var(--surface-2);border-radius:var(--r-md);padding:16px;font-size:15px;margin-bottom:16px;max-height:45vh;overflow:auto}
.passage .gloss{font-size:13px;color:var(--ink-3);margin-top:8px}
table.info td,table.info th{padding:8px}

/* 弱點條 */
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* 家庭樹 */
.tree svg{width:100%;height:auto;display:block;color:var(--ink)}
.tree .pn{cursor:pointer}
.tree .pn circle{transition:fill .25s var(--ease)}
.relbox{min-height:64px}
.big{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--accent)}
.center{text-align:center}
.score{font-size:48px;font-weight:700;letter-spacing:-.02em;color:var(--accent);line-height:1.2}
label.row{color:var(--ink-2);font-size:14px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* 首頁每課可收合頁籤 */
details.ltab{border-radius:var(--r-lg);margin:12px 0;background:var(--surface);box-shadow:var(--sh-1)}
details.ltab>summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
details.ltab>summary::-webkit-details-marker{display:none}
details.ltab>summary::after{content:"▸";margin-left:auto;color:var(--accent);transition:transform .15s}
details.ltab[open]>summary::after{transform:rotate(90deg)}
details.ltab>.tiles{padding:0 12px 12px}
</style>
</head>

<script>
const D = {"concepts": {"V-SP": {"name": "單字拼字", "g": "", "tip": "聽到發音先拆音節，再對照字母。容易錯的字：handsome（d 不發音）、cousin（ou 唸 /ʌ/）、daughter（gh 不發音）、junior。"}, "V-POS": {"name": "詞性", "g": "", "tip": "人、事、物＝<b>n.</b>（名詞）；形容人事物的樣子＝<b>adj.</b>（形容詞）；動作＝<b>v.</b>（動詞）。看例句裡這個字在做什麼。"}, "V-ZH": {"name": "中文字義", "g": "", "tip": "把例句整句讀一遍，再決定字義。英文一個字常有好幾個意思，例如 short＝矮的／短的。"}, "PL-REG": {"name": "規則複數", "g": "plural", "tip": "一般加 <b>-s</b>；字尾 s、x、sh、ch 加 <b>-es</b>（class→classes）；子音＋y 改 y 為 i 加 <b>-es</b>（family→families）；f／fe 改 <b>-ves</b>（wife→wives）。"}, "PL-IRR": {"name": "特殊複數", "g": "plural", "tip": "不加 s 的字要整個背：man→<b>men</b>、woman→<b>women</b>、child→<b>children</b>。🔴 不可以寫 mans、childs、childrens。"}, "BE-AGR": {"name": "主詞和 be 動詞的搭配", "g": "be-agr", "tip": "I 配 <b>am</b>；you 和所有複數（we、they、兩個人以上）配 <b>are</b>；he、she、it、一個人名配 <b>is</b>。先找主詞，再數是一個還是很多個。"}, "BE-NEG": {"name": "否定句 not 的位置", "g": "be-pos", "tip": "not 永遠放在 be 動詞的<b>後面</b>：He is <b>not</b>…。I am not 只能縮成 <b>I'm not</b>，沒有 amn't。"}, "BE-Q": {"name": "問句 be 動詞的位置", "g": "be-pos", "tip": "把 be 動詞<b>搬到句首</b>，其他字順序不動，句尾改問號：He is a cook. → <b>Is</b> he a cook? 有 be 動詞就<b>不要</b>加 do。"}, "BE-ANS": {"name": "簡答", "g": "be-pos", "tip": "Yes／No 後面用<b>代名詞</b>（he／she／they），不用人名。肯定簡答<b>不能縮寫</b>：Yes, he is.（✗ Yes, he's.）；否定可以：No, he isn't."}, "POSS": {"name": "所有格", "g": "poss", "tip": "後面<b>接名詞</b>、要說「誰的」就用所有格：my、your、his、her、its、our、their；人名加 <b>'s</b>（Nick's）。🔴 its＝牠的，it's＝it is。"}, "PRON": {"name": "人稱代名詞", "g": "poss", "tip": "當主詞、後面接 be 動詞 → 用 I／you／he／she／it／we／they。男生 he、女生 she、動物或東西 it、兩個以上 they。"}, "FAM-WORD": {"name": "稱謂單字", "g": "family", "tip": "男女成對背：father／mother、son／daughter、brother／sister、uncle／aunt、husband／wife、grandson／granddaughter。cousin 不分男女。"}, "FAM-FLIP": {"name": "換角度的親屬關係", "g": "family", "tip": "A is B's father → 反過來 B is A's son／daughter。換角度時看<b>新的主詞是男是女</b>，再找成對的那個字。"}, "WH": {"name": "疑問詞選擇", "g": "wh", "tip": "問<b>人</b>用 Who；問<b>東西、名字、職業</b>用 What；問<b>年紀</b>用 How old。看答句在回答什麼，就知道問句用哪個字。Who 問句不能用 Yes／No 回答。"}, "DEM": {"name": "this／that／these／those", "g": "dem", "tip": "近的用 this（一個）／these（很多個），遠的用 that／those。<b>回答時 this、that 換成 it；these、those 換成 they</b>。🔴 問 What are these? 不能回答 Those are…。"}, "PHR": {"name": "片語", "g": "", "tip": "片語要整組背，中間的字不能省：take care <b>of</b>、Nice to meet you, <b>too</b>、be <b>from</b>。"}, "MULTI": {"name": "一字多義", "g": "", "tip": "同一個字在不同句子裡意思和詞性會變，例如 cook 是「廚師」(n.)，也可以是「煮」(v.)。先看這個字前面有沒有 a／the（有＝名詞）。"}, "ORDER": {"name": "句子語序", "g": "adj", "tip": "形容詞放在名詞<b>前面</b>：a <b>tall</b> boy（✗ a boy tall）。冠詞 a／an 放在最前面：a tall boy。"}, "A-AN": {"name": "a／an", "g": "a-an", "tip": "看<b>緊接在後面那個字</b>的發音：母音開頭用 <b>an</b>（an old man、an aunt），子音開頭用 <b>a</b>（a young man）。"}, "CONJ": {"name": "and／but／too", "g": "conj", "tip": "意思一樣、往同方向 → <b>and</b>；意思相反 → <b>but</b>；「也」放句尾、前面加逗號 → <b>, too</b>。"}, "MECH": {"name": "大小寫和標點", "g": "mech", "tip": "①句首第一個字母大寫 ②人名、I 永遠大寫 ③句尾一定要有句點或問號。段考翻譯題沒寫標點會扣分。"}, "WHERE": {"name": "Where 問位置", "g": "where", "tip": "Where 問「在哪裡」：單數 <b>Where is</b>、複數 <b>Where are</b>。回答用 It's／They're＋<b>介系詞＋地點</b>，不能用 Yes／No。"}, "PREP": {"name": "位置介系詞", "g": "prep", "tip": "in 裡面、on 上面、under 下面、behind 後面、<b>in front of</b> 前面（三個字）、next to／beside 旁邊、near 附近、<b>between A and B</b> 中間。"}, "IMP": {"name": "祈使句", "g": "imp", "tip": "叫人做事：<b>省略 you、原形動詞開頭</b>（Be quiet.）；不要做：<b>Don't</b>＋原形動詞（Don't be sad.）。please 放句尾前面要加逗號。"}, "LETS": {"name": "Let's", "g": "lets", "tip": "Let's＋<b>原形動詞</b>＝我們一起……吧；否定是 <b>Let's not</b>＋原形動詞（✗ Let's don't）。"}, "OBJ": {"name": "受格", "g": "obj", "tip": "放在<b>動詞或介系詞後面</b>用受格：me、you、him、her、it、us、them。例：Look at <b>me</b>.／She is with <b>them</b>."}, "CAN": {"name": "助動詞 can", "g": "can", "tip": "can＋<b>原形動詞</b>；can 不管主詞都不變（✗ cans）；否定 <b>can't</b>＝cannot（✗ don't can）。"}, "CAN-Q": {"name": "Can 問句與回答", "g": "can-q", "tip": "Can 搬到句首：Can he cook? → Yes, he can.／No, he can't.　問會做什麼用 <b>What can…do?</b>，問誰會用 <b>Who can…?</b>（Who 就是主詞）。"}, "ANT": {"name": "反義字", "g": "ant", "tip": "成對背：noisy↔quiet、late↔early、stand up↔sit down、soft↔hard、upload↔download。"}}, "exam": {"listen": 15, "mc": 20, "read": 10, "hand": 5, "weight": {"listen": 2, "mc": 2, "read": 2, "hand": 2}}, "lessons": [{"id": "L1", "short": "Lesson 1", "title": "Lesson 1　Who's That Young Man?", "sub": "課本 p.9–22｜初次見面・請多指教｜Nick 這一家", "scope": ["L1"], "words": [{"sec": "親屬", "w": "family", "pos": "n.", "zh": "家人；家庭", "ex": "My family is warm.", "exz": "我的家庭很溫暖。", "pl": "families", "plr": "ies", "der": ["the Lin family 林家（＝the Lins）", "family name 姓氏"], "note": "the Lin family 後面接 is；the Lins 後面接 are", "tex": "", "posq": true, "cap": 45, "no": 1}, {"sec": "親屬", "w": "father", "pos": "n.", "zh": "父親", "ex": "My father is a nurse.", "exz": "我爸爸是護理師。", "pl": "fathers", "plr": "s", "der": ["dad 爸爸（口語）", "grandfather 祖父"], "note": "", "tex": "Paul is my father.", "posq": true, "cap": 15}, {"sec": "親屬", "w": "dad", "pos": "n.", "zh": "爸爸", "ex": "My dad is tall.", "exz": "我爸爸很高。", "pl": "dads", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 8}, {"sec": "親屬", "w": "mother", "pos": "n.", "zh": "母親", "ex": "My mother is a doctor.", "exz": "我媽媽是醫生。", "pl": "mothers", "plr": "s", "der": ["mom 媽媽（口語）", "grandmother 祖母"], "note": "", "tex": "Lily is my mother.", "posq": true, "cap": 14}, {"sec": "親屬", "w": "mom", "pos": "n.", "zh": "媽媽", "ex": "My mom is beautiful.", "exz": "我媽媽很漂亮。", "pl": "moms", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 15}, {"sec": "親屬", "w": "parent", "pos": "n.", "zh": "雙親之一", "ex": "My parents are nice.", "exz": "我的爸媽人很好。", "pl": "parents", "plr": "s", "der": ["parents 父母（兩個人）", "grandparent 祖父母之一"], "note": "爸爸＋媽媽兩個人要用 parents", "tex": "", "posq": true, "cap": 24, "no": 9}, {"sec": "親屬", "w": "brother", "pos": "n.", "zh": "哥哥；弟弟", "ex": "Eddie is my brother.", "exz": "Eddie 是我的哥哥。", "pl": "brothers", "plr": "s", "der": [], "note": "英文不分哥哥、弟弟", "tex": "Eddie is my brother.", "posq": true, "cap": 17}, {"sec": "親屬", "w": "sister", "pos": "n.", "zh": "姊姊；妹妹", "ex": "Bella is my sister.", "exz": "Bella 是我的姊姊。", "pl": "sisters", "plr": "s", "der": [], "note": "英文不分姊姊、妹妹", "tex": "", "posq": true, "cap": 15}, {"sec": "親屬", "w": "son", "pos": "n.", "zh": "兒子", "ex": "Nick is Paul's son.", "exz": "Nick 是 Paul 的兒子。", "pl": "sons", "plr": "s", "der": ["grandson 孫子"], "note": "", "tex": "", "posq": true, "cap": 10, "no": 7}, {"sec": "親屬", "w": "daughter", "pos": "n.", "zh": "女兒", "ex": "Bella is Lily's daughter.", "exz": "Bella 是 Lily 的女兒。", "pl": "daughters", "plr": "s", "der": ["granddaughter 孫女"], "note": "gh 不發音", "tex": "", "posq": true, "cap": 8, "no": 8}, {"sec": "親屬", "w": "child", "pos": "n.", "zh": "孩子", "ex": "The child is cute.", "exz": "那個孩子很可愛。", "pl": "children", "plr": "irr", "der": ["grandchild 孫子女", "children 孩子們（複數）"], "note": "複數是 children，不加 s", "tex": "", "posq": true, "cap": 32, "no": 10}, {"sec": "親屬", "w": "husband", "pos": "n.", "zh": "丈夫", "ex": "Paul is Lily's husband.", "exz": "Paul 是 Lily 的丈夫。", "pl": "husbands", "plr": "s", "der": [], "note": "", "tex": "This is my husband, Paul.", "posq": true, "cap": 2, "no": 2}, {"sec": "親屬", "w": "wife", "pos": "n.", "zh": "妻子", "ex": "Lily is Paul's wife.", "exz": "Lily 是 Paul 的妻子。", "pl": "wives", "plr": "ves", "der": [], "note": "f／fe 結尾改 -ves", "tex": "This is my wife, Lily.", "posq": true, "cap": 8, "no": 3}, {"sec": "親屬", "w": "grandfather", "pos": "n.", "zh": "祖父；外祖父", "ex": "My grandfather is seventy-five.", "exz": "我爺爺七十五歲。", "pl": "grandfathers", "plr": "s", "der": ["grandpa 爺爺（口語）", "grand- 字首＝隔一代"], "note": "", "tex": "My grandfather is a farmer.", "posq": true, "cap": 4}, {"sec": "親屬", "w": "grandmother", "pos": "n.", "zh": "祖母；外祖母", "ex": "My grandmother is a cook.", "exz": "我奶奶是廚師。", "pl": "grandmothers", "plr": "s", "der": ["grandma 奶奶（口語）"], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "親屬", "w": "grandson", "pos": "n.", "zh": "孫子", "ex": "Nick is Dave's grandson.", "exz": "Nick 是 Dave 的孫子。", "pl": "grandsons", "plr": "s", "der": ["grand-＋son"], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "親屬", "w": "granddaughter", "pos": "n.", "zh": "孫女", "ex": "Ann is Tina's granddaughter.", "exz": "Ann 是 Tina 的孫女。", "pl": "granddaughters", "plr": "s", "der": ["grand-＋daughter"], "note": "中間有兩個 d", "tex": "", "posq": true, "cap": 0}, {"sec": "親屬", "w": "uncle", "pos": "n.", "zh": "叔叔；伯伯；舅舅；姑丈；姨丈", "ex": "Frank is Nick's uncle.", "exz": "Frank 是 Nick 的叔叔。", "pl": "uncles", "plr": "s", "der": [], "note": "英文一個字全包", "tex": "", "posq": true, "cap": 4, "no": 4}, {"sec": "親屬", "w": "aunt", "pos": "n.", "zh": "嬸嬸；伯母；姑姑；阿姨；舅媽", "ex": "Mia is Nick's aunt.", "exz": "Mia 是 Nick 的嬸嬸。", "pl": "aunts", "plr": "s", "der": [], "note": "母音開頭，前面用 an：an aunt", "tex": "", "posq": true, "cap": 4, "no": 5}, {"sec": "親屬", "w": "cousin", "pos": "n.", "zh": "堂（表）兄弟姊妹", "ex": "Ann is Nick's cousin.", "exz": "Ann 是 Nick 的堂妹。", "pl": "cousins", "plr": "s", "der": [], "note": "不分男女、不分堂表；ou 唸 /ʌ/", "tex": "This is Nick. He's my cousin.", "posq": true, "cap": 0, "no": 6}, {"sec": "人物外表", "w": "man", "pos": "n.", "zh": "男人", "ex": "That man is my uncle.", "exz": "那個男人是我叔叔。", "pl": "men", "plr": "irr", "der": ["men 男人們（複數）", "young man 年輕男子"], "note": "複數 men，不加 s", "tex": "Who's that young man?", "posq": true, "cap": 34, "no": 12}, {"sec": "人物外表", "w": "woman", "pos": "n.", "zh": "女人", "ex": "She is a beautiful woman.", "exz": "她是個美麗的女人。", "pl": "women", "plr": "irr", "der": ["women 女人們（複數，唸 /ˈwɪmɪn/）"], "note": "複數 women，不加 s", "tex": "She is a beautiful woman.", "posq": true, "cap": 32, "no": 32}, {"sec": "人物外表", "w": "friend", "pos": "n.", "zh": "朋友", "ex": "Scott is Bella's friend.", "exz": "Scott 是 Bella 的朋友。", "pl": "friends", "plr": "s", "der": [], "note": "", "tex": "He's Bella's friend, and his name is Scott.", "posq": true, "cap": 43}, {"sec": "人物外表", "w": "young", "pos": "adj.", "zh": "年輕的", "ex": "My PE teacher is young.", "exz": "我的體育老師很年輕。", "pl": "", "plr": "none", "der": ["反義：old 年老的"], "note": "", "tex": "Who's that young man?", "posq": true, "cap": 15, "no": 11}, {"sec": "人物外表", "w": "old", "pos": "adj.", "zh": "年老的；……歲的", "ex": "My grandfather is old.", "exz": "我爺爺年紀大了。", "pl": "", "plr": "none", "der": ["How old are you? 你幾歲？", "反義：young 年輕的"], "note": "母音開頭：an old man", "tex": "", "posq": true, "cap": 38}, {"sec": "人物外表", "w": "tall", "pos": "adj.", "zh": "高的", "ex": "He is tall and handsome.", "exz": "他又高又帥。", "pl": "", "plr": "none", "der": ["反義：short 矮的"], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "人物外表", "w": "short", "pos": "adj.", "zh": "矮的；短的", "ex": "My brother is short.", "exz": "我弟弟很矮。", "pl": "", "plr": "none", "der": ["反義：tall 高的（人）／long 長的（東西）"], "note": "", "tex": "", "posq": true, "cap": 7}, {"sec": "人物外表", "w": "thin", "pos": "adj.", "zh": "瘦的", "ex": "The cat is thin.", "exz": "那隻貓很瘦。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 0}, {"sec": "人物外表", "w": "handsome", "pos": "adj.", "zh": "英俊的", "ex": "Scott is handsome.", "exz": "Scott 很帥。", "pl": "", "plr": "none", "der": ["多形容男生；女生用 beautiful"], "note": "d 不發音", "tex": "He's tall and handsome.", "posq": true, "cap": 4, "no": 13}, {"sec": "人物外表", "w": "beautiful", "pos": "adj.", "zh": "漂亮的；美麗的", "ex": "My aunt is beautiful.", "exz": "我阿姨很漂亮。", "pl": "", "plr": "none", "der": ["多形容女生"], "note": "", "tex": "She is a beautiful woman.", "posq": true, "cap": 16, "no": 31}, {"sec": "人物外表", "w": "cute", "pos": "adj.", "zh": "可愛的", "ex": "Abby is cute.", "exz": "Abby 很可愛。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "She's cute.", "posq": true, "cap": 2, "no": 36}, {"sec": "人物外表", "w": "nice", "pos": "adj.", "zh": "好的；好心的", "ex": "My grandparents are nice.", "exz": "我的祖父母人很好。", "pl": "", "plr": "none", "der": ["Nice to meet you. 很高興認識你"], "note": "", "tex": "They are nice.", "posq": true, "cap": 28, "no": 37}, {"sec": "人物外表", "w": "strict", "pos": "adj.", "zh": "嚴格的", "ex": "Our math teacher is strict.", "exz": "我們的數學老師很嚴格。", "pl": "", "plr": "none", "der": [], "note": ", "exz": "很高興認識你，Eric。我是 Jay。", "pl": "", "plr": "none", "der": ["回答：Nice to meet you, too."], "note": "", "tex": "", "posq": false, "cap": 0, "no": 21}, {"sec": "學校對話", "w": "news", "pos": "n.", "zh": "消息；新聞", "ex": "Good news! Bella is our teacher.", "exz": "好消息！Bella 是我們的老師。", "pl": "", "plr": "unc", "der": ["Good news! 好消息！"], "note": "字尾有 s 但不可數，沒有複數", "tex": "", "posq": true, "cap": 39, "no": 23}, {"sec": "學校對話", "w": "problem", "pos": "n.", "zh": "問題", "ex": "What's the problem?", "exz": "怎麼了？", "pl": "problems", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 40, "no": 24}, {"sec": "學校對話", "w": "PE", "pos": "n.", "zh": "體育", "ex": "PE is fun.", "exz": "體育課很好玩。", "pl": "", "plr": "unc", "der": ["physical education 的縮寫"], "note": "", "tex": "", "posq": true, "cap": 2, "no": 15}, {"sec": "學校對話", "w": "really", "pos": "adv.", "zh": "真地；真的", "ex": "Really? He is our teacher?", "exz": "真的嗎？他是我們的老師？", "pl": "", "plr": "none", "der": ["Really? 真的嗎？"], "note": "", "tex": "", "posq": true, "cap": 28, "no": 16}, {"sec": "學校對話", "w": "too", "pos": "adv.", "zh": "也", "ex": "She's a strict teacher, too.", "exz": "她也是個嚴格的老師。", "pl": "", "plr": "none", "der": ["放句尾，前面加逗號：…, too."], "note": "", "tex": "", "posq": true, "cap": 51, "no": 22}, {"sec": "學校對話", "w": "junior high school", "pos": "n.", "zh": "國民中學", "ex": "I'm a junior high school student.", "exz": "我是國中生。", "pl": "", "plr": "none", "der": ["senior high school 高中"], "note": "", "tex": "", "posq": true, "cap": 2, "no": 26}, {"sec": "學校對話", "w": "senior high school", "pos": "n.", "zh": "高級中學", "ex": "Eddie is a senior high school student.", "exz": "Eddie 是高中生。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 0, "no": 34}, {"sec": "功能字", "w": "who", "pos": "pron.", "zh": "誰", "ex": "Who's that young man?", "exz": "那個年輕男子是誰？", "pl": "", "plr": "none", "der": ["who's＝who is"], "note": "", "tex": "", "posq": false, "cap": 83}, {"sec": "功能字", "w": "our", "pos": "pron.", "zh": "我們的", "ex": "He's our new PE teacher.", "exz": "他是我們的新體育老師。", "pl": "", "plr": "none", "der": ["we 我們 → our 我們的"], "note": "", "tex": "", "posq": false, "cap": 51, "no": 14}], "texts": [{"id": "d1", "title": "Dialogue 1（At school）", "src": "課本 p.11", "lines": [{"sp": "Ann", "en": "Good morning, Nick.", "zh": "早安，Nick。", "hl": false, "note": ""}, {"sp": "Nick", "en": "Good morning, Ann.", "zh": "早安，Ann。", "hl": false, "note": ""}, {"sp": "Ann", "en": "Nick, who's that young man? He's tall and handsome.", "zh": "Nick，那位年輕男子是誰？他又高又帥。", "hl": true, "note": "who's＝who is；He's＝He is。tall and handsome：兩個形容詞用 and 連起來。"}, {"sp": "Nick", "en": "He's our new PE teacher.", "zh": "他是我們的新體育老師。", "hl": true, "note": "our 是「我們的」，後面接名詞 teacher。"}, {"sp": "Ann", "en": "Really?", "zh": "真的嗎？", "hl": false, "note": ""}, {"sp": "Nick", "en": "Yes, he's Bella's friend, and his name is Scott.", "zh": "是的，他是 Bella 的朋友，他的名字叫 Scott。", "hl": false, "note": "同一句有兩種 's：he's＝he is；Bella's＝Bella 的（所有格）。he → his（他的）。"}]}, {"id": "d2", "title": "Dialogue 2（In the classroom）", "src": "課本 p.12", "lines": [{"sp": "Rita", "en": "Ann, we're in the same class again!", "zh": "Ann，我們又同班了！", "hl": true, "note": "the same class：same 前面要加 the。"}, {"sp": "Ann", "en": "Yeah, it's great! Hi, Rita. This is Nick. He's my cousin. He's in Class 701.", "zh": "對啊，太棒了！嗨，Rita。這是 Nick，他是我的堂哥。他在 701 班。", "hl": true, "note": "介紹別人：This is…＋He's…。"}, {"sp": "Rita", "en": "Nice to meet you, Nick. I'm Rita.", "zh": "很高興認識你，Nick。我是 Rita。", "hl": false, "note": ""}, {"sp": "Nick", "en": "Nice to meet you, too, Rita.", "zh": "我也很高興認識妳，Rita。", "hl": false, "note": "回答 Nice to meet you. 要加 too。"}, {"sp": "Ann", "en": "Hey, Rita. Good news! Bella is our English teacher!", "zh": "嘿，Rita。好消息！Bella 是我們的英文老師！", "hl": false, "note": ""}, {"sp": "Nick", "en": "Oh, no. That's not good.", "zh": "喔，不。那可不妙。", "hl": false, "note": ""}, {"sp": "Ann", "en": "What's the problem? She's a great teacher.", "zh": "有什麼問題？她是很棒的老師。", "hl": false, "note": ""}, {"sp": "Nick", "en": "Well... she's a strict teacher, too.", "zh": "嗯……她也是個嚴格的老師。", "hl": false, "note": ""}, {"sp": "Bella", "en": "Nick!", "zh": "Nick！", "hl": false, "note": ""}]}, {"id": "rd", "title": "Reading〈The Lins〉", "src": "課本 p.17", "lines": [{"sp": "", "en": "Hi, I'm Nick. I'm a junior high school student. I'm from a warm family.", "zh": "嗨，我是 Nick。我是國中生。我來自一個溫暖的家庭。", "hl": true, "note": "the Lins＝林家人，後面接複數 are；the Lin family＝林家，後面接單數 is。"}, {"sp": "", "en": "My grandfather is a farmer. My grandmother is a cook. They are nice.", "zh": "我的祖父是農夫。我的祖母是廚師。他們人很好。", "hl": false, "note": "主詞換成 They，be 動詞就要用 are。"}, {"sp": "", "en": "Paul is my father. He is a tall man. He is a nurse.", "zh": "Paul 是我的爸爸。他是個高個子的男人。他是護理師。", "hl": false, "note": ""}, {"sp": "", "en": "Lily is my mother. She is a beautiful woman. She is a doctor.", "zh": "Lily 是我的媽媽。她是個美麗的女人。她是醫生。", "hl": true, "note": ""}, {"sp": "", "en": "Bella is my sister. She is my English teacher, too.", "zh": "Bella 是我的姊姊。她也是我的英文老師。", "hl": false, "note": ""}, {"sp": "", "en": "Eddie is my brother. He's a senior high school student.", "zh": "Eddie 是我的哥哥。他是高中生。", "hl": false, "note": ""}, {"sp": "", "en": "Abby is our pet pig. She's cute.", "zh": "Abby 是我們的寵物豬。牠很可愛。", "hl": false, "note": ""}]}, {"id": "ru", "title": "Read Up〈The Park Family〉", "src": "課本 p.21（選讀）", "lines": [{"sp": "", "en": "Hi, I'm Gina Park. I'm a junior high school student.", "zh": "嗨，我是 Gina Park。我是國中生。", "hl": false, "note": ""}, {"sp": "", "en": "My dad is a firefighter, and my mom is a teacher.", "zh": "我爸爸是消防員，我媽媽是老師。", "hl": false, "note": ""}, {"sp": "", "en": "I have two brothers and one sister.", "zh": "我有兩個哥哥和一個姊姊。", "hl": false, "note": ""}, {"sp": "", "en": "My brothers work at a zoo. They take care of the animals there.", "zh": "我的哥哥們在動物園工作。他們在那裡照顧動物。", "hl": false, "note": "there＝前一句的 a zoo（代詞指涉，會考題型）。take care of＝照顧。"}, {"sp": "", "en": "My sister is a waste collector. They are my family. What about your family?", "zh": "我姊姊是清潔隊員。他們是我的家人。你的家人呢？", "hl": false, "note": ""}]}], "grammar": [{"id": "be-agr", "name": "be 動詞的搭配", "icon": "🔗", "c": ["BE-AGR"], "intro": "be 動詞有三個長相：am、is、are。用哪一個，<b>完全由主詞決定</b>。", "table": [["主詞", "be 動詞", "例句"], ["I", "am", "I <b>am</b> Nick."], ["he／she／it／一個人名", "is", "Ann <b>is</b> my cousin."], ["you", "are", "You <b>are</b> my friend."], ["we／they／兩個人以上", "are", "Ann and Henry <b>are</b> cousins."]], "flows": [{"title": "主詞從一個變成兩個", "steps": [{"tokens": ["Ann", "is", "my", "cousin", "."], "hl": [0, 1], "note": "主詞 Ann 是<b>一個人</b> → 用 is"}, {"tokens": ["Ann", "and", "Henry", "are", "my", "cousins", "."], "hl": [0, 1, 2, 3], "note": "主詞變成 Ann and Henry＝<b>兩個人</b> → is 要改成 are"}, {"tokens": ["They", "are", "my", "cousins", "."], "hl": [0, 1], "note": "兩個人可以用 They 代替 → 還是 are；cousin 也要加 s"}]}, {"title": "the Lins 和 the Lin family（課堂筆記）", "steps": [{"tokens": ["The", "Lins", "are", "nice", "."], "hl": [1, 2], "note": "the Lins＝林家的<b>每一個人</b>（複數）→ are"}, {"tokens": ["The", "Lin", "family", "is", "warm", "."], "hl": [2, 3], "note": "the Lin family＝林家這<b>一個</b>家庭 → is"}]}], "tutor": [{"say": "先考你：「Nick and Eddie ___ brothers.」空格要填什麼？", "ch": [{"t": "is", "ok": false, "re": "Nick and Eddie 是幾個人？兩個喔！一個人才用 is。"}, {"t": "are", "ok": true, "re": "對！兩個人以上就用 are。你是先數主詞才決定的，這就是訣竅。"}, {"t": "am", "ok": false, "re": "am 只跟 I 在一起。這裡的主詞是 Nick and Eddie。"}]}, {"say": "那「My family ___ warm.」呢？family 裡面明明有很多人……", "ch": [{"t": "are", "ok": false, "re": "陷阱！family 指的是「一個家庭」，算一個 → is。如果是 the Lins（林家每個人）才用 are。"}, {"t": "is", "ok": true, "re": "沒錯！family＝一個家庭，用 is。課本 The Lins 那課的筆記就是在講這個。"}]}, {"say": "最後一題：「You and I ___ in the same class.」", "ch": [{"t": "am", "ok": false, "re": "I 單獨出現才用 am。You and I 是兩個人＝we。"}, {"t": "are", "ok": true, "re": "對！You and I＝we，用 are。主詞裡有 I 也不一定用 am，要看整個主詞。"}, {"t": "is", "ok": false, "re": "兩個人不會用 is 喔。"}]}]}, {"id": "be-pos", "name": "be 動詞的位置（否定・問句・簡答）", "icon": "🔀", "c": ["BE-NEG", "BE-Q", "BE-ANS"], "intro": "同一個句子可以變出四種樣子。<b>其他字都不動，只有 be 動詞在搬家</b>，跟著字卡一步一步看。", "table": [["句型", "怎麼變", "例句"], ["直述句", "主詞＋be", "He <b>is</b> a cook."], ["否定句", "be 後面加 not", "He <b>is not</b> a cook.（＝He isn't／He's not）"], ["問句", "be 搬到句首，句尾改問號", "<b>Is</b> he a cook?"], ["簡答", "Yes／No＋代名詞＋be", "Yes, he <b>is</b>.／No, he <b>isn't</b>."]], "flows": [{"title": "直述句 → 否定句", "steps": [{"tokens": ["He", "is", "a", "cook", "."], "hl": [1], "note": "直述句：找到 be 動詞 <b>is</b>"}, {"tokens": ["He", "is", "not", "a", "cook", "."], "hl": [2], "note": "否定句：在 is 的<b>後面</b>插入 not"}, {"tokens": ["He", "isn't", "a", "cook", "."], "hl": [1], "note": "is not 可以縮成 <b>isn't</b>"}]}, {"title": "直述句 → 問句 → 簡答", "steps": [{"tokens": ["He", "is", "a", "cook", "."], "hl": [1], "note": "直述句：找到 be 動詞 <b>is</b>"}, {"tokens": ["Is", "he", "a", "cook", "?"], "hl": [0, 4], "note": "問句：is 搬到<b>句首</b>（大寫 Is），he 變小寫，句點改<b>問號</b>"}, {"tokens": ["Yes", ",", "he", "is", "."], "hl": [2, 3], "note": "肯定簡答：Yes, he is.（🔴 不能縮成 he's）"}, {"tokens": ["No", ",", "he", "isn't", "."], "hl": [3], "note": "否定簡答：No, he isn't.（可以縮寫）"}]}, {"title": "主詞是人名時的簡答", "steps": [{"tokens": ["Is", "Bella", "your", "sister", "?"], "hl": [1], "note": "問句的主詞是人名 Bella"}, {"tokens": ["Yes", ",", "she", "is", "."], "hl": [2], "note": "簡答要把 Bella 換成<b>代名詞</b> she"}]}, {"title": "I 的否定句", "steps": [{"tokens": ["I", "am", "a", "student", "."], "hl": [1], "note": "I 配 am"}, {"tokens": ["I", "am", "not", "a", "teacher", "."], "hl": [2], "note": "否定：am 後面加 not"}, {"tokens": ["I'm", "not", "a", "teacher", "."], "hl": [0], "note": "只能縮成 <b>I'm not</b>（🔴 沒有 amn't）"}]}], "tutor": [{"say": "「She is your aunt.」要改成問句，第一步做什麼？", "ch": [{"t": "在句首加 Do", "ok": false, "re": "有 be 動詞就不需要 do。Do 是一般動詞用的（七下才學）。"}, {"t": "把 is 搬到句首", "ok": true, "re": "對！Is she your aunt? 其他字的順序都不動。"}, {"t": "把 she 搬到句尾", "ok": false, "re": "主詞不用動喔，搬家的只有 be 動詞。"}]}, {"say": "「Is Frank Henry's father?」肯定的簡答是哪一個？", "ch": [{"t": "Yes, Frank is.", "ok": false, "re": "簡答要用代名詞，不重複人名。Frank 是男生 → he。"}, {"t": "Yes, he's.", "ok": false, "re": "🔴 肯定簡答不能縮寫，這是段考最愛考的陷阱。"}, {"t": "Yes, he is.", "ok": true, "re": "完美！代名詞 he＋不縮寫的 is。"}]}, {"say": "「I am a cook.」改否定，下面哪一個是錯的？", "ch": [{"t": "I am not a cook.", "ok": false, "re": "這個是對的喔，再看看其他選項。"}, {"t": "I'm not a cook.", "ok": false, "re": "這個也對，I am → I'm。"}, {"t": "I amn't a cook.", "ok": true, "re": "答對了，這個是錯的！am not 不能縮成 amn't。"}]}]}, {"id": "poss", "name": "所有格和代名詞", "icon": "👜", "c": ["POSS", "PRON"], "intro": "你覺得所有格很難，是因為不知道<b>什麼時候要用</b>。其實只要看一件事：<b>後面有沒有接名詞</b>。", "table": [["主格（當主詞）", "所有格（誰的）", "例句"], ["I", "my", "<b>My</b> name is Nick."], ["you", "your", "Is this <b>your</b> pig?"], ["he", "his", "<b>His</b> name is Scott."], ["she", "her", "<b>Her</b> name is Rita."], ["it", "its", "<b>Its</b> name is Abby."], ["we", "our", "He's <b>our</b> teacher."], ["they", "their", "<b>Their</b> son is Nick."], ["人名 Nick", "Nick's", "Dave is <b>Nick's</b> grandfather."]], "flows": [{"title": "判斷：要用 he 還是 his？", "steps": [{"tokens": ["___", "is", "tall", "."], "hl": [0], "note": "空格後面是 <b>is</b>（be 動詞）→ 這裡需要一個「主詞」"}, {"tokens": ["He", "is", "tall", "."], "hl": [0], "note": "主詞 → 用主格 <b>He</b>"}, {"tokens": ["___", "name", "is", "Scott", "."], "hl": [0, 1], "note": "空格後面是 <b>name</b>（名詞）→ 要說「誰的」名字"}, {"tokens": ["His", "name", "is", "Scott", "."], "hl": [0], "note": "名詞前面 → 用所有格 <b>His</b>"}]}, {"title": "一句話裡的兩種 's（課本 p.11）", "steps": [{"tokens": ["he's", "Bella's", "friend"], "hl": [0], "note": "<b>he's</b>＝he is（後面沒有名詞，是縮寫）"}, {"tokens": ["he's", "Bella's", "friend"], "hl": [1], "note": "<b>Bella's</b>＋friend（後面有名詞）＝Bella 的朋友（所有格）"}]}, {"title": "its 和 it's", "steps": [{"tokens": ["It's", "my", "pig", "."], "hl": [0], "note": "<b>It's</b>＝It is（有撇號＝縮寫）"}, {"tokens": ["Its", "name", "is", "Abby", "."], "hl": [0, 1], "note": "<b>Its</b>＋name＝牠的名字（沒撇號＝所有格）"}]}, {"title": "兩個人的所有格", "steps": [{"tokens": ["Paul", "and", "Lily", "are", "Nick's", "parents", "."], "hl": [4], "note": "Nick's＝Nick 的"}, {"tokens": ["Their", "son", "is", "Nick", "."], "hl": [0], "note": "Paul and Lily 是兩個人 → 他們的＝<b>Their</b>"}]}], "tutor": [{"say": "「Ann is my cousin. ___ is twelve.」空格後面是什麼？", "ch": [{"t": "是名詞", "ok": false, "re": "再看一次，空格後面是 is。"}, {"t": "是 be 動詞 is", "ok": true, "re": "對！後面是 be 動詞，所以要一個主詞。Ann 是女生 → She。"}]}, {"say": "那「Ann is my cousin. ___ mother is Mia.」呢？", "ch": [{"t": "She", "ok": false, "re": "空格後面是 mother（名詞），要說「她的」媽媽。"}, {"t": "Her", "ok": true, "re": "答對！名詞前面用所有格。Her mother＝她的媽媽。"}, {"t": "She's", "ok": false, "re": "She's＝She is，「她是媽媽」意思就不對了。"}]}, {"say": "「Look at the dog. ___ name is Lucky.」", "ch": [{"t": "It's", "ok": false, "re": "It's＝It is。「它是名字」不通喔。"}, {"t": "Its", "ok": true, "re": "對！Its＋name＝牠的名字。沒撇號才是所有格。"}, {"t": "His", "ok": false, "re": "動物一般用 it、its。"}]}]}, {"id": "family", "name": "🌳 家庭樹專區", "icon": "🌳", "c": ["FAM-WORD", "FAM-FLIP"], "intro": "家庭樹的題目要做三件事：<b>①看懂線 ②叫得出稱謂 ③換個人當主詞也不亂</b>。下面先學怎麼看線，再到互動家庭樹點點看。", "table": [["男生", "女生", "說明"], ["father（dad）", "mother（mom）", "父母＝parents"], ["son", "daughter", "兒子／女兒"], ["brother", "sister", "不分大小"], ["husband", "wife", "夫妻"], ["grandfather", "grandmother", "隔一代 grand-"], ["grandson", "granddaughter", "孫子／孫女"], ["uncle", "aunt", "爸媽的兄弟姊妹（和他們的另一半）"], ["cousin", "cousin", "uncle／aunt 的小孩，不分男女"]], "flows": [{"title": "家庭樹的線怎麼看", "steps": [{"tokens": ["Dave", "＝", "Tina"], "hl": [1], "note": "<b>橫線</b>連起來的兩個人＝夫妻（husband／wife）"}, {"tokens": ["Dave＆Tina", "↓", "Paul", "Frank"], "hl": [1], "note": "從夫妻中間<b>往下</b>的線＝他們的孩子（son／daughter）"}, {"tokens": ["Paul", "—", "Frank"], "hl": [1], "note": "同一條橫桿下面的人＝兄弟姊妹（brother／sister）"}]}, {"title": "換角度：Paul is Nick's father.", "steps": [{"tokens": ["Paul", "is", "Nick's", "father", "."], "hl": [0, 3], "note": "Paul（男）是 Nick 的<b>爸爸</b>"}, {"tokens": ["Nick", "is", "Paul's", "___", "."], "hl": [0, 3], "note": "換 Nick 當主詞：Nick 是男生，爸爸的「相反」是兒子"}, {"tokens": ["Nick", "is", "Paul's", "son", "."], "hl": [3], "note": "→ <b>son</b>（如果是 Bella 就是 daughter）"}]}, {"title": "cousin 是怎麼來的", "steps": [{"tokens": ["Frank", "is", "Nick's", "uncle", "."], "hl": [3], "note": "Frank 是 Nick 爸爸的弟弟 → uncle"}, {"tokens": ["Ann", "is", "Frank's", "daughter", "."], "hl": [3], "note": "Ann 是 Frank 的女兒"}, {"tokens": ["Ann", "is", "Nick's", "cousin", "."], "hl": [3], "note": "uncle 的小孩＝<b>cousin</b>（不分男女）"}]}], "tutor": [{"say": "Mia 是 Ann 的媽媽，Frank 是 Ann 的爸爸。Mia 是 Frank 的什麼人？", "ch": [{"t": "sister", "ok": false, "re": "Mia 和 Frank 是 Ann 的爸媽，他們是夫妻喔。"}, {"t": "wife", "ok": true, "re": "對！Mia is Frank's wife. 反過來 Frank is Mia's husband。"}, {"t": "mother", "ok": false, "re": "Mia 是 Ann 的媽媽，不是 Frank 的媽媽。"}]}, {"say": "Dave is Nick's grandfather. 反過來，Nick is Dave's ___?", "ch": [{"t": "grandfather", "ok": false, "re": "換角度後，主詞是 Nick（孫子那一輩）。"}, {"t": "grandson", "ok": true, "re": "答對！Nick 是男生 → grandson。Ann 就是 granddaughter。"}, {"t": "son", "ok": false, "re": "Nick 和 Dave 差兩代，要加 grand-。"}]}, {"say": "Lily is Henry's ___?（提示：Lily 是 Henry 爸爸的哥哥的太太）", "ch": [{"t": "aunt", "ok": true, "re": "完全正確！課本 p.10 Read and Fill In 第 3 題就是這題。"}, {"t": "mother", "ok": false, "re": "Henry 的媽媽是 Mia。"}, {"t": "cousin", "ok": false, "re": "cousin 是同一輩的。Lily 是 Henry 爸媽那一輩。"}]}]}, {"id": "plural", "name": "名詞複數規則", "icon": "🔢", "c": ["PL-REG", "PL-IRR"], "intro": "兩個以上就要用複數。大部分加 s，但有幾種字會變形，還有幾個字<b>完全不照規則</b>，一定要背。", "table": [["規則", "怎麼變", "例子"], ["一般", "加 -s", "cousin → cousins、teacher → teachers"], ["字尾 s／x／sh／ch", "加 -es（因為多一個音 /ɪz/）", "class → classes、box → boxes"], ["子音＋y", "去 y 加 -ies", "family → families、baby → babies"], ["母音＋y", "直接加 -s", "boy → boys、day → days"], ["字尾 f／fe", "去 f(e) 加 -ves", "wife → wives、knife → knives"], ["🔴 不規則", "整個字變，不加 s", "man → <b>men</b>、woman → <b>women</b>、child → <b>children</b>"], ["🔴 不規則（L2 會遇到）", "母音變了", "mouse → <b>mice</b>、foot → feet、tooth → teeth"], ["🔴 單複數同形", "不變", "sheep、fish、deer"], ["不可數", "沒有複數", "news、PE（字尾有 s 的 news 也是不可數）"]], "flows": [{"title": "man 變 men：主詞變複數時，整句都要跟著改", "steps": [{"tokens": ["The", "man", "is", "a", "doctor", "."], "hl": [1, 2], "note": "一個男人：man＋is"}, {"tokens": ["The", "men", "are", "doctors", "."], "hl": [1, 2, 3], "note": "兩個男人：<b>men</b>＋<b>are</b>＋doctor 也加 s，a 拿掉"}]}, {"title": "child 變 children", "steps": [{"tokens": ["The", "child", "is", "cute", "."], "hl": [1, 2], "note": "一個孩子"}, {"tokens": ["The", "children", "are", "cute", "."], "hl": [1, 2], "note": "很多孩子：<b>children</b>（🔴 不是 childs，也不是 childrens）"}]}], "tutor": [{"say": "「My uncle has two ___.（wife）」……等等，這句不合理！換一題：「Mia and Lily are ___.（wife）」", "ch": [{"t": "wifes", "ok": false, "re": "f／fe 結尾要改 -ves。"}, {"t": "wives", "ok": true, "re": "對！wife → wives。Mia and Lily are wives. 她們都是太太。"}]}, {"say": "「Three ___ are in the classroom.（woman）」", "ch": [{"t": "womans", "ok": false, "re": "woman 是不規則複數，不加 s。"}, {"t": "women", "ok": true, "re": "答對！woman → women。注意 women 的 o 唸 /ɪ/。"}, {"t": "womens", "ok": false, "re": "women 已經是複數了，不能再加 s。"}]}, {"say": "Good news! 的 news 是幾個？", "ch": [{"t": "複數，因為有 s", "ok": false, "re": "陷阱！news 字尾有 s，但它是不可數名詞。"}, {"t": "不可數，沒有單複數", "ok": true, "re": "對！所以是 The news <b>is</b> good."}]}]}, {"id": "a-an", "name": "a／an 怎麼選", "icon": "🅰", "c": ["A-AN"], "intro": "不是看字母，是看<b>緊接在後面那個字的發音</b>：母音開頭用 an，子音開頭用 a。", "table": [["後面那個字", "用", "例子"], ["子音開頭", "a", "a cook、a young man、a tall boy"], ["母音開頭", "an", "an aunt、an old man、an English teacher"]], "flows": [{"title": "中間插了形容詞，冠詞跟著變", "steps": [{"tokens": ["a", "man"], "hl": [0, 1], "note": "man 是 m 開頭（子音）→ a"}, {"tokens": ["an", "old", "man"], "hl": [0, 1], "note": "中間插了 old（o 母音開頭）→ 改成 <b>an</b>"}, {"tokens": ["a", "young", "man"], "hl": [0, 1], "note": "插 young（y 子音）→ 還是 a"}]}], "tutor": [{"say": "「My grandmother is ___ old woman.」", "ch": [{"t": "a", "ok": false, "re": "緊接在後面的是 old，o 是母音。"}, {"t": "an", "ok": true, "re": "對！看的是 old 不是 woman。"}]}, {"say": "「Bella is ___ English teacher.」", "ch": [{"t": "a", "ok": false, "re": "English 的 E 是母音開頭喔。"}, {"t": "an", "ok": true, "re": "對！an English teacher。"}]}]}, {"id": "wh", "name": "疑問詞：Who／What／How old", "icon": "❓", "c": ["WH"], "intro": "看答句在回答什麼，就知道要用哪個疑問詞。", "table": [["要問", "疑問詞", "例子"], ["人（是誰、什麼關係）", "Who", "<b>Who</b> is he? — He is my uncle."], ["名字", "What", "<b>What</b>'s your name? — I'm Nick."], ["職業、東西", "What", "<b>What</b> is your father? — He's a nurse."], ["年紀", "How old", "<b>How old</b> is Henry? — He's six."]], "flows": [{"title": "從答句倒推問句", "steps": [{"tokens": ["He", "is", "my", "uncle", "."], "hl": [2, 3], "note": "答句說的是「關係」→ 問人"}, {"tokens": ["Who", "is", "he", "?"], "hl": [0], "note": "→ 用 <b>Who</b>"}, {"tokens": ["He", "is", "seventeen", "."], "hl": [2], "note": "答句說的是「年紀」"}, {"tokens": ["How old", "is", "he", "?"], "hl": [0], "note": "→ 用 <b>How old</b>"}]}], "tutor": [{"say": "A: ___ is that girl? B: She's my cousin, Ann.", "ch": [{"t": "What", "ok": false, "re": "答句在說「她是誰」（關係），問人要用 Who。"}, {"t": "Who", "ok": true, "re": "對！問人用 Who。"}, {"t": "How old", "ok": false, "re": "答句沒有說年紀喔。"}]}, {"say": "A: Who is Mr. Lin? B: ___", "ch": [{"t": "Yes, he is.", "ok": false, "re": "🔴 Who 問句不能用 Yes／No 回答。"}, {"t": "He is my PE teacher.", "ok": true, "re": "對！問「是誰」就回答身分或關係。"}]}]}, {"id": "conj", "name": "and／but／too", "icon": "➕", "c": ["CONJ"], "intro": "連接兩句話時：同方向用 and，相反用 but，「也」用 too 放句尾。", "table": [["用法", "意思", "例子"], ["and", "而且（同方向）", "He is tall <b>and</b> handsome."], ["but", "但是（相反）", "I am tall, <b>but</b> my brother isn't."], [", too", "也（放句尾）", "She's a strict teacher<b>, too</b>."]], "flows": [{"title": "but 後面的句子可以省略", "steps": [{"tokens": ["I", "am", "tall", ",", "but", "my", "brother", "is", "not", "tall", "."], "hl": [4], "note": "意思相反 → but"}, {"tokens": ["I", "am", "tall", ",", "but", "my", "brother", "isn't", "."], "hl": [7], "note": "後面重複的 tall 可以省略"}]}], "tutor": [{"say": "「I am thin, ___ my sister is, ___.」（我很瘦，我妹妹也是）", "ch": [{"t": "but；too", "ok": false, "re": "兩個人都瘦＝同方向，不用 but。"}, {"t": "and；too", "ok": true, "re": "對！同方向 and，「也」用 too 放句尾。"}]}]}, {"id": "adj", "name": "形容詞放哪裡", "icon": "📍", "c": ["ORDER"], "intro": "形容詞有兩個位置：<b>be 動詞後面</b>，或<b>名詞前面</b>。", "table": [["位置", "例子"], ["be 動詞後面", "He is <b>young</b>."], ["a＋形容詞＋名詞", "He is a <b>young</b> man."]], "flows": [{"title": "同一個意思，兩種寫法", "steps": [{"tokens": ["He", "is", "tall", "."], "hl": [2], "note": "tall 放在 is 後面"}, {"tokens": ["He", "is", "a", "tall", "boy", "."], "hl": [2, 3, 4], "note": "加了名詞 boy：a＋tall＋boy（🔴 不是 a boy tall）"}]}], "tutor": [{"say": "「Is Eddie ___?」哪個順序對？", "ch": [{"t": "a boy tall", "ok": false, "re": "中文說「一個男孩高」不通，英文也一樣。形容詞放名詞前面。"}, {"t": "a tall boy", "ok": true, "re": "對！a＋形容詞＋名詞。"}]}]}, {"id": "mech", "name": "大小寫和標點", "icon": "✏", "c": ["MECH"], "intro": "段考的翻譯題、手寫題，<b>沒寫標點就扣分</b>。寫完每一句檢查三件事。", "table": [["檢查", "例子"], ["① 句首大寫", "<b>M</b>y name is Nick."], ["② 人名、地名、I 大寫", "<b>A</b>nn and <b>I</b> are cousins."], ["③ 句尾有句點或問號", "Who is he<b>?</b>"]], "flows": [{"title": "改正這一句", "steps": [{"tokens": ["my", "name", "is", "nick"], "hl": [0, 3], "note": "錯在哪？句首小寫、人名小寫、沒有句點"}, {"tokens": ["My", "name", "is", "Nick", "."], "hl": [0, 3, 4], "note": "改好了：<b>M</b>y、<b>N</b>ick、句點"}]}], "tutor": [{"say": "哪一句完全正確？", "ch": [{"t": "ann and i are cousins.", "ok": false, "re": "人名 Ann、I 都要大寫。"}, {"t": "Ann and I are cousins.", "ok": true, "re": "完美！"}, {"t": "Ann and I are cousins", "ok": false, "re": "少了句尾的句點。"}]}]}], "questions": [{"id": "L1:mc01", "t": "mc", "set": "mc", "c": ["BE-AGR"], "q": "Sam and Leo ___ cousins.", "o": ["is", "am", "are", "be"], "a": 2, "x": "主詞 Sam and Leo 是兩個人 → are。", "L": "L1"}, {"id": "L1:mc02", "t": "mc", "set": "mc", "c": ["POSS", "MECH"], "q": "___ name is Tina. She is my aunt.", "o": ["She", "Her", "She's", "her"], "a": 1, "x": "後面接名詞 name → 所有格；放在句首要大寫 → Her。", "L": "L1"}, {"id": "L1:mc03", "t": "mc", "set": "mc", "c": ["BE-ANS"], "q": "A: Is your mother a doctor?<br>B: ___. She is a nurse.", "o": ["Yes, she is", "No, she isn't", "Yes, she isn't", "No, she is"], "a": 1, "x": "後面說她是護理師，所以不是醫生 → No, she isn't。Yes 配肯定、No 配否定。", "L": "L1"}, {"id": "L1:mc04", "t": "mc", "set": "mc", "c": ["WH"], "q": "A: ___ that tall man?<br>B: He is my uncle.", "o": ["What's", "Who's", "How old is", "What"], "a": 1, "x": "答句說的是關係（我叔叔）→ 問人用 Who。", "L": "L1"}, {"id": "L1:mc05", "t": "mc", "set": "mc", "c": ["FAM-WORD"], "q": "Frank is my father's brother. He is my ___.", "o": ["aunt", "cousin", "uncle", "grandfather"], "a": 2, "x": "爸爸的兄弟＝uncle。", "L": "L1"}, {"id": "L1:mc06", "t": "mc", "set": "mc", "c": ["FAM-WORD"], "q": "My aunt's daughter is my ___.", "o": ["sister", "cousin", "mother", "wife"], "a": 1, "x": "uncle、aunt 的小孩＝cousin。", "L": "L1"}, {"id": "L1:mc07", "t": "mc", "set": "mc", "c": ["ORDER", "A-AN"], "q": "A: Is Eddie ___?<br>B: Yes, he is.", "o": ["a boy tall", "tall a boy", "a tall boy", "tall boy"], "a": 2, "x": "冠詞 a 在最前面，形容詞放在名詞前面 → a tall boy。", "L": "L1"}, {"id": "L1:mc08", "t": "mc", "set": "mc", "c": ["A-AN"], "q": "My grandfather is ___ old farmer.", "o": ["a", "an", "the", "X"], "a": 1, "x": "緊接在後面的 old 是母音開頭 → an。", "L": "L1"}, {"id": "L1:mc09", "t": "mc", "set": "mc", "c": ["POSS"], "q": "Lily and Paul are Nick's parents. ___ son is Nick.", "o": ["His", "Her", "Their", "Our"], "a": 2, "x": "Lily and Paul 是兩個人 → 他們的＝Their。", "L": "L1"}, {"id": "L1:mc10", "t": "mc", "set": "mc", "c": ["POSS"], "q": "Your dog is cute. What's ___ name?", "o": ["it", "it's", "its", "their"], "a": 2, "x": "後面接名詞 name、指狗 → its（沒撇號）。it's＝it is。", "L": "L1"}, {"id": "L1:mc11", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "I am tall, ___ my brother isn't.", "o": ["and", "but", "too", "or"], "a": 1, "x": "我高、哥哥不高，意思相反 → but。", "L": "L1"}, {"id": "L1:mc12", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "My father is a cook, and my mother is a cook, ___.", "o": ["too", "but", "and", "X"], "a": 0, "x": "「也」放句尾、前面有逗號 → too。", "L": "L1"}, {"id": "L1:mc13", "t": "mc", "set": "mc", "c": ["BE-ANS"], "q": "A: Are Bella and Eddie your sister and brother?<br>B: Yes, ___.", "o": ["we are", "they are", "he is", "they're"], "a": 1, "x": "Bella and Eddie → they；肯定簡答不能縮寫，所以不能選 they're。", "L": "L1"},  的 ___", "a": ["uncle"], "x": "爸爸的兄弟 → uncle（不是 auncle）。", "L": "L1", "tsec": "wk-tree"}, {"id": "L1:wt4", "t": "fill", "set": "workbook", "c": ["FAM-WORD"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill） 從 Bill 的角度：Susan 是 Bill 的 ___", "a": ["mother"], "x": "Tom 是爸爸，Susan 是媽媽。", "L": "L1", "tsec": "wk-tree"}, {"id": "L1:wt5", "t": "fill", "set": "workbook", "c": ["FAM-WORD"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill） 從 Bill 的角度：Ben 是 Bill 的 ___", "a": ["cousin"], "x": "伯父的兒子 → cousin（不分堂表、男女）。", "L": "L1", "tsec": "wk-tree"}, {"id": "L1:wt6", "t": "fill", "set": "workbook", "c": ["FAM-WORD"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill） 從 Bill 的角度：Nina 是 Bill 的 ___", "a": ["sister"], "x": "同一對爸媽的女生 → sister。", "L": "L1", "tsec": "wk-tree"}, {"id": "L1:wt7", "t": "fill", "set": "workbook", "c": ["FAM-WORD"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill） 從 Bill 的角度：John 是 Bill 的 ___", "a": ["brother"], "x": "同一對爸媽的男生 → brother。", "L": "L1", "tsec": "wk-tree"}, {"id": "L1:wf1", "t": "fill", "set": "workbook", "c": ["FAM-FLIP"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill）（說話的人是 Ben）Bill is my ___.", "a": ["cousin"], "x": "Ben 和 Bill 的爸爸是兄弟 → cousin。", "L": "L1", "tsec": "wk-flip"}, {"id": "L1:wf2", "t": "fill", "set": "workbook", "c": ["FAM-FLIP"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill）（說話的人是 Susan）Nina is my ___.", "a": ["daughter"], "x": "Susan 是媽媽，Nina 是女兒。", "L": "L1", "tsec": "wk-flip"}, {"id": "L1:wf3", "t": "fill", "set": "workbook", "c": ["FAM-FLIP"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill）（說話的人是 John）Lily is my ___.", "a": ["aunt"], "x": "伯父 Kent 的太太 → aunt。", "L": "L1", "tsec": "wk-flip"}, {"id": "L1:wf4", "t": "fill", "set": "workbook", "c": ["FAM-FLIP"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill）（說話的人是 Tom）Susan is my ___.", "a": ["wife"], "x": "Tom 和 Susan 是夫妻 → wife。", "L": "L1", "tsec": "wk-flip"}, {"id": "L1:wf5", "t": "fill", "set": "workbook", "c": ["FAM-FLIP"], "q": "（Bill 的家：爺爺 Jacob＝奶奶 Anna；他們的兒子 Kent＝Lily，生了 Ben；另一個兒子 Tom＝Susan，生了 Nina、John 和 Bill）（說話的人是 Anna）Jacob is my ___.", "a": ["husband"], "x": "Anna 和 Jacob 是夫妻 → husband。", "L": "L1", "tsec": "wk-flip"}, {"id": "L1:wa1", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ family", "a": ["a"], "x": "f 子音 → a。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:wa2", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ orange", "a": ["an"], "x": "o 母音 → an。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:wa3", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ egg", "a": ["an"], "x": "e 母音 → an。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:wa4", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ watch", "a": ["a"], "x": "w 子音 → a。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:wa5", "t": "fill", "set": "workbook", "c": ["A-AN"], "q": "___ igloo", "a": ["an"], "x": "i 母音 → an（igloo 冰屋）。", "L": "L1", "tsec": "wk-aan"}, {"id": "L1:ws1", "t": "order", "set": "workbook", "c": ["BE-NEG", "ORDER"], "zh": "重組句子：teacher. / I'm / a / not / junior high school", "en": "I'm not a junior high school teacher.", "alt": ["I am not a junior high school teacher."], "x": "not 放在 am 後面；a＋junior high school＋teacher。", "L": "L1", "tsec": "wk-write"}, {"id": "L1:ws2", "t": "order", "set": "workbook", "c": ["WH"], "zh": "依畫線部分造原問句：The woman is <u>my aunt</u>.", "en": "Who is the woman?", "alt": ["Who's the woman?"], "x": "畫線的是「關係」→ 用 Who 問。🔴 不是 She is your aunt?", "L": "L1", "tsec": "wk-write"}, {"id": "L1:ws3", "t": "order", "set": "workbook", "c": ["ORDER"], "zh": "加入 beautiful 並改寫句子：Mia is a nurse.", "en": "Mia is a beautiful nurse.", "alt": [], "x": "形容詞放名詞前；beautiful 子音開頭，a 不用改。", "L": "L1", "tsec": "wk-write"}, {"id": "L1:ws4", "t": "order", "set": "workbook", "c": ["BE-ANS", "PRON"], "zh": "Is Mr. Wilson tall and young?（先簡答，再用 short and old 詳答）", "en": "No, he isn't. He's short and old.", "alt": ["No, he is not. He is short and old.", "No, he isn't. He is short and old."], "x": "Mr. Wilson → he；不高不年輕 → No，再詳答 short and old。", "L": "L1", "tsec": "wk-write"}, {"id": "L1:wr1", "t": "mc", "set": "workbook", "c": ["V-ZH"], "q": "（短文：Hi! This is my family. The woman is Mandy. She is a great cook. The man is her brother. His name is George. He is a PE teacher. Cathy is his daughter. She is my good friend. Who am I? I'm Crispy, Cathy's pet dog and good friend.） Which is NOT right?", "o": ["Mandy is a great cook.", "George's daughter is Cathy.", "George is a young student.", "Cathy's pet dog is her good friend."], "a": 2, "x": "George 是 PE teacher，不是學生。", "L": "L1", "tsec": "wk-read"}, {"id": "L1:wr2", "t": "mc", "set": "workbook", "c": ["FAM-WORD"], "q": "（短文：Hi! This is my family. The woman is Mandy. She is a great cook. The man is her brother. His name is George. He is a PE teacher. Cathy is his daughter. She is my good friend. Who am I? I'm Crispy, Cathy's pet dog and good friend.） Which family tree is right?", "o": ["Mandy 和 George 是兄妹；George 有一個女兒 Cathy。", "Mandy 和 George 是夫妻；他們有一個女兒。", "一對夫妻有兩個女兒。", "一對老夫妻有三個孩子。"], "a": 0, "x": "The man is her brother → Mandy 和 George 是兄妹（不是夫妻）；Cathy is his daughter → Cathy 是 George 的女兒。（習作原題是四張家庭樹圖，這裡改成文字）", "L": "L1", "tsec": "wk-read"}], "reading": [{"id": "L1:r1", "title": "閱讀（一）家庭樹", "tree": "wang", "p": "Look at the Wang family. The numbers are their ages.", "qs": [{"id": "L1:r1a", "t": "mc", "set": "read", "c": ["FAM-WORD"], "q": "There are ___ people in the family tree.", "o": ["seven", "eight", "nine", "ten"], "a": 2, "x": "Tom、Amy、Ben、Lisa、Grace、Sam、Kevin、Nina、Ella，共 9 人。", "L": "L1"}, {"id": "L1:r1b", "t": "mc", "set": "read", "c": ["FAM-WORD", "WH"], "q": "How old is Kevin's aunt?", "o": ["35", "37", "38", "40"], "a": 0, "x": "Kevin 的爸爸 Ben 的妹妹是 Grace（35）。Sam 是 uncle，Lisa 是媽媽。", "L": "L1"}, {"id": "L1:r1c", "t": "mc", "set": "read", "c": ["FAM-WORD", "FAM-FLIP"], "q": "Which is true?", "o": ["Sam is Ella's grandfather.", "Lisa is Amy's daughter.", "Ella is Nina's cousin.", "Ben is Grace's husband."], "a": 2, "x": "Ella 和 Nina 的爸媽是兄妹 → cousins。Sam 是 Ella 的爸爸；Lisa 是嫁進來的；Ben 和 Grace 是兄妹。", "L": "L1"}, {"id": "L1:r1d", "t": "mc", "set": "read", "c": ["FAM-FLIP"], "q": "Who is Tom's granddaughter?", "o": ["Lisa", "Grace", "Nina", "Kevin"], "a": 2, "x": "孫女＝兒女的女兒：Nina（Kevin 是孫子）。", "L": "L1"}]}, {"id": "L1:r2", "title": "閱讀（二）自我介紹", "tree": "", "p": "Hi, I'm Mia Chen. I'm thirteen years old, and I'm a junior high school student. My family is not big. My father is a doctor, and my mother is a doctor, too. They are busy, but they are nice. Ben is my brother. He isn't a student. He's a cook. <b>His</b> food is great! Lucky is our pet dog. It's old, but it's cute. What about your family?<div class='gloss'>busy 忙碌的　food 食物</div>", "qs": [{"id": "L1:r2a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is Mia's mother?", "o": ["A cook.", "A doctor.", "A nurse.", "A student."], "a": 1, "x": "my mother is a doctor, too.", "L": "L1"}, {"id": "L1:r2b", "t": "mc", "set": "read", "c": ["BE-NEG"], "q": "Which is true?", "o": ["Ben is a junior high school student.", "Mia's parents are not nice.", "Lucky is a young dog.", "Ben is a cook."], "a": 3, "x": "He isn't a student. He's a cook.", "L": "L1"}, {"id": "L1:r2c", "t": "mc", "set": "read", "c": ["POSS"], "q": "The word “His” in the passage means ___.", "o": ["Mia's father's", "Ben's", "Lucky's", "Mia's"], "a": 1, "x": "His 前一句講的是 Ben → Ben 的食物。（代詞指涉）", "L": "L1"}, {"id": "L1:r2d", "t": "mc", "set": "read", "c": ["PL-REG"], "q": "How many people are in Mia's family?", "o": ["Three.", "Four.", "Five.", "Six."], "a": 1, "x": "爸爸、媽媽、Ben、Mia＝4 人；Lucky 是狗，不是人。", "L": "L1"}]}, {"id": "L1:r3", "title": "閱讀（三）資料表", "tree": "", "p": "<tabl , "re": "What 問句不能用 Yes／No 回答。"}, {"t": "It's a desk.", "ok": true, "re": "對！直接說它是什麼。"}, {"t": "They're desks.", "ok": false, "re": "that 是單數，用 It's。"}]}, {"say": "A: What's your animal sign? B: ___", "ch": [{"t": "I'm a rabbit.", "ok": true, "re": "對！生肖用 I'm a＋動物。"}, {"t": "I'm twelve.", "ok": false, "re": "那是在回答年紀（How old）。"}]}]}, {"id": "plural2", "name": "複數規則＋字尾發音", "icon": "🔢", "c": ["PL-REG", "PL-IRR"], "intro": "課本 p.28 把複數分成三件事：<b>怎麼拼</b>、<b>字尾怎麼唸</b>、<b>哪些是特殊的</b>。", "table": [["規則", "怎麼變", "例子"], ["一般", "加 -s", "book→books、cat→cats、chair→chairs"], ["字尾 s／x／sh／ch", "加 -es", "bus→buses、fox→foxes、brush→brushes、watch→watches"], ["子音＋y", "去 y 加 -ies", "family→families"], ["母音＋y", "直接加 -s", "monkey→monkeys、key→keys"], ["字尾 f／fe", "去 f(e) 加 -ves", "wife→wives"], ["🔴 特殊", "整個字變", "child→children、man→men、woman→women、mouse→mice、ox→oxen、person→people"], ["🔴 單複數同形", "不變", "fish→fish、sheep→sheep、Chinese→Chinese"]], "flows": [{"title": "字尾 -s 怎麼唸（課本 p.28 ②）", "steps": [{"tokens": ["cats", "cups", "desks"], "hl": [0, 1, 2], "note": "字尾是<b>無聲</b>的 t、p、k → 唸 /s/"}, {"tokens": ["chairs", "pens", "wives"], "hl": [0, 1, 2], "note": "字尾是<b>有聲</b>的音 → 唸 /z/"}, {"tokens": ["boxes", "buses", "watches", "oranges"], "hl": [0, 1, 2, 3], "note": "字尾 s、x、sh、ch、ge → 唸 /ɪz/（多一個音節）"}]}, {"title": "單數句變複數句：整句一起改", "steps": [{"tokens": ["This", "is", "a", "fox", "."], "hl": [0, 1, 2, 3], "note": "單數句"}, {"tokens": ["These", "are", "foxes", "."], "hl": [0, 1, 2], "note": "this→these、is→are、a 拿掉、fox→foxes"}, {"tokens": ["That", "is", "a", "mouse", "."], "hl": [0, 1, 3], "note": "再一句"}, {"tokens": ["Those", "are", "mice", "."], "hl": [0, 1, 2], "note": "that→those、is→are、mouse→<b>mice</b>"}]}], "tutor": [{"say": "「Two ___ are on the farm.（ox）」", "ch": [{"t": "oxes", "ok": false, "re": "ox 是特殊複數。"}, {"t": "oxen", "ok": true, "re": "對！ox→oxen，跟 children 一樣加 -en。"}]}, {"say": "「Five ___ are on the hill.（sheep）」", "ch": [{"t": "sheeps", "ok": false, "re": "sheep 單複數同形，不加 s。"}, {"t": "sheep", "ok": true, "re": "對！sheep、fish 都是單複數同形。"}]}, {"say": "monkey 的複數是？", "ch": [{"t": "monkies", "ok": false, "re": "y 前面是母音 e，直接加 s。只有子音＋y 才改 ies。"}, {"t": "monkeys", "ok": true, "re": "對！key→keys 也是同樣的道理。"}]}]}, {"id": "poss2", "name": "複數名詞的所有格", "icon": "👜", "c": ["POSS"], "intro": "一個人的東西加 <b>'s</b>；很多人的東西，名詞已經有 s，<b>只加 '</b>。", "table": [["", "寫法", "例子"], ["單數名詞", "加 's", "the girl's desk（一個女孩的書桌）"], ["複數名詞（字尾有 s）", "只加 '", "the girls' desks（很多女孩的書桌）"], ["特殊複數（字尾沒有 s）", "加 's", "the children's toys、the men's books"], ["代名詞", "整個字換", "they → their（Their ears are big.）"]], "flows": [{"title": "girl's 和 girls'（課本 p.30）", "steps": [{"tokens": ["That", "is", "the", "girl's", "desk", "."], "hl": [3], "note": "一個女孩 → girl's"}, {"tokens": ["Those", "are", "the", "girls'", "desks", "."], "hl": [3], "note": "兩個女孩 → girls'（s 後面只加 '）"}]}, {"title": "課文裡的複數所有格", "steps": [{"tokens": ["Asian", "elephants'", "lifespans"], "hl": [1], "note": "elephants 已經是複數 → elephants'"}, {"tokens": ["their", "ears", "are", "big"], "hl": [0], "note": "代名詞的所有格：they → <b>their</b>"}]}], "tutor": [{"say": "「Those are the ___ robots.」（兩個男孩的機器人）", "ch": [{"t": "boy's", "ok": false, "re": "boy's 是一個男孩的。"}, {"t": "boys'", "ok": true, "re": "對！複數 boys 後面只加 '。"}, {"t": "boys", "ok": false, "re": "少了所有格的 '。"}]}, {"say": "「African elephants are big, and ___ ears are big, too.」", "ch": [{"t": "they", "ok": false, "re": "後面接名詞 ears，要用所有格。"}, {"t": "their", "ok": true, "re": "對！牠們的耳朵＝their ears。"}, {"t": "they're", "ok": false, "re": "they're＝they are。"}]}]}, {"id": "or", "name": "A or B 選擇問句", "icon": "⚖", "c": ["CONJ", "BE-ANS"], "intro": "問句裡有 <b>or</b>，就是要你<b>選一個</b>，不能用 Yes／No 回答。", "table": [["問句", "回答"], ["Are they Asian elephants or African elephants?", "They are African elephants."], ["Is it a goat or a sheep?", "It's a goat."]], "flows": [{"title": "or 問句怎麼回答", "steps": [{"tokens": ["Is", "it", "a", "goat", "or", "a", "sheep", "?"], "hl": [4], "note": "看到 or → 二選一"}, {"tokens": ["Yes", ",", "it", "is u（你們）。", "L": "L2", "tsec": "judge"}, {"id": "L2:tj4", "t": "fill", "set": "teacher", "c": ["POSS"], "q": "【填所有格】Mary is the ___ (girl) mother, and I'm their teacher.", "a": ["girls'"], "x": "後面說 their → 女孩不只一個 → girls'。", "L": "L2", "tsec": "judge"}, {"id": "L2:tj5", "t": "fill", "set": "teacher", "c": ["POSS", "PL-IRR"], "q": "【填所有格】A: Are you those ___ (man) friend? B: Yes, I am.", "a": ["men's"], "x": "those → 複數 men；men 字尾沒有 s → 加 's。", "L": "L2", "tsec": "judge"}, {"id": "L2:tj6", "t": "fill", "set": "teacher", "c": ["POSS"], "q": "【填所有格，兩格用空格隔開】A: Is your brother at ___ (Jones) home? B: No, he's at ___ (Mike) home.", "a": ["Jones's Mike's", "Jones' Mike's"], "x": "人名字尾是 s，加 's 或只加 ' 都可以（Jones's／Jones'）；Mike → Mike's。", "L": "L2", "tsec": "judge"}, {"id": "L2:tj7", "t": "fill", "set": "teacher", "c": ["PL-REG", "BE-AGR"], "q": "【填正確字詞，兩格】These ___ (orange) ___ yummy.", "a": ["oranges are"], "x": "these → 複數 oranges，be 動詞用 are。", "L": "L2", "tsec": "judge"}, {"id": "L2:tj8", "t": "fill", "set": "teacher", "c": ["BE-AGR", "PL-REG"], "q": "【填正確字詞，兩格】My dad's new car ___ big. We have two ___ (car) at home.", "a": ["is cars"], "x": "car（一輛）→ is；two → cars。", "L": "L2", "tsec": "judge"}, {"id": "L2:tj9", "t": "fill", "set": "teacher", "c": ["PL-IRR", "PRON"], "q": "【填正確字詞，兩格】Those ___ (child) are in the park. ___ are happy.", "a": ["children They"], "x": "child → children；代名詞用 They。", "L": "L2", "tsec": "judge"}, {"id": "L2:tj10", "t": "fill", "set": "teacher", "c": ["PL-IRR"], "q": "【填正確字詞】I have three pet ___ (fish).", "a": ["fish"], "x": "fish 單複數同形。", "L": "L2", "tsec": "judge"}, {"id": "L2:tg1", "t": "mc", "set": "teacher", "c": ["DEM", "WH"], "q": "A: What ___ that? B: ___ is a monkey.", "o": ["is; It", "are; That", "is; They", "are; This"], "a": 0, "x": "that 單數 → is；回答用 It。", "L": "L2", "tsec": "grammar"}, {"id": "L2:tg2", "t": "mc", "set": "teacher", "c": ["BE-ANS", "PRON"], "q": "A: Is the bear strong? B: No, ___ not.", "o": ["I'm", "they're", "we're", "it "woman → ___", "a": ["women"], "x": "woman → women。", "L": "L2", "tsec": "wk-plural"}, {"id": "L2:wc1", "t": "mc", "set": "workbook", "c": ["DEM", "BE-ANS"], "q": "A: What's that? B: ___", "o": ["It's a picture.", "They are pictures.", "No, it's not a picture.", "Yes, it's a picture."], "a": 0, "x": "What 問句不能用 Yes／No 回答；that（一個）→ It's…", "L": "L2", "tsec": "wk-choose"}, {"id": "L2:wc2", "t": "mc", "set": "workbook", "c": ["DEM", "WH"], "q": "A: These rabbits are cute. B: ___ A: They are scary (令人害怕的).", "o": ["Yes, they are rabbits.", "Are they lions?", "What are they?", "What about those lions?"], "a": 3, "x": "A 回答「牠們很可怕」→ B 問的是別的動物：What about those lions?（那些獅子呢？）", "L": "L2", "tsec": "wk-choose"}, {"id": "L2:wc3", "t": "mc", "set": "workbook", "c": ["BE-ANS"], "q": "A: Are they dolls? B: No, ___. They are robots.", "o": ["they are", "these are dolls", "they are not", "you are right"], "a": 2, "x": "No 後面接否定簡答 → they are not。", "L": "L2", "tsec": "wk-choose"}, {"id": "L2:wl1", "t": "fill", "set": "workbook", "c": ["DEM", "PL-REG"], "q": "（圖：三隻大象）A: What are those? B: ___ are ___.（兩格用空格隔開）", "a": ["They elephants"], "x": "those 的回答用 They；三隻 → elephants。", "L": "L2", "tsec": "wk-look"}, {"id": "L2:wl2", "t": "fill", "set": "workbook", "c": ["BE-ANS", "POSS"], "q": "（圖：男孩牽著三隻狗）A: Are these your pet dogs? B: Yes, ___ ___. ___ ___ pet dogs.（四格用空格隔開）", "a": ["they are They're my", "they are They are my"], "x": "these → they；肯定簡答不縮寫 they are；後面 They're my pet dogs.（第二句兩格：They're＋my）", "L": "L2", "tsec": "wk-look"}, {"id": "L2:wl3", "t": "fill", "set": "workbook", "c": ["BE-ANS", "PL-REG"], "q": "（圖：四匹馬）A: Are those zebras? B: No, they ___. They are ___.（兩格用空格隔開）", "a": ["aren't horses", "are not horses"], "x": "不是斑馬 → aren't；是馬 → horses。", "L": "L2", "tsec": "wk-look"}, {"id": "L2:wl4", "t": "fill", "set": "workbook", "c": ["BE-Q", "BE-ANS"], "q": "（圖：箱子裡三個戴黃帽子的娃娃）A: ___ they robots? B: No, ___ not.（兩格用空格隔開）", "a": ["Are they're", "Are they are"], "x": "they → Are；No, they're not.（they are not 也可以）", "L": "L2", "tsec": "wk-look"}, {"id": "L2:wq1", "t": "mc", "set": "workbook", "c": ["CONJ", "V-ZH"], "q": "（對話：Ken: Look! These dogs are scary. John: No. They are __1__. They are my pets. Ken: __2__ those animals? Are they pigs? John: That's right. __3__ my pet pigs. They are cute, too.） 第 1 格：", "o": ["cute", "old", "tall", "different"], "a": 0, "x": "Ken 說可怕，John 說 No → 相反的意思：cute 可愛。", "L": "L2", "tsec": "wk-cloze"}, {"id": "L2:wq2", "t": "mc", "set": "workbook", "c": ["WH"], "q": "（對話：Ken: Look! These dogs are scary. John: No. They are __1__. They are my pets. Ken: __2__ those animals? Are they pigs? John: That's right. __3__ my pet pigs. They are cute, too.） 第 2 格：", "o": ["Where are", "What about", "Are they", "Is this"], "a": 1, "x": "換問另一群動物 → What about those animals?（那些動物呢？）", "L": "L2", "tsec": "wk-cloze"}, {"id": "L2:wq3", "t": "mc", "set": "workbook", "c": ["DEM", "BE-AGR"], "q": "（對話：Ken: Look! These dogs are scary. John: No. They are __1__. They are my pets. Ken: __2__ those animals? Are they pigs? John: That's right. __3__ my pet pigs. They are cute, too.） 第 3 格：", "o": ["It is", "They are", "You are", "That is"], "a": 1, "x": "pigs 複數 → They are。", "L": "L2", "tsec": "wk-cloze"}, {"id": "L2:wv1", "t": "order", "set": "workbook", "c": ["DEM", "A-AN"], "zh": "What is that under the tree?（用 fox 回答）", "en": "It's a fox.", "alt": ["It is a fox."], "x": "that 的回答用 It；一隻 → a fox。", "L": "L2", "tsec": "wk-write"}, {"id": "L2:wv2", "t": "order", "set": "workbook", "c": ["WH", "DEM"], "zh": "依畫線部分造原問句：They're <u>my grandma's pigs</u>.", "en": "What are they?", "alt": ["What are those?", "What are these?"], "x": "畫線的是「東西」→ 用 What 問；They're → are they。", "L": "L2", "tsec": "wk-write"}, {"id": "L2:wv3", "t": "order", "set": "workbook", "c": ["DEM", "PL-IRR", "BE-AGR"], "zh": "改為複數句：That child is happy.", "en": "Those children are happy.", "alt": [], "x": "that → those、child → children、is → are。", "L": "L2", "tsec": "wk-write"}, {"id": "L2:wv4", "t": "order", "set": "workbook", "c": ["DEM", "PL-REG"], "zh": "What are these?（用 toy car 回答）", "en": "They're toy cars.", "alt": ["They are toy cars."], "x": "these 的回答用 They；car → cars。", "L": "L2", "tsec": "wk-write"}], "reading": [{"id": "L2:r1", "title": "閱讀（一）Lions VS. Tigers", "tree": "", "p": "Are they lions or tigers? Lions are different from tigers. A lion is yellow and brown, but a tiger is orange and black. Lions are from Africa, and tigers are from Asia. A male lion is about 1.2 meters tall, but a tiger is only about 1 meter tall. Lions' lifespans are about 12 years, and tigers' lifespans are about 15 years.<div class='gloss'>yellow 黃色的　brown 棕色的　orange 橘色的　Africa 非洲　Asia 亞洲　male 公的</div>", "qs": [{"id": "L2:r1a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What is the reading mainly about?", "o": ["Where lions are from.", "How lions and tigers are different.", "How old tigers are.", "What color lions are."], "a": 1, "x": "整篇都在比較獅子和老虎的不同（顏色、產地、身高、壽命）。看第二句 different from 就知道主題。", "L": "L2"}, {"id": "L2:r1b", "t": "mc", "set": "read", "c": ["POSS"], "q": "Which is true?", "o": ["Tigers are from Africa.", "A lion is orange and black.", "Tigers' lifespans are about 15 years.", "Lions and tigers are the same."], "a": 2, "x": "tigers' lifespans are about 15 years。", "L": "L2"}, {"id": "L2:r1c", "t": "mc", "set": "read", "c": ["PL-REG"], "q": "A male lion is about ___ tall.", "o": ["1 meter", "1.2 meters", "12 meters", "15 meters"], "a": 1, "x": "about 1.2 meters tall。", "L": "L2"}]}, {"id": "L2:r2", "title": "閱讀（二）Animal Riddles", "tree": "", "p": "<b>Riddle 1</b>　I am big and gray. My nose is very long, and my ears are big.<br><b>Riddle 2</b>　I am black and white, but I am not a bear. I am like a horse.<br><b>Riddle 3</b>　I am small and cute. My ears are long. I am the fourth Chinese zodiac animal sign.<br><b>Riddle 4</b>　I am long. I have no legs.<br><b>Riddle 5</b>　I am big, yellow, and brown. I am the king of animals.<div class='gloss'>riddle 謎語　gray 灰色的　nose 鼻子　like 像　fourth 第四　have no legs 沒有腳　king 國王</div>", "qs": [{"id": "L2:r2a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 1 is ___.", "o": ["a zebra", "an elephant", "a pig", "a mouse"], "a": 1, "x": "很大、灰色、長鼻子、大耳朵 → 大象。", "L": "L2"}, {"id": "L2:r2b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 2 is ___.", "o": ["a zebra", "a bear", "a horse", "a goat"], "a": 0, "x": "黑白色、像馬、不是熊 → 斑馬。", "L": "L2"}, {"id": "L2:r2c", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 3 is ___.", "o": ["a rat", "an ox", "a tiger", "a rabbit"], "a": 3, "x": "鼠牛虎兔，第四個是兔。", "L": "L2"}, {"id": "L2:r2d", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 4 is ___.", "o": ["a dragon", "a snake", "a monkey", "a dog"], "a": 1, "x": "很長、沒有腳 → 蛇。", "L": "L2"}, {"id": "L2:r2e", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Riddle 5 is ___.", "o": ["a lion", "a fox", "a tiger", "a rooster"], "a": 0, "x": "萬獸之王 → 獅子。", "L": "L2"}]}, {"id": "L2:r3", "title": "閱讀（三）生肖表", "tree": "", "p": "<table class='info'><tr><th>Name</th><th>Birth year</th><th>Animal sign</th></tr><tr><td>Kevin</td><td>2012</td><td>dragon</td></tr><tr><td>Amy</td><td>2013</td><td>snake</td></tr><tr><td>Leo</td><td>2011</td><td>rabbit</td></tr><tr><td>Grace</td><td>2000</td><td>dragon</td></tr></table>", "qs": [{"id": "L2:r3a", "t": "mc", "set": "read", "c": ["WH"], "q": "Who is a snake?", "o": ["Kevin.", "Amy.", "Leo.", "Grace."], "a": 1, "x": "Amy 2013 → snake。", "L": "L2"}, {"id": "L2:r3b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Which is true?", "o": ["Kevin and Grace are the same animal sign.", "Leo is a dragon.", "Amy is a rabbit.", "Grace is a snake."], "a": 0, "x": "Kevin 和 Grace 都屬龍。", "L": "L2"}]}], "teacher": [{"id": "best", "title": "佳句（中翻英）", "page": "講義 p.1", "ids": ["L2:tb1", "L2:tb2", "L2:tb3", "L2:tb4", "L2:tb5", "L2:tb6"]}, {"id": "phrase", "title": "片語", "page": "講義 p.2", "ids": ["L2:tp1", "L2:tp2", "L2:tp3", "L2:tp4", "L2:tp5", "L2:tp6", "L2:tp7", "L2:tp8" our parents tall?", "zh": "你的爸媽高嗎？", "hl": false, "note": ""}, {"sp": "A", "en": "Yes, they're tall. / No, they're not tall.", "zh": "是，他們很高。／不，他們不高。", "hl": true, "note": "詳答可以縮寫：they're tall（簡答 Yes, they are. 才不能縮）。"}, {"sp": "Q", "en": "Who is he?", "zh": "他是誰？", "hl": false, "note": ""}, {"sp": "A", "en": "He is my cousin. / He is Matt.", "zh": "他是我的堂哥。／他是 Matt。", "hl": false, "note": "Who 問關係或名字。"}, {"sp": "Q", "en": "How old are you?", "zh": "你幾歲？", "hl": false, "note": ""}, {"sp": "A", "en": "I'm fifteen years old.", "zh": "我十五歲。", "hl": false, "note": ""}]}, {"id": "rb", "title": "B. Read and Circle（圈出正確答案）", "src": "課本 p.37", "lines": [{"sp": "Sam", "en": "Hi, Lucy. How are you?", "zh": "嗨，Lucy。妳好嗎？", "hl": true, "note": "選 How（不是 How old）：問近況用 How are you?"}, {"sp": "Lucy", "en": "I am great, thanks. And you?", "zh": "我很好，謝謝。你呢？", "hl": true, "note": "主詞 I → am。"}, {"sp": "Sam", "en": "I'm fine. Thank you.", "zh": "我很好，謝謝。", "hl": false, "note": ""}, {"sp": "Lucy", "en": "Who is that man?", "zh": "那個男人是誰？", "hl": true, "note": "選 Who is（不是 Is）：後面回答的是名字。"}, {"sp": "Sam", "en": "He's Johnny. He is an actor.", "zh": "他是 Johnny，他是演員。", "hl": false, "note": ""}, {"sp": "Lucy", "en": "How old is he?", "zh": "他幾歲？", "hl": true, "note": "選 How old：後面回答年紀。"}, {"sp": "Sam", "en": "He is fifteen years old.", "zh": "他十五歲。", "hl": false, "note": ""}, {"sp": "Lucy", "en": "He is young.", "zh": "他很年輕。", "hl": false, "note": ""}]}, {"id": "rc", "title": "C. Activity（介紹他人）", "src": "課本 p.38", "lines": [{"sp": "", "en": "Mike is my grandfather.", "zh": "Mike 是我的爺爺。", "hl": false, "note": "Name：名字＋關係"}, {"sp": "", "en": "He is 600 years old.", "zh": "他 600 歲。", "hl": false, "note": "Age：年紀"}, {"sp": "", "en": "He is tall and strong.", "zh": "他又高又壯。", "hl": false, "note": "Appearance：外表"}, {"sp": "", "en": "He is my hero.", "zh": "他是我的英雄。", "hl": false, "note": ""}]}, {"id": "rd", "title": "Activities（動物與食物・食物鏈）", "src": "課本 p.39–40（選讀）", "lines": [{"sp": "", "en": "Horses, s
