ss 702.", "Nice to meet you, too.", "He's a great teacher."], "a": 1, "x": "同一班 → 說出班級。", "L": "R1", "tsec": "wk-mixed"}, {"id": "R1:wm10", "t": "mc", "set": "workbook", "c": ["BE-Q"], "q": "A: ___ B: Yes, I am. Nick is my student.", "o": ["Are you a teacher?", "Are you Nick's son?", "Is Nick your student?", "Who is Nick?"], "a": 0, "x": "回答 Yes, I am → 問句主詞是 you；Nick 是我的學生 → 我是老師。", "L": "R1", "tsec": "wk-mixed"}], "reading": [{"id": "R1:r1", "title": "閱讀（一）介紹他人", "tree": "", "p": "<table class='info'><tr><th></th><th>Grace</th><th>Tom</th></tr><tr><td>Name</td><td>Grace is my aunt.</td><td>Tom is my brother.</td></tr><tr><td>Age</td><td>35 years old</td><td>17 years old</td></tr><tr><td>Appearance</td><td>short and beautiful</td><td>tall and strong</td></tr></table>", "qs": [{"id": "R1:r1a", "t": "mc", "set": "read", "c": ["WH"], "q": "How old is the writer's brother?", "o": ["13.", "17.", "35.", "70."], "a": 1, "x": "Tom is my brother → 17。", "L": "R1"}, {"id": "R1:r1b", "t": "mc", "set": "read", "c": ["BE-AGR"], "q": "Which is true?", "o": ["Grace is tall and strong.", "Tom is short.", "Grace is beautiful.", "Tom is the writer's uncle."], "a": 2, "x": "Grace: short and beautiful。", "L": "R1"}, {"id": "R1:r1c", "t": "mc", "set": "read", "c": ["FAM-WORD"], "q": "Grace is the writer's mother's sister. So she is the writer's ___.", "o": ["aunt", "sister", "cousin", "grandmother"], "a": 0, "x": "媽媽的姊妹 → aunt。", "L": "R1"}]}, {"id": "R1:r2", "title": "閱讀（二）食物鏈", "tree": "", "p": "Look at this food chain: grass → rabbit → fox → eagle. Rabbits eat grass. They are plant eaters. Foxes eat rabbits, and eagles eat foxes. Foxes and eagles are meat eaters. Humans eat plants and meat. They are plant and meat eaters.<div class='gloss'>grass 草　eagle 老鷹</div>", "qs": [{"id": "R1:r2a", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "What do foxes eat in this food chain?（do 是助動詞，七下才學）", "o": ["Grass.", "Rabbits.", "Eagles.", "Humans."], "a": 1, "x": "Foxes eat rabbits。", "L": "R1"}, {"id": "R1:r2b", "t": "mc", "set": "read", "c": ["PL-REG"], "q": "Which is a plant eater?", "o": ["The rabbit.", "The fox.", "The eagle.", "The leopard."], "a": 0, "x": "Rabbits eat grass → plant eaters。", "L": "R1"}, {"id": "R1:r2c", "t": "mc", "set": "read", "c": ["BE-AGR"], "q": "Which is true?", "o": ["Eagles are plant eaters.", "Humans are plant and meat eaters.", "Rabbits eat foxes.", "Foxes eat grass."], "a": 1, "x": "最後一句。", "L": "R1"}]}], "teacher": [], "workbook": [{"id": "wk-vocab", "title": "I Read and Choose 字彙測驗", "page": "習作 Review 1", "ids": ["R1:wv1", "R1:wv2", "R1:wv3", "R1:wv4", "R1:wv5"]}, {"id": "wk-mixed", "title": "II Read and Choose 綜合測驗", "page": "習作 Review 1", "ids": ["R1:wm1", "R1:wm2", "R1:wm3", "R1:wm4", "R1:wm5", "R1:wm6", "R1:wm7", "R1:wm8", "R1:wm9", "R1:wm10"]}], "secNotes": {"介紹他人": "介紹一個人要說三件事：<b>Name</b>（名字／關係）、<b>Age</b>（年紀）、<b>Appearance</b>（外表）。句型都是 He／She is…，例如 He is 600 years old. He is tall and strong.", "動物與食物": "選讀單元。<b>eat</b> 吃：複數主詞直接用 eat（Rabbits eat plants.）。plant eater 草食者、meat eater 肉食者；複數都加 s。"}, "tiles": [["🔁", "句型總整理", "簡答 vs 詳答・Who／How old／How", "grammar"], ["📖", "課文", "Read and Say・介紹他人・食物鏈", "text"], ["🔤", "單字卡", "介紹他人・動物與食物", "words"], ["📒", "習作（附答案）", "習作 Review 1：看答案或直接作答", "workbook"], ["📄", "講義型練習", "L1＋L2＋R1 混合", "handout"], ["👂", "聽力", "L1＋L2 範圍的問答與對話", "listen"], ["✅", "總複習小考", "L1＋L2＋R1 混合 16 題", "quiz"]]}, {"hlNote": "粉紅底線＝本站先挑的重點句（這一課的老師講義還沒拍到，拍到後會換成老師畫的句子）。", "id": "L3", "short": "Lesson 3", "title": "Lesson 3　Let's Get Some Ideas from RoomGPT", "sub": "課本 p.41–54｜房間・位置介系詞・Where 問位置・祈使句・Let's", "scope": ["L3"], "words": [{"sec": "房子與房間", "w": "living room", "pos": "n.", "zh": "客廳", "ex": "The living room is big, but the bedroom is small.", "exz": "客廳很大，但臥室很小。", "pl": "living rooms", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 2, "no": 1}, {"sec": "房子與房間", "w": "bedroom", "pos": "n.", "zh": "臥室", "ex": "Adam: Where is Bob? Mary: He's in his bedroom.", "exz": "Adam：Bob 在哪裡？Mary：他在他的臥室。", "pl": "bedrooms", "plr": "s", "der": [], "note": "bed＋room 合成一個字，中間沒有空格", "tex": "", "posq": true, "cap": 5, "no": 2}, {"sec": "房子與房間", "w": "bathroom", "pos": "n.", "zh": "浴室", "ex": "The bathroom is next to the dining room.", "exz": "浴室在飯廳旁邊。", "pl": "bathrooms", "plr": "s", "der": [], "note": "bath＋room 一個字；th 唸 /θ/", "tex": "", "posq": true, "cap": 0, "no": 3}, {"sec": "房子與房間", "w": "dining room", "pos": "n.", "zh": "飯廳", "ex": "Donna: Where is Jay? Clark: He is in the dining room.", "exz": "Donna：Jay 在哪裡？Clark：他在飯廳。", "pl": "dining rooms", "plr": "s", "der": ["dine v. 用餐", "dine out 外食"], "note": "", "tex": "", "posq": true, "cap": 0, "no": 4}, {"sec": "房子與房間", "w": "kitchen", "pos": "n.", "zh": "廚房", "ex": "Your kitchen is big and beautiful.", "exz": "你的廚房又大又漂亮。", "pl": "kitchens", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 16, "no": 36}, {"sec": "房子與房間", "w": "house", "pos": "n.", "zh": "房子", "ex": "Our house is near a junior high school.", "exz": "我們的房子在一所國中附近。", "pl": "houses", "plr": "s", "der": ["home 家（有家人的溫暖）"], "note": "複數 houses 字尾唸 /zɪz/", "tex": "", "posq": true, "cap": 31, "no": 11}, {"sec": "位置介系詞", "w": "behind", "pos": "prep.", "zh": "在……後面", "ex": "Your dog is behind the door.", "exz": "你的狗在門後面。", "pl": "", "plr": "none", "der": [], "note": "i 唸 /aɪ/", "tex": "", "posq": true, "cap": 13, "no": 5}, {"sec": "位置介系詞", "w": "in front of", "pos": "prep.", "zh": "在……前面", "ex": "Look! The old man is in front of the house.", "exz": "看！那位老先生在房子前面。", "pl": "", "plr": "none", "der": [], "note": "三個字一組，of 不能少", "tex": "", "posq": true, "cap": 5, "no": 6}, {"sec": "位置介系詞", "w": "between", "pos": "prep.", "zh": "在……中間", "ex": "My bedroom is between the bathroom and the kitchen.", "exz": "我的臥室在浴室和廚房中間。", "pl": "", "plr": "none", "der": ["between A and B 在 A 和 B 之間"], "note": "後面一定要有兩樣東西", "tex": "", "posq": true, "cap": 19, "no": 7}, {"sec": "位置介系詞", "w": "next to", "pos": "prep.", "zh": "在……旁邊", "ex": "Your watch is next to my cup.", "exz": "你的手錶在我的杯子旁邊。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 9, "no": 8}, {"sec": "位置介系詞", "w": "near", "pos": "prep.", "zh": "在……附近", "ex": "George's house is near a movie theater.", "exz": "George 的房子在一家電影院附近。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 12, "no": 9}, {"sec": "位置介系詞", "w": "beside", "pos": "prep.", "zh": "在……旁邊", "ex": "The movie theater is beside the park.", "exz": "電影院在公園旁邊。", "pl": "", "plr": "none", "der": ["＝next to"], "note": "", "tex": "", "posq": true, "cap": 3, "no": 37}, {"sec": "位置介系詞", "w": "inside", "pos": "prep.", "zh": "在……裡面；在室內", "ex": "Silvia: What's inside the box? Calvin: It's my blanket.", "exz": "Silvia：盒子裡面是什麼？Calvin：是我的毛毯。", "pl": "", "plr": "none", "der": ["adv. 在室內：go inside 進去裡面"], "note": "", "tex": "", "posq": true, "cap": 18, "no": 39}, {"sec": "位置介系詞", "w": "around", "pos": "prep.", "zh": "圍繞；到處", "ex": "Mr. Green's students are from around the world.", "exz": "Green 老師的學生來自世界各地。", "pl": "", "plr": "none", "der": ["around the world 世界各地"], "note": "", "tex": "", "posq": true, "cap": 30, "no": 34}, {"sec": "RoomGPT 對話", "w": "please", "pos": "int.", "zh": "請", "ex": "Don't open the door, please.", "exz": "請不要開門。", "pl": "", "plr": "none", "der": ["放句首：Please…；放句尾前面加逗號：…, please."], "note": "", "tex": "", "posq": true, "cap": 18, "no": 10}, {"sec": "RoomGPT 對話", "w": "quiet", "pos": "adj.", "zh": "安靜的", "ex": "Please be quiet in the classroom.", "exz": "在教室裡請保持安靜。", "pl": "", "plr": "none", "der": [], "note": "別和 quite（相當地）搞混", "tex": "", "posq": true, "cap": 0, "no": 12}, {"sec": "RoomGPT 對話", "w": "style", "pos": "n.", "zh": "風格；款式", "ex": "The new style of your house is cool.", "exz": "你房子的新風格很酷。", "pl": "styles", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 0, "no": 13}, {"sec": "RoomGPT 對話", "w": "idea", "pos": "n.", "zh": "想法；點子", "ex": "Rudy: Let's go to the park now. Ryan: Good idea!", "exz": "Rudy：我們現在去公園吧。Ryan：好主意！", "pl": "ideas", "plr": "s", "der": [], "note": "母音開頭：an idea", "tex": "", "posq": true, "cap": 46, "no": 14}, {"sec": "RoomGPT 對話", "w": "let's", "pos": "", "zh": "我們一起……吧", "ex": "Let's wait for Angela in the park.", "exz": "我們在公園等 Angela 吧。", "pl": "", "plr": "none", "der": ["let's＝let us", "Let's＋原形動詞", "否定：Let's not＋原形動詞"], "note": "", "tex": "", "posq": false, "cap": 5, "no": 15}, {"sec": "RoomGPT 對話", "w": "get", "pos": "v.", "zh": "獲得", "ex": "Let's get some ideas from our parents.", "exz": "我們向爸媽要一些點子吧。", "pl": "", "plr": "none", "der": ["get…from… 從……得到……"], "note": "", "tex": "", "posq": true, "cap": 95, "no": 16}, {"sec": "RoomGPT 對話", "w": "some", "pos": "adj.", "zh": "一些的；一些", "ex": "Some students are in front of the school.", "exz": "有一些學生在學校前面。", "pl": "", "plr": "none", "der": ["some＋可數複數（some ideas）", "some＋不可數（some juice）"], "note": "", "tex": "", "posq": true, "cap": 90, "no": 17}, {"sec": "RoomGPT 對話", "w": "tool", "pos": "n.", "zh": "工具", "ex": "Open the door with this tool.", "exz": "用這個工具開門。", "pl": "tools", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 2, "no": 18}, {"sec": "RoomGPT 對話", "w": "smartphone", "pos": "n.", "zh": "智慧型手機", "ex": "Stella: Is this your smartphone? Philip: Yes. Thank you.", "exz": "Stella：這是你的智慧型手機嗎？Philip：是的，謝謝。", "pl": "smartphones", "plr": "s", "der": ["smart 聰明的＋phone 電話"], "note": "", "tex": "", "posq": true, "cap": 0, "no": 19}, {"sec": "RoomGPT 對話", "w": "I see.", "pos": "", "zh": "我了解了。", "ex": "Lucy: That's Mr. Lin, Sam's teacher. Dave: Oh, I see.", "exz": "Lucy：那是林老師，Sam 的老師。Dave：喔，我知道了。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": false, "cap": 0, "no": 30}, {"sec": "RoomGPT 對話", "w": "step", "pos": "n.", "zh": "步驟；一步", "ex": "Kate: Step one, open the box. Mike: OK. What's next?", "exz": "Kate：第一步，打開盒子。Mike：好，下一步呢？", "pl": "steps", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 0, "no": 20}, {"sec": "RoomGPT 對話", "w": "upload", "pos": "v.", "zh": "上傳", "ex": "Please upload the photos here.", "exz": "請把照片上傳到這裡。", "pl": "", "plr": "none", "der": ["反義：download 下載（L4）"], "note": "", "tex": "", "posq": true, "cap": 0, "no": 21}, {"sec": "RoomGPT 對話", "w": "photo", "pos": "n.", "zh": "相片", "ex": "These are my grandma's old photos.", "exz": "這些是我奶奶的舊照片。", "pl": "photos", "plr": "s", "der": ["take a photo 拍照（L4）"], "note": "複數直接加 s", "tex": "", "posq": true, "cap": 11, "no": 22}, {"sec": "RoomGPT 對話", "w": "choose", "pos": "v.", "zh": "選擇", "ex": "Come here and choose your drink, Wendy.", "exz": "Wendy，過來選妳的飲料。", "pl": "", "plr": "none", "der": ["choice n. 選擇"], "note": "", "tex": "", "posq": true, "cap": 17, "no": 23}, {"sec": "RoomGPT 對話", "w": "type", "pos": "n.", "zh": "種類", "ex": "Annie: What type of juice is this? Benny: It's apple juice.", "exz": "Annie：這是哪一種果汁？Benny：是蘋果汁。", "pl": "types", "plr": "s", "der": ["一字多義：v. 打字"], "note": "", "tex": "", "posq": true, "cap": 2, "no": 24}, {"sec": "RoomGPT 對話", "w": "theme", "pos": "n.", "zh": "主題", "ex": "The book's theme is animals. Let's read it.", "exz": "這本書的主題是動物。我們來讀吧。", "pl": "themes", "plr": "s", "der": [], "note": "th 唸 /θ/", "tex": "", "posq": true, "cap": 0, "no": 25}, {"sec": "RoomGPT 對話", "w": "wait", "pos": "v.", "zh": "等待", "ex": "Please wait for me in the classroom.", "exz": "請在教室等我。", "pl": "", "plr": "none", "der": ["wait for… 等待……"], "note": "", "tex": "", "posq": true, "cap": 16, "no": 26}, {"sec": "RoomGPT 對話", "w": "expensive", "pos": "adj.", "zh": "昂貴的", "ex": "That cool car is very expensive.", "exz": "那輛很酷的車非常貴。", "pl": "", "plr": "none", "der": [], "note": "母音開頭：an expensive car", "tex": "", "posq": true, "cap": 6, "no": 27}, {"sec": "RoomGPT 對話", "w": "with", "pos": "prep.", "zh": "對……來說；和", "ex": "Chris: Is this room OK with you? Anna: Yes. It's beautiful.", "exz": "Chris：這個房間你覺得可以嗎？Anna：可以，它很漂亮。", "pl": "", "plr": "none", "der": ["be OK with… 對……來說可以", "反義：without 沒有"], "note": "", "tex": "", "posq": false, "cap": 161, "no": 28}, {"sec": "RoomGPT 對話", "w": "question", "pos": "n.", "zh": "問題", "ex": "Sara: Where is my bag? It's not here. Ian: Hmm... that's a good question.", "exz": "Sara：我的包包在哪裡？不在這裡。Ian：嗯……這是個好問題。", "pl": "questions", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 7, "no": 29}, {"sec": "閱讀 Beds", "w": "soft", "pos": "adj.", "zh": "柔軟的", "ex": "The bed is big and soft.", "exz": "這張床又大又軟。", "pl": "", "plr": "none", "der": ["反義：hard 硬的"], "note": "", "tex": "", "posq": true, "cap": 0, "no": 31}, {"sec": "閱讀 Beds", "w": "hard", "pos": "adj.", "zh": "硬的", "ex": "My grandpa's bed is hard.", "exz": "我爺爺的床很硬。", "pl": "", "plr": "none", "der": ["一字多義：困難的"], "note": "", "tex": "", "posq": true, "cap": 37, "no": 32}, {"sec": "閱讀 Beds", "w": "in fact", "pos": "", "zh": "事實上", "ex": "The woman isn't Leo's mother. In fact, she's his grandmother.", "exz": "那位女士不是 Leo 的媽媽。事實上，她是他的奶奶。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": false, "cap": 16, "no": 33}, {"sec": "閱讀 Beds", "w": "world", "pos": "n.", "zh": "世界", "ex": "The book is about different animals around the world.", "exz": "這本書是關於世界各地不同的動物。", "pl": "worlds", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 33, "no": 35}, {"sec": "閱讀 Beds", "w": "ice", "pos": "n.", "zh": "冰", "ex": "Dylan: In the picture, the girl's bed is a big ice bed. Julia: Cool!", "exz": "Dylan：照片裡，那個女孩的床是一張大冰床。Julia：好酷！", "pl": "", "plr": "unc", "der": [], "note": "不可數", "tex": "", "posq": true, "cap": 14, "no": 38}, {"sec": "閱讀 Beds", "w": "blanket", "pos": "n.", "zh": "毛毯", "ex": "It's cold. Where is my blanket?", "exz": "好冷。我的毛毯在哪裡？", "pl": "blankets", "plr": "s", "der": [], "note": "", "tex": "", "posq": true, "cap": 1, "no": 40}], "texts": [{"id": "d1", "title": "Dialogue 1（At Scott's home）", "src": "課本 p.43", "lines": [{"sp": "Scott", "en": "Welcome, Bella! Please come in.", "zh": "歡迎，Bella！請進。", "hl": false, "note": "Please＋原形動詞 come＝客氣的請求（祈使句）。"}, {"sp": "Bella", "en": "Thank you, Scott. Your house is nice and quiet.", "zh": "謝謝你，Scott。你家又好又安靜。", "hl": false, "note": ""}, {"sp": "Scott", "en": "Thanks, but it's not really my style.", "zh": "謝謝，但這不太是我的風格。", "hl": false, "note": "not really 不太是。"}, {"sp": "Bella", "en": "Oh, I see. Well, what about a makeover?", "zh": "喔，我懂了。那，來個大改造怎麼樣？", "hl": true, "note": "What about＋名詞？＝……怎麼樣？（提出建議）。makeover 改造。"}, {"sp": "Scott", "en": "Great idea! But how?", "zh": "好主意！但要怎麼做？", "hl": false, "note": ""}, {"sp": "Bella", "en": "Let's get some ideas from RoomGPT.", "zh": "我們從 RoomGPT 得到一些點子吧。", "hl": true, "note": "Let's＋原形動詞＝我們一起……吧。get…from… 從……得到。"}, {"sp": "Scott", "en": "RoomGPT? What's that?", "zh": "RoomGPT？那是什麼？", "hl": false, "note": ""}, {"sp": "Bella", "en": "It is an AI tool. Uh, where is my smartphone?", "zh": "它是一個 AI 工具。呃，我的手機在哪裡？", "hl": true, "note": "an AI：AI 唸 /e aɪ/，母音開頭用 an。Where is＋單數？問位置。"}, {"sp": "Scott", "en": "It's on the table.", "zh": "在桌上。", "hl": false, "note": "on 在……上面（接觸表面）。"}]}, {"id": "d2", "title": "Dialogue 2（RoomGPT 三步驟）", "src": "課本 p.44", "lines": [{"sp": "Bella", "en": "OK, look at this. Step one, upload a photo. Step two, choose a room type.", "zh": "好，看這個。第一步，上傳一張照片。第二步，選一個房間類型。", "hl": true, "note": "祈使句：look、upload、choose 都是原形動詞開頭。"}, {"sp": "Scott", "en": "Room type?", "zh": "房間類型？", "hl": false, "note": ""}, {"sp": "Bella", "en": "Yes. The living room, the bathroom, or the bedroom?", "zh": "對。客廳、浴室，還是臥室？", "hl": false, "note": ""}, {"sp": "Scott", "en": "The bedroom. What's next?", "zh": "臥室。下一步呢？", "hl": false, "note": ""}, {"sp": "Bella", "en": "Choose a room theme.", "zh": "選一個房間主題。", "hl": false, "note": ""}, {"sp": "Scott", "en": "Wow! These themes are really cool!", "zh": "哇！這些主題真的好酷！", "hl": false, "note": ""}, {"sp": "Bella", "en": "Wait. A big makeover is expensive. Are you OK with that?", "zh": "等等。大改造很貴喔。你可以接受嗎？", "hl": true, "note": "be OK with… 對……可以接受。"}, {"sp": "Scott", "en": "Ha! That's a good question.", "zh": "哈！這是個好問題。", "hl": false, "note": ""}]}, {"id": "rd", "title": "Reading〈Beds〉", "src": "課本 p.49", "lines": [{"sp": "", "en": "Is your bed big and soft, or is it small and hard?", "zh": "你的床又大又軟，還是又小又硬？", "hl": true, "note": "A or B 的選擇問句：要選一個回答，不能用 Yes／No。"}, {"sp": "", "en": "In fact, beds around the world are different. Let's meet two new friends and their beds.", "zh": "事實上，世界各地的床都不一樣。我們來認識兩位新朋友和他們的床吧。", "hl": false, "note": "around the world 世界各地。"}, {"sp": "Jenny", "en": "Jenny is an eleven-year-old girl. Her house is an igloo.", "zh": "Jenny 是一個十一歲的女孩。她的房子是一座冰屋。", "hl": false, "note": "an eleven-year-old girl：year 用單數、中間加連字號，當形容詞用。"}, {"sp": "", "en": "This is her bedroom, kitchen, living room, and dining room, too. Where is her bed? It is beside the kitchen.", "zh": "這裡是她的臥室，也是廚房、客廳和飯廳。她的床在哪裡？在廚房旁邊。", "hl": true, "note": "beside＝next to 在……旁邊。"}, {"sp": "", "en": "It is a big and hard ice bed.", "zh": "那是一張又大又硬的冰床。", "hl": false, "note": ""}, {"sp": "Jason", "en": "Jason is twenty-one years old. His house is inside a cave.", "zh": "Jason 二十一歲。他的房子在一個洞穴裡面。", "hl": false, "note": "inside 在……裡面。"}, {"sp": "", "en": "Where is his bed? It is next to the table. It is a small and old blanket.", "zh": "他的床在哪裡？在桌子旁邊。那是一條又小又舊的毛毯。", "hl": true, "note": ""}]}, {"id": "ru", "title": "Read Up〈The Perfect Home〉", "src": "課本 p.53（選讀）", "lines": [{"sp": "Mrs. Smith", "en": "Look at this. It's big and beautiful, and it's near Ken's school.", "zh": "看這個。它又大又漂亮，而且在 Ken 的學校附近。", "hl": false, "note": ""}, {"sp": "Mr. Smith", "en": "It's nice, but we need three bedrooms.", "zh": "很好，但我們需要三間臥室。", "hl": false, "note": ""}, {"sp": "Ken", "en": "Yeah, I don't want to share a room with Jessie.", "zh": "對啊，我不想和 Jessie 共用一個房間。", "hl": false, "note": ""}, {"sp": "Mrs. Smith", "en": "Great! Let's go and take a look.", "zh": "太好了！我們去看看吧。", "hl": false, "note": ""}, {"sp": "Kevin", "en": "Mr. and Mrs. Smith, this house is perfect for you. There are three bedrooms and two bathrooms.", "zh": "Smith 先生、Smith 太太，這間房子對你們來說很完美。有三間臥室和兩間浴室。", "hl": false, "note": ""}, {"sp": "Mrs. Smith", "en": "Great! What about the kitchen? Where is it?", "zh": "太好了！那廚房呢？在哪裡？", "hl": false, "note": ""}, {"sp": "Kevin", "en": "It's next to the living room.", "zh": "在客廳旁邊。", "hl": false, "note": ""}]}], "grammar": [{"id": "where", "name": "Where 問位置", "icon": "📍", "c": ["WHERE", "PREP"], "intro": "Where 問「在哪裡」。be 動詞跟著後面的主詞：單數 <b>Where is</b>，複數 <b>Where are</b>。回答用 It is／They are＋<b>介系詞＋地點</b>。", "table": [["問句", "回答"], ["Where is the book?（Where's…）", "It is on the chair.（It's…）"], ["Where are the books?", "They are under the desk.（They're…）"], ["Where is Tommy?", "He is behind the chair."]], "flows": [{"title": "單數：Where is…?", "steps": [{"tokens": ["Where", "is", "my", "smartphone", "?"], "hl": [0, 1], "note": "一支手機 → Where is"}, {"tokens": ["It's", "on", "the", "table", "."], "hl": [0, 1], "note": "回答把東西換成 It，再接介系詞＋地點"}]}, {"title": "複數：Where are…?", "steps": [{"tokens": ["Where", "are", "the", "cats", "?"], "hl": [0, 1], "note": "很多隻貓 → Where are"}, {"tokens": ["They", "are", "between", "the", "box", "and", "the", "bag", "."], "hl": [0, 2, 5], "note": "回答換成 They；between 要接兩樣東西：A and B"}]}, {"title": "🔴 縮寫", "steps": [{"tokens": ["Where's", "the", "book", "?"], "hl": [0], "note": "Where is → Where's 可以"}, {"tokens": ["Where", "are", "the", "books", "?"], "hl": [0, 1], "note": "Where are 不能縮寫成 Where're"}]}], "tutor": [{"say": "A: Where ___ my pens? B: They're in the box.", "ch": [{"t": "is", "ok": false, "re": "pens 是複數，用 are。"}, {"t": "are", "ok": true, "re": "對！複數用 Where are。"}, {"t": "am", "ok": false, "re": "am 只配 I。"}]}, {"say": "A: Where is Bella's smartphone? B: ___", "ch": [{"t": "Yes, it is.", "ok": false, "re": "Where 問句不能用 Yes／No。"}, {"t": "It's on the table.", "ok": true, "re": "對！說出位置。"}, {"t": "They're on the table.", "ok": false, "re": "一支手機是單數，用 It's。"}]}]}, {"id": "prep", "name": "位置介系詞", "icon": "📦", "c": ["PREP"], "intro": "介系詞放在地點<b>前面</b>，說明東西和地點的關係。課本 p.42 用貓和箱子畫出來：", "table": [["介系詞", "意思", "例句"], ["in", "在……裡面", "The cat is in the box."], ["on", "在……上面（碰到表面）", "My phone is on the table."], ["under", "在……下面", "The ball is under the chair."], ["behind", "在……後面", "Your dog is behind the door."], ["in front of", "在……前面", "The old man is in front of the house."], ["next to／beside", "在……旁邊", "Your watch is next to my cup."], ["near", "在……附近（比較遠一點）", "Our house is near a school."], ["between A and B", "在 A 和 B 中間", "My bedroom is between the bathroom and the kitchen."]], "flows": [{"title": "介系詞＋the＋地點", "steps": [{"tokens": ["Lucy", "is", "in", "the", "box", "."], "hl": [2], "note": "in 在裡面"}, {"tokens": ["Billy", "is", "between", "the", "box", "and", "the", "chair", "."], "hl": [2, 5], "note": "between…and… 兩樣東西中間"}, {"tokens": ["Milo", "is", "on", "the", "table", "."], "hl": [2], "note": "on 在上面"}]}, {"title": "🔴 in front of 和 behind", "steps": [{"tokens": ["The", "car", "is", "in", "front", "of", "the", "house", "."], "hl": [3, 4, 5], "note": "in front of 三個字一組"}, {"tokens": ["The", "tree", "is", "behind", "the", "house", "."], "hl": [3], "note": "相反方向：behind 在後面"}]}], "tutor": [{"say": "「我的臥室在浴室和廚房中間。」My bedroom is ___ the bathroom and the kitchen.", "ch": [{"t": "between", "ok": true, "re": "對！between A and B。"}, {"t": "next to", "ok": false, "re": "next to 只接一樣東西。"}, {"t": "in", "ok": false, "re": "in 是在裡面。"}]}, {"say": "「狗在門後面。」The dog is ___ the door.", "ch": [{"t": "in front of", "ok": false, "re": "in front of 是前面。"}, {"t": "behind", "ok": true, "re": "對！behind 後面。"}, {"t": "on", "ok": false, "re": "on 是在上面。"}]}]}, {"id": "imp", "name": "祈使句（Please／Don't）", "icon": "🙏", "c": ["IMP"], "intro": "叫別人做事、請求別人的句子叫<b>祈使句</b>：<b>省略主詞 you</b>，直接用<b>原形動詞</b>開頭。不要做 → 前面加 <b>Don't</b>。", "table": [["", "寫法", "例句"], ["肯定", "原形動詞…", "Be nice.／Wash the ball, please."], ["否定", "Don't＋原形動詞…", "Don't be sad.／Don't run in the house."], ["加 please（句首）", "Please＋原形動詞…", "Please look at me."], ["加 please（句尾）", "…, please.（前面加逗號）", "Open the box, please."], ["  desk is in front of the bed. My books are on the desk. My cat, Mimi, likes my room, too. Where is she now? She's under the bed! My brother's room is between my room and the bathroom. His room is big, but it's very noisy.<div class='gloss'>window 窗戶　likes 喜歡　noisy 吵鬧的</div>", "qs": [{"id": "L3:r1a", "t": "mc", "set": "read", "c": ["PREP"], "q": "Where is the desk?", "o": ["Next to the window.", "In front of the bed.", "Under the bed.", "In the bathroom."], "a": 1, "x": "my desk is in front of the bed。", "L": "L3"}, {"id": "L3:r1b", "t": "mc", "set": "read", "c": ["WHERE"], "q": "Where is Mimi now?", "o": ["On the desk.", "Next to the window.", "Under the bed.", "In the bathroom."], "a": 2, "x": "She's under the bed!", "L": "L3"}, {"id": "L3:r1c", "t": "mc", "set": "read", "c": ["PREP", "V-ZH"], "q": "Which is true?", "o": ["The writer's room is big and noisy.", "The brother's room is next to the bathroom.", "The books are under the desk.", "Mimi is a dog."], "a": 1, "x": "哥哥（弟弟）的房間在我的房間和浴室中間 → 也就在浴室旁邊。", "L": "L3"}]}, {"id": "L3:r2", "title": "閱讀（二）Library Rules", "tree": "", "p": "<b>Welcome to the City Library!</b><br>1. Please be quiet.<br>2. Don't eat or drink in the library.<br>3. Don't run. Walk, please.<br>4. Please don't talk on your phone.<br>5. Put the books back on the shelves, please.<br><i>Thank you! Let's make the library a nice place for everyone.</i><div class='gloss'>library 圖書館　put…back 放回　shelf 書架（複數 shelves）　place 地方　everyone 每個人</div>", "qs": [{"id": "L3:r2a", "t": "mc", "set": "read", "c": ["IMP"], "q": "What can you do in the library?", "o": ["Eat a sandwich.", "Talk on the phone.", "Walk.", "Run."], "a": 2, "x": "Don't run. Walk, please.", "L": "L3"}, {"id": "L3:r2b", "t": "mc", "set": "read", "c": ["IMP"], "q": "Which is NOT a library rule?", "o": ["Be quiet.", "Don't drink.", "Put the books back.", "Take a photo of your friends."], "a": 3, "x": "拍照不在規則裡。", "L": "L3"}, {"id": "L3:r2c", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Where can book is special. My daughter can read it again and again.", "exz": "這本繪本很特別。我女兒可以一讀再讀。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 20, "no": 33}, {"sec": "閱讀 Smart Designs", "w": "lane", "pos": "n.", "zh": "小路；小巷", "ex": "The lane is beautiful and quiet.", "exz": "這條小巷又美又安靜。", "pl": "lanes", "plr": "s", "der": ["phone lane 手機專用道"], "note": "", "tex": "", "posq": true, "cap": 0, "no": 34}, {"sec": "閱讀 Smart Designs", "w": "way", "pos": "n.", "zh": "方式；方法；路", "ex": "This is not the right way to download the app.", "exz": "這不是下載這個 app 的正確方法。", "pl": "ways", "plr": "s", "der": ["in the way 擋路"], "note": "", "tex": "", "posq": true, "cap": 77, "no": 35}, {"sec": "閱讀 Smart Designs", "w": "other", "pos": "adj.", "zh": "其他的", "ex": "Maybe you can get other ideas from the movie.", "exz": "也許你可以從電影得到其他點子。", "pl": "", "plr": "none", "der": [], "note": "", "tex": "", "posq": true, "cap": 61, "no": 36}, {"sec": "功能字", "w": "can", "pos": "aux.", "zh": "能；會；可以", "ex": "He can cook.", "exz": "他會煮飯。", "pl": "", "plr": "none", "der": ["否定 can't＝cannot", "can＋原形動詞"], "note": "", "tex": "", "posq": false, "cap": 162}], "texts": [{"id": "d1", "title": "Dialogue 1（On the sidewalk）", "src": "課本 p.57", "lines": [{"sp": "Ha-Joon", "en": "BLACKPINK is great! I can listen to their songs again and again!", "zh": "BLACKPINK 好棒！我可以一直重複聽她們的歌！", "hl": true, "note": "can＋原形動詞 listen；listen to＋東西；again and again 一再地。"}, {"sp": "Ann", "en": "Same here. Hey! Check out their Instagram. We can watch their live stream.", "zh": "我也是。嘿！去看她們的 Instagram。我們可以看她們的直播。", "hl": false, "note": "Same here. 我也是。Check out… 是祈使句。"}, {"sp": "Rita", "en": "Cool! I can't wait!", "zh": "酷！我等不及了！", "hl": true, "note": "I can't wait! 我等不及了！（can't＝cannot）"}, {"sp": "Ann", "en": "Come on, let's cross the road.", "zh": "快點，我們過馬路吧。", "hl": false, "note": "Let's＋原形動詞（L3）。"}, {"sp": "Rita", "en": "Ha-Joon, watch out! Are you OK?", "zh": "Ha-Joon，小心！你還好嗎？", "hl": true, "note": "watch out 小心（祈使句）。"}, {"sp": "Ha-Joon", "en": "I'm fine, thanks. Sorry, I'm a real phubber.", "zh": "我沒事，謝謝。抱歉，我真是個低頭族。", "hl": false, "note": "phubber 低頭族＝phone＋snubber（冷落他人者）。"}]}, {"id": "d2", "title": "Dialogue 2（Smart traffic lights）", "src": "課本 p.58", "lines": [{"sp": "Rita", "en": "Ha-Joon, don't look down at your phone all the time.", "zh": "Ha-Joon，不要一直低頭看手機。", "hl": true, "note": "否定祈使句 Don't＋原形動詞；all the time 一直。"}, {"sp": "Ha-Joon", "en": "You're right. Guess what? In South Korea, some traffic lights are on the ground now.", "zh": "妳說得對。你猜怎麼著？在南韓，現在有些紅綠燈在地上。", "hl": true, "note": "Guess what? 帶出新消息。"}, {"sp": "", "en": "See? \"How you like that?\"", "zh": "看到了嗎？「你喜歡這樣嗎？」", "hl": false, "note": "BLACKPINK 的歌名；正確說法是 How do you like that?"}, {"sp": "Ann & Rita", "en": "That's a great idea!", "zh": "那是個好點子！", "hl": false, "note": ""}]}, {"id": "rd", "title": "Reading〈Smart Designs〉", "src": "課本 p.61", "lines": [{"sp": "", "en": "A traffic light on the ground is not the only smart design for phubbers.", "zh": "地上的紅綠燈不是唯一給低頭族的聰明設計。", "hl": false, "note": ""}, {"sp": "", "en": "In South Korea, smartphone users can download an app on their phones.", "zh": "在南韓，手機使用者可以在手機上下載一個 app。", "hl": true, "note": "can＋原形動詞 download；an app：母音開頭用 an。"}, {"sp": "", "en": "It can warn them about the oncoming cars at crosswalks!", "zh": "它可以在斑馬線警告他們注意迎面而來的車！", "hl": true, "note": "warn A about B；them 是受格（指 users）。"}, {"sp": "", "en": "Also, in the USA, phubbers can walk in special phone lanes now.", "zh": "而且，在美國，低頭族現在可以走在特別的手機專用道上。", "hl": false, "note": "Also 放句首＝而且。"}, {"sp": "", "en": "That way, smartphone users are only in the way of other phubbers. Smart, right?", "zh": "這樣一來，手機使用者只會擋到其他低頭族。很聰明，對吧？", "hl": true, "note": "That way 這樣一來；in the way of… 擋到……的路。"}, {"sp": "", "en": "Can you see smart designs like these in Taiwan, too?", "zh": "你在台灣也看得到像這樣的聰明設計嗎？", "hl": false, "note": "Can＋主詞＋原形動詞？like these 像這些。"}]}, {"id": "ru", "title": "Read Up〈Rules for the Aquarium〉", "src": "課本 p.65（選讀）", "lines": [{"sp": "", "en": "Students, please sit down and listen. There are some rules for the aquarium.", "zh": "同學們，請坐下聽好。水族館有一些規定。", "hl": false, "note": ""}, {"sp": "1", "en": "You can take photos, but you can't use flash.", "zh": "你們可以拍照，但不可以用閃光燈。", "hl": false, "note": "can 表示「可以（許可）」。"}, {"sp": "2", "en": "Don't tap on glass.", "zh": "不要拍打玻璃。", "hl": false, "note": ""}, {"sp": "3", "en": "Don't eat or drink.", "zh": "不要吃東西或喝飲料。", "hl": false, "note": ""}, {"sp": "4", "en": "Don't make any noise.", "zh": "不要發出任何噪音。", "hl": false, "note": "否定句用 any。"}, {"sp": "5", "en": "Don't run in the aquarium.", "zh": "不要在水族館裡奔跑。", "hl": false, "note": ""}, {"sp": "", "en": "OK. Let's go into the aquarium.", "zh": "好。我們進水族館吧。", "hl": false, "note": ""}]}], "grammar": [{"id": "can", "name": "助動詞 can", "icon": "💪", "c": ["CAN"], "intro": "can 放在動詞前面，表示<b>會、能、可以</b>。三條規則：①can 後面接<b>原形動詞</b> ②can 不管主詞是誰都<b>不變</b> ③否定是 <b>can't</b>（＝cannot）。", "table": [["", "寫法", "例句"], ["肯定", "主詞＋can＋原形動詞", "He can cook.／They can dance."], ["否定", "主詞＋can't＋原形動詞", "I can't dance, but my sister can."], ["🔴 常見錯誤", "can 後面加 s 或 to", "✗ He can cooks.　✗ He can to cook.　✗ He cans cook."]], "flows": [{"title": "be 動詞句 vs can 句", "steps": [{"tokens": ["He", "is", "a", "good", "cook", "."], "hl": [1], "note": "be 動詞句：主詞＋is＋名詞"}, {"tokens": ["He", "can", "cook", "."], "hl": [1, 2], "note": "can 句：can＋原形動詞 cook（不加 s）"}, {"tokens": ["He", "can't", "cook", "."], "hl": [1], "note": "否定：can't＝cannot"}]}, {"title": "課本 p.57 的 can", "steps": [{"tokens": ["I", "can", "listen", "to", "their", "songs", "again", "and", "again", "."], "hl": [1, 2], "note": "can＋listen；listen 後面接東西要加 to"}, {"tokens": ["I", "can't", "wait", "!"], "hl": [1, 2], "note": "I can't wait! 等不及了"}]}], "tutor": [{"say": "「Sam 會唱歌。」", "ch": [{"t": "Sam can sings.", "ok": false, "re": "can 後面用原形動詞，不加 s。"}, {"t": "Sam can sing.", "ok": true, "re": "對！"}, {"t": "Sam cans sing.", "ok": false, "re": "can 不管主詞是誰都不變。"}]}, {"say": "「我不會跳舞。」", "ch": [{"t": "I can't dance.", "ok": true, "re": "對！can't＝cannot。"}, {"t": "I don't can dance.", "ok": false, "re": "can 的否定直接加 not（can't），不用 don't。"}, {"t": "I can't dancing.", "ok": false, "re": "can't 後面用原形動詞。"}]}]}, {"id": "can-q", "name": "Can 問句與回答", "icon": "❓", "c": ["CAN-Q", "CAN"], "intro": "問「會不會」：<b>Can 搬到句首</b>，後面主詞＋原形動詞。回答 Yes, 代名詞＋<b>can</b>.／No, 代名詞＋<b>can't</b>.　問「會做什麼」用 <b>What can…do?</b>，問「誰會」用 <b>Who can…?</b>", "table": [["問句", "回答"], ["Can Abby walk?", "Yes, she can."], ["Can Abby jump?", "No, she can't."], ["What can Sam do?", "He can sing and dance."], ["Who can dance but can't sing?", "Ben (can)."]], "flows": [{"title": "直述句 → 問句", "steps": [{"tokens": ["Nick", "can", "make", "toys", "."], "hl": [1], "note": "直述句"}, {"tokens": ["Can", "Nick", "make", "toys", "?"], "hl": [0], "note": "Can 搬到句首，後面還是原形 make"}, {"tokens": ["Yes", ",", "he", "can", "."], "hl": [2, 3], "note": "回答用代名詞 he，不用人名"}]}, {"title": "What can…do?（課本 p.60）", "steps": [{"tokens": ["What", "can", "Sam", "do", "?"], "hl": [0, 1, 3], "note": "問會做什麼：What＋can＋主詞＋do"}, {"tokens": ["He", "can", "sing", "and", "dance", "."], "hl": [1], "note": "回答：主詞＋can＋會的事"}]}, {"title": "Who can…?：Who 當主詞", "steps": [{"tokens": ["Who", "can", "dance", "but", "can't", "sing", "?"], "hl": [0, 1, 4], "note": "Who 就是主詞，後面直接 can＋原形動詞"}, {"tokens": ["Ben", "can", "."], "hl": [0, 1], "note": "回答：人名＋can."}]}], "tutor": [{"say": "A: Can Bella cook? B: ___", "ch": [{"t": "Yes, she can.", "ok": true, "re": "對！"}, {"t": "Yes, she does.", "ok": false, "re": "can 問句用 can 回答。"}, {"t": "Yes, Bella can cook.", "ok": false, "re": "簡答用代名詞 she。"}]}, {"say": "A: What can Adam do? B: ___", "ch": [{"t": "Yes, he can.", "ok": false, "re": "What 問句不能用 Yes／No。"}, {"t": "He can sing and cook.", "ok": true, "re": "對！說出會做的事。"}, {"t": "He is sing.", "ok": false, "re": "can 句不用 be 動詞。"}]}]}, {"id": "ant", "name": "反義字（Vocabulary Skills）", "icon": "↔", "c": ["ANT"], "intro": "課本 p.56 把意思相反的字放在一起背，記一個就順便記住另一個。", "table": [["字", "反義字"], ["noisy 吵鬧的", "quiet 安靜的"], ["late 晚的", "early 早的"], ["stand up 站起來", "sit down 坐下"], ["soft 軟的", "hard 硬的"], ["young 年輕的", "old 老的"], ["upload 上傳", "download 下載"]], "flows": [{"title": "用反義字改寫", "steps": [{"tokens": ["The", "students", "are", "noisy", "."], "hl": [3], "note": "noisy 吵鬧的"}, {"tokens": ["Please", "be", "quiet", "."], "hl": [2], "note": "反過來請他們安靜 → quiet"}]}], "tutor": [{"say": "It's not early. It's ___.", "ch": [{"t": "late", "ok": true, "re": "對！early ↔ late。"}, {"t": "noisy", "ok": false, "re": "noisy 的反義字是 quiet。"}]}, {"say": "Please stand up. → 相反的動作：Please ___.", "ch": [{"t": "sit down", "ok": true, "re": "對！"}, {"t": "watch out", "ok": false, "re": "watch out 是小心。"}]}]}], "questions": [{"id": "L4:mc01", "t": "mc", "set": "mc", "c": ["CAN"], "q": "He can ___ songs.", "o": ["write", "writes", "writing", "to write"], "a": 0, "x": "can＋原形動詞。", "L": "L4"}, {"id": "L4:mc02", "t": "mc", "set": "mc", "c": ["CAN"], "q": "My sister ___ dance, but I can't.", "o": ["can", "cans", "is", "does"], "a": 0, "x": "can 不管主詞都不變。", "L": "L4"}, {"id": "L4:mc03", "t": "mc", "set": "mc", "c": ["CAN"], "q": "I ___ wait! I love BLACKPINK.", "o": ["can't", "don't can", "am not", "not can"], "a": 0, "x": "I can't wait! 等不及了。", "L": "L4"}, {"id": "L4:mc04", "t": "mc", "set": "mc", "c": ["CAN-Q"], "q": "A: Can Nick play cards?<br>B: No, he ___.", "o": ["isn't", "doesn't", "can't", "can"], "a": 2, "x": "can 問句用 can't 回答。", "L": "L4"}, {"id": "L4:mc05", "t": "mc", "set": "mc", "c": ["CAN-Q"], "q": "A: Can you cook?<br>B: ___", "o": ["Yes, I can.", "Yes, I am.", "Yes, you can.", "Yes, I do."], "a": 0, "x": "問 you，回答用 I can。", "L": "L4"}, {"id": "L4:mc06", "t": "mc", "set": "mc", "c": ["CAN-Q"], "q": "A: ___ can Sam do?<br>B: He can sing and dance.", "o": ["Who", "What", "Where", "How old"], "a": 1, "x": "問會做什麼 → What。", "L": "L4"}, {"id": "L4:mc07", "t": "mc", "set": "mc", "c": ["CAN-Q"], "q": "A: ___ can dance but can't sing?<br>B: Ben can.", "o": ["Who", "What", "Where : "can 問句用 can't 回答。", "L": "L4"}, {"id": "L4:lb4", "t": "listen", "set": "listen", "kind": "resp", "c": ["IMP"], "s": "Watch out! A car is coming!", "q": "選出最適合的回應", "o": ["Oh, thanks!", "Good idea!", "Nice to meet you."], "a": 0, "x": "被提醒，說謝謝。", "L": "L4"}, {"id": "L4:lb5", "t": "listen", "set": "listen", "kind": "resp", "c": ["PHR"], "s": "Guess what? We can go to the USA.", "q": "選出最適合的回應", "o": ["Really? That's great!", "I'm sorry.", "It's on the table."], "a": 0, "x": "回應好消息。", "L": "L4"}, {"id": "L4:lc1", "t": "listen", "set": "listen", "kind": "talk", "c": ["CAN"], "s": "W: Can you cook, Tom?|M: No, I can't. But my brother can. He can make great pizza.|Q: Who can cook?", "q": "根據對話回答問題", "o": ["Tom.", "Tom's brother.", "The woman."], "a": 1, "x": "my brother can。", "L": "L4"}, {"id": "L4:lc2", "t": "listen", "set": "listen", "kind": "talk", "c": ["IMP"], "s": "M: Ha-Joon, don't look down at your phone.|W: Sorry. I'm a real phubber.|Q: What is Ha-Joon doing?", "q": "根據對話回答問題", "o": ["Looking at her phone.", "Crossing the road.", "Singing a song."], "a": 0, "x": "don't look down at your phone。", "L": "L4"}, {"id": "L4:lc3", "t": "listen", "set": "listen", "kind": "talk", "c": ["CAN-Q"], "s": "W: What can Sam do?|M: He can sing and dance, but he can't cook.|Q: What can't Sam do?", "q": "根據對話回答問題", "o": ["Sing.", "Dance.", "Cook."], "a": 2, "x": "he can't cook。", "L": "L4"}, {"id": "L4:lc4", "t": "listen", "set": "listen", "kind": "talk", "c": ["CAN"], "s": "M: Can we take photos in the aquarium?|W: Yes, you can. But you can't use flash.|Q: What can't they do?", "q": "根據對話回答問題", "o": ["Take photos.", "Use flash.", "Go into the aquarium."], "a": 1, "x": "can't use flash。", "L": "L4"}], "reading": [{"id": "L4:r1", "title": "閱讀（一）Talent Show", "tree": "", "p": "Our class has a talent show this Friday. Here are three students. Mia can sing very well, and she can also play the piano. Leo can't sing, but he can dance. Kevin can't sing or dance, but he can do magic tricks. Guess what? Our teacher, Ms. Wang, can sing, too!<div class='gloss'>talent show 才藝表演　play the piano 彈鋼琴　magic trick 魔術</div>", "qs": [{"id": "L4:r1a", "t": "mc", "set": "read", "c": ["CAN"], "q": "What can Leo do?", "o": ["Sing.", "Dance.", "Play the piano.", "Do magic tricks."], "a": 1, "x": "Leo can't sing, but he can dance.", "L": "L4"}, {"id": "L4:r1b", "t": "mc", "set": "read", "c": ["CAN-Q"], "q": "Who can play the piano?", "o": ["Mia.", "Leo.", "Kevin.", "Ms. Wang."], "a": 0, "x": "she can also play the piano。", "L": "L4"}, {"id": "L4:r1c", "t": "mc", "set": "read", "c": ["CAN"], "q": "Which is true?", "o": ["Kevin can sing.", "Ms. Wang can't sing.", "Mia can sing and play the piano.", "Leo can do magic tricks."], "a": 2, "x": "Mia can sing… and play the piano。", "L": "L4"}]}, {"id": "L4:r2", "title": "閱讀（二）Rules for the Aquarium", "tree": "", "p": "<b>Welcome to Blue Sea Aquarium!</b><br>✅ You can take photos.　❌ You can't use flash.<br>❌ Don't tap on the glass.　❌ Don't eat or drink inside.<br>✅ You can buy drinks at the café.　❌ Please don't run.<br><i>Open: 9:00 a.m.–5:00 p.m.</i><div class='gloss'>aquarium 水族館　tap 拍打　glass 玻璃　buy 買　café 咖啡館</div>", "qs": [{"id": "L4:r2a", "t": "mc", "set": "read", "c": ["CAN", "IMP"], "q": "What can you do in the aquarium?", "o": ["Use flash.", "Take photos.", "Eat lunch inside.", "Tap on the glass."], "a": 1, "x": "You can take photos。", "L": "L4"}, {"id": "L4:r2b", "t": "mc", "set": "read", "c": ["V-ZH"], "q": "Where can you buy drinks?", "o": ["At the café.", "Inside the aquarium.", "At the door.", "You can't buy drinks."], "a": 0, "x": "buy drinks at the café。", "L": "L4"}, {"id": "L4:r2c", "t": "mc", "set": "read", "c": ["IMP"], "q": "Which is NOT a rule?", "o": ["Don't run.", "Don't use flash.", "Don't take photos.", "Don't tap on the glass."], "a": 2, "x": "拍照是可以的。", "L": "L4"}]}, {"id": "L4:r3", "title": "閱讀（三）Who Can Do What?", "tree": "", "p": "<table class='info'><tr><th></th><th>sing</th><th>dance</th><th>cook</th><th>write songs</th></tr><tr><td>Adam</td><td>✓</td><td>✗</td><td>✓</td><td>✓</td></tr><tr><td>Sam</td><td>✓</td><td>✓</td><td>✗</td><td>✗</td></tr><tr><td>Ben</td><td>✗</td><td>✓</td><td>✗</td><td>✓</td></tr></table>", "qs": [{"id": "L4:r3a", "t": "mc", "set": "read", "c": ["CAN-Q"], "q": "Who can dance but can't sing?", "o": ["Adam.", "Sam.", "Ben.", "Nobody."], "a": 2, "x": "Ben：dance ✓、sing ✗。", "L": "L4"}, {"id": "L4:r3b", "t": "mc", "set": "read", "c": ["CAN-Q"], "q": "What can Adam and Ben do?", "o": ["They can sing.", "They can dance.", "They can cook.", "They can write songs."], "a": 3, "x": "兩個人都 ✓ 的是 write songs。", "L": "L4"}]}], "teacher": [], "workbook": [], "secNotes": {"動作與聲音": "片語動詞要整組背：<b>stand up</b>（站起來）↔ <b>sit down</b>（坐下）、<b>take a photo</b>（拍照）。反義字一起背：noisy ↔ quiet、late ↔ early。can't＝cannot（不能）。", "低頭族對話": "<b>watch out</b>（小心）是祈使句，常單獨一句：Watch out!　<b>Guess what?</b>（你猜怎麼著？）用來帶出新消息。traffic lights 紅綠燈通常用複數。", "閱讀 Smart Designs": "use（使用）＋-r＝<b>user</b>（使用者）；download（下載）↔ upload（上傳，L3）。the USA 前面要加 the。<b>also</b>（也）放在 be 動詞後面、一般動詞前面：He is also good at PE.", "功能字": "<b>can</b> 後面一定接<b>原形動詞</b>，而且 can 不管主詞是誰都不變：He can dance.（✗ He cans dances.）"}, "tiles": [["🔤", "單字卡", "選類別→學習單字或拼字", "words"], ["📖", "課文", "對話＋閱讀 Smart Designs＋選讀", "text"], ["⭐", "佳句練習", "中翻英：先排字再打字", "do/best"], ["🧩", "文法", "can 肯定否定・Can 問句・What can…do?", "grammar"], ["💪", "助動詞 can", "can／can't＋原形動詞", "g/can"], ["❓", "Can 問句與回答", "Can…?・What can…do?・Who can…?", "g/can-q"], ["📄", "講義型練習", "片語・一字多義・句型…", "handout"], ["👂", "聽力", "看圖・聽音辨字・問答・對話", "listen"], ["✅", "本課小考", "16 題混合", "quiz"]]}, {"hlNote": "粉紅底線＝本站先挑的重點句（這一課的老師講義還沒拍到，拍到後會換成老師畫的句子）。", "id": "R2", "short": "Review 2", "title": "Review 2　總複習", "sub": "課本 p.67–70｜祈使句・can 的三種用法・猜猜看・耶誕節", "scope": ["L3", "L4", "R2"], "words": [{"sec": "選讀 耶誕節", "w": "Christmas", "pos": "n.", "zh": "耶誕節", "ex": "It's Christmas.", "exz": "耶誕節到了。", "pl": "", "plr": "none", "der": [], "note": "字首大寫；t 不發音", "tex": "", "posq": true, "cap": a", "title": "A. Read and Say（祈使句與 can）", "src": "課本 p.67", "lines": [{"sp": "肯定", "en": "Please be quiet, Sandy. → Sandy, please be quiet. → Sandy, be quiet, please.", "zh": "Sandy，請安靜。（三種寫法意思一樣）", "hl": false, "note": "please 可以放句首或句尾；句尾前面加逗號。名字用逗號隔開。"}, {"sp": "否定", "en": "Please don't use my phone, Sandy. → Sandy, please don't use my phone. → Sandy, don't use my phone, please.", "zh": "Sandy，請不要用我的手機。", "hl": false, "note": "否定祈使句：Don't＋原形動詞。"}, {"sp": "能力", "en": "Joe: What can your brother do? Liz: He can cook.", "zh": "Joe：你哥哥會做什麼？Liz：他會煮飯。", "hl": true, "note": "can 表示「會」（能力）。"}, {"sp": "許可", "en": "Zoe: Can I eat the cake, Dad? Dad: No, you can't.", "zh": "Zoe：爸，我可以吃蛋糕嗎？爸爸：不，妳不可以。", "hl": true, "note": "Can I…? 請求許可＝我可以……嗎？"}, {"sp": "可能性", "en": "Noise can be a problem for some people.", "zh": "噪音對某些人來說可能是個問題。", "hl": true, "note": "can be＝可能是。"}]}, {"id": "rb", "title": "B. Look and Fill In（看圖選指令）", "src": "課本 p.67", "lines": [{"sp": "A", "en": "Be quiet.", "zh": "安靜。", "hl": false, "note": ""}, {"sp": "B", "en": "Watch out!", "zh": "小心！", "hl": false, "note": ""}, {"sp": "C", "en": "Can I write here?", "zh": "我可以寫在這裡嗎？", "hl": false, "note": ""}, {"sp": "D", "en": "Please don't close the door.", "zh": "請不要關門。", "hl": false, "note": ""}]}, {"id": "rc", "title": "C. Activity（猜猜看）", "src": "課本 p.68", "lines": [{"sp": "S1", "en": "Is it an animal?", "zh": "它是動物嗎？", "hl": false, "note": ""}, {"sp": "關主", "en": "No, it isn't.", "zh": "不，它不是。", "hl": false, "note": ""}, {"sp": "S2", "en": "Is it soft or hard?", "zh": "它是軟的還是硬的？", "hl": false, "note": "or 問句要選一個回答。"}, {"sp": "關主", "en": "It's hard.", "zh": "是硬的。", "hl": false, "note": ""}, {"sp": "S3", "en": "Can I sit on it?", "zh": "我可以坐在上面嗎？", "hl": false, "note": "Can I…? 問「可不可以」。"}, {"sp": "關主", "en": "Yes, you can.", "zh": "是的，你可以。", "hl": false, "note": ""}, {"sp": "S1", "en": "It's a chair.", "zh": "它是椅子。", "hl": false, "note": ""}, {"sp": "關主", "en": "Yes, you're right.", "zh": "對，你答對了。", "hl": false, "note": ""}]}, {"id": "xm", "title": "Activities〈Christmas Around the World〉", "src": "課本 p.69–70（選讀）", "lines": [{"sp": "", "en": "It's Christmas. People are celebrating Christmas in different ways.", "zh": "耶誕節到了。人們用不同的方式慶祝耶誕節。", "hl": false, "note": ""}, {"sp": "the USA", "en": "Joyce is waiting for Santa Claus. She's preparing milk and cookies for him.", "zh": "Joyce 在等耶誕老人。她正在為他準備牛奶和餅乾。", "hl": false, "note": ""}, {"sp": "Germany", "en": "Dennis and his friends are at a Christmas market. They're shopping, eating, and drinking.", "zh": "Dennis 和朋友在耶誕市集。他們在逛街、吃東西、喝飲料。", "hl": false, "note": ""}, {"sp": "Australia", "en": "Carrie is celebrating Christmas with her friends at the beach. They're having a good time.", "zh": "Carrie 和朋友在海灘慶祝耶誕節。他們玩得很開心。", "hl": false, "note": ""}, {"sp": "", "en": "What about you? How are you celebrating Christmas?", "zh": "那你呢？你怎麼慶祝耶誕節？", "hl": false, "note": ""}]}], "grammar": [{"id": "imp3", "name": "祈使句總整理", "icon": "🙏", "c": ["IMP", "LETS"], "intro": "L3、L4 的指令句全部收在一起：<b>原形動詞開頭、省略 you</b>；否定加 <b>Don't</b>；邀請一起做用 <b>Let's</b>。", "table": [["種類", "寫法", "例句"], ["肯定", "原形動詞…", "Watch out!／Be quiet."], ["否定", "Don't＋原形動詞…", "Don't look down at your phone."], ["客氣", "Please…／…, please.", "Please be quiet, Sandy.／Sandy, be quiet, please."], ["一起做", "Let's＋原形動詞", "Let's cross the road."], ["一起不做", "Let's not＋原形動詞", "Let's not sit here."]], "flows": [{"title": "同一句話的三種寫法（課本 p.67）", "steps": [{"tokens": ["Please", "be", "quiet", ",", "Sandy", "."], "hl": [0, 4], "note": "Please 句首、名字句尾"}, {"tokens": ["Sandy", ",", "please", "be", "quiet", "."], "hl": [0, 2], "note": "名字句首"}, {"tokens": ["Sandy", ",", "be", "quiet", ",", "please", "."], "hl": [0, 5], "note": "please 句尾，前面加逗號"}]}], "tutor": [{"say": "「Sandy，請不要用我的手機。」", "ch": [{"t": "Sandy, please don't use my phone.", "ok": true, "re": "對！"}, {"t": "Sandy, please not use my phone.", "ok": false, "re": "否定祈使句要用 don't。"}, {"t": "Sandy, please doesn't use my phone.", "ok": false, "re": "祈使句一律用 don't。"}]}]}, {"id": "can3", "name": "can 的三種用法", "icon": "🎯", "c": ["CAN", "CAN-Q"], "intro": "同一個 can，看句子判斷是哪一種意思：<b>會（能力）</b>、<b>可以（許可）</b>、<b>可能（可能性）</b>。寫法都一樣：can＋原形動詞。", "table": [["用法", "例句", "怎麼認"], ["能力：會", "He can cook.", "說某人本來就會的事"], ["許可：可以", "Can I eat the cake, Dad? No, you can't.", "Can I…? 向別人要求"], ["可能性：可能", "Noise can be a problem for some people.", "常接 can be，說一般情況"]], "flows": [{"title": "Can I…? 請求許可", "steps": [{"tokens": ["Can", "I", "sit", "on", "it", "?"], "hl": [0, 1], "note": "Can I…? 我可以……嗎？"}, {"tokens": ["Yes", ",", "you", "can", "."], "hl": [2, 3], "note": "回答主詞換成 you"}]}], "tutor": [{"say": "Can I eat the cake, Dad? 這裡的 can 是什麼意思？", "ch": [{"t": "會（能力）", "ok": false, "re": "不是在問會不會吃。"}, {"t": "可以（許可）", "ok": true, "re": "對！向爸爸要求可不可以。"}, {"t": "可能（可能性）", "ok": false, "re": "不是在說可能性。"}]}, {"say": "A: Can I sit here? B: ___", "ch": [{"t": "Yes, you can.", "ok": true, "re": "對！問 I，回答用 you。"}, {"t": "Yes, I can.", "ok": false, "re": "對方問「我可以嗎」，你要回答「你可以」。"}]}]}], "questions": [{"id": "R2:mc01", "t": "mc", "set": "mc", "c": ["IMP"], "q": "Sandy, ___ quiet, please.", "o": ["is", "are", "be", "being"], "a": 2, "x": "祈使句用原形 be。", "L": "R2"}, {"id": "R2:mc02", "t": "mc", "set": "mc", "c": ["IMP"], "q": "Please ___ use my phone.", "o": ["not", "don't", "doesn't", "can"], "a": 1, "x": "否定祈使句 don't。", "L": "R2"}, {"id": "R2:mc03", "t": "mc", "set": "mc", "c": ["CAN-Q"], "q": "A: ___ I eat the cake, Dad?<br>B: No, you can't.", "o": ["Do", "Am", "Can", "Is"], "a": 2, "x": "請求許可 Can I…?", "L": "R2"}, {"id": "R2:mc04", "t": "mc", "set": "mc", "c": ["CAN-Q"], "q": "A: Can I sit on it?<br>B: Yes, ___", "o": ["I can.", "you can.", "it can.", "you are."], "a": 1, "x": "問 I，回答 you can。", "L": "R2"}, {"id": "R2:mc05", "t": "mc", "set": "mc", "c": ["CAN"], "q": "Noise can ___ a problem for some people.", "o": ["is", "be", "are", "being"], "a": 1, "x": "can＋原形 be。", "L": "R2"}, {"id": "R2:mc06", "t": "mc", "set": "mc", "c": ["CONJ"], "q": "A: Is it soft ___ ha let flushing = false;
async function flushLog(leaving){
  if (!LOG_URL || flushing || !LQ.length || navigator.onLine === false) return;
  flushing = true;
  const batch = LQ.slice(0, leaving ? 30 : 200);   // 離開頁面時用 keepalive，內容不能太大
  try {
    // text/plain 是「簡單請求」，不觸發 CORS 預檢；Apps Script 會 302 轉址，fetch 自動跟隨
    const r = await fetch(LOG_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({app:"k7v2", events:batch}), redirect:"follow", keepalive:!!leaving});
    const j = await r.json();
    if (j && j.ok){
      const done = new Set(batch.map(e=>e.id)); LQ = LQ.filter(e=>!done.has(e.id)); saveLQ();
      flushing = false; if (LQ.length && !leaving) return flushLog();
    }
  } catch(e){}
  flushing = false;
}

let VOICE = null;
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  VOICE = vs.find(v=>/Google|Samantha|Aria|Jenny|Zira/i.test(v.name)) || vs[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, opt={}){
  return new Promise(res=>{
    if (!("speechSynthesis" in window)) return res();
    const u = new SpeechSynthesisUtterance(text);
    u.lang="en-US"; if (VOICE) u.voice=VOICE;
    u.rate = opt.rate || 0.85; u.pitch = opt.pitch || 1;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
async function speakTalk(script){
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  for (const part of script.split("|")){
    const m = part.match(/^(W|M|Q):\s*(.*)$/);
    if (!m){ await speak(part); continue; }
    const pitch = m[1]==="W" ? 1.3 : m[1]==="M" ? 0.75 : 1;
    await speak((m[1]==="Q" ? "Question. " : "") + m[2], {pitch});
    await new Promise(r=>setTimeout(r,350));
  }
}

/* ───────── 家庭樹：關係計算 ───────── */
function famMap(F){ const m={}; F.people.forEach(p=>m[p.id]=p); return m; }
function siblings(m, id){ const p=m[id]; if(!p.par.length) return [];
  return Object.values(m).filter(q=>q.id!==id && q.par.some(x=>p.par.includes(x))).map(q=>q.id); }
function rel(F, a, b){ // a 是 b 的什麼人
  const m = famMap(F), A=m[a], B=m[b]; if(!A||!B||a===b) return null;
  const g = (mw,fw)=> A.sex==="m"?mw:fw;
  if (A.sp===b) return g("husband","wife");
  if (B.par.includes(a)) return g("father","mother");
  if (A.par.includes(b)) return g("son","daughter");
  if (siblings(m,a).includes(b)) return g("brother","sister");
  if (B.par.some(p=>m[p].par.includes(a))) return g("grandfather","grandmother");
  if (A.par.some(p=>m[p].par.includes(b))) return g("grandson","granddaughter");
  const bParSibs = B.par.flatMap(p=>siblings(m,p));
  if (bParSibs.includes(a) || bParSibs.some(s=>m[s].sp===a)) return g("uncle","aunt");
  if (A.par.some(p=>bParSibs.includes(p))) return "cousin";
  // uncle／aunt 的反方向（課外字，只顯示不出題）
  if (A.par.some(p=>siblings(m,p).includes(b) || siblings(m,p).some(s=>m[s].sp===b))) return g("nephew","niece");
  return null;
}
const EXTRA = {nephew:"姪子／外甥", niece:"姪女／外甥女"};
const REL_M = ["father","son","brother","husband","grandfather","grandson","uncle","cousin"];
const REL_F = ["mother","daughter","sister","wife","grandmother","granddaughter","aunt","cousin"];

function treeSVG(F, sel=[]){
  const m=famMap(F), W=66, H=120, R=23, ox=6, oy=30;
  const X=p=>ox+p.x*W+W/2, Y=p=>oy+p.y*H;
  const maxx=Math.max(...F.people.map(p=>p.x)), maxy=Math.max(...F.people.map(p=>p.y));
  let s=`<svg viewBox="0 0 ${ox*2+(maxx+1)*W} ${oy+maxy*H+80}" role="img" aria-label="${esc(F.title)}">`;
  const done=new Set();
  F.people.forEach(p=>{ if(p.sp && !done.has(p.sp)){ done.add(p.id); const q=m[p.sp];
    s+=`<line x1="${X(p)}" y1="${Y(p)}" x2="${X(q)}" y2="${Y(q)}" stroke="var(--ink-3)" stroke-width="2"/>`; }});
  const groups={};
  F.people.forEach(p=>{ if(p.par.length){ const k=p.par.slice().sort().join("+"); (groups[k]=groups[k]||[]).push(p);} });
  Object.entries(groups).forEach(([k,kids])=>{
    const [a,b]=k.split("+").map(i=>m[i]); const mx=(X(a)+X(b))/2, py=Y(a), by=py+H*0.55;
    const xs=kids.map(X); const x1=Math.min(...xs,mx), x2=Math.max(...xs,mx);
    s+=`<g stroke="var(--ink-3)" stroke-width="1.5" opacity=".7"><line x1="${mx}" y1="${py}" x2="${mx}" y2="${by}"/><line x1="${x1}" y1="${by}" x2="${x2}" y2="${by}"/>`;
    kids.forEach(c=>s+=`<line x1="${X(c)}" y1="${by}" x2="${X(c)}" y2="${Y(c)-R}"/>`); s+=`</g>`;
  });
  F.people.forEach(p=>{
    const on = sel.indexOf(p.id);
    const fill = on===0 ? "var(--accent)" : on===1 ? "var(--accent-line)" : "var(--surface-2)";
    s+=`<g class="pn" data-p="${p.id}"><circle cx="${X(p)}" cy="${Y(p)}" r="${R}" fill="${fill}" stroke="${on>=0?"var(--accent)":"var(--line)"}" stroke-width="${on>=0?2.5:1.5}"/>`+
       `<text x="${X(p)}" y="${Y(p)+6}" text-anchor="middle" font-size="18">${p.sex==="m"?"👦":"👧"}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+19}" text-anchor="middle" font-size="19" font-weight="700" fill="currentColor">${p.id}</text>`+
       `<text x="${X(p)}" y="${Y(p)+R+37}" text-anchor="middle" font-size="15" fill="var(--ink-3)">${p.age}</text></g>`;
  });
  return s+"</svg>";
}
function famQuestions(F, n){
  const ids=F.people.map(p=>p.id), out=[], seen=new Set();
  let guard=0;
  while(out.length<n && guard++<500){
    const a=ids[Math.floor(Math.random()*ids.length)], b=ids[Math.floor(Math.random()*ids.length)];
    const r=rel(F,a,b); if(!r || EXTRA[r]) continue;
    const kind=["word","flip","who"][Math.floor(Math.random()*3)];
    const key=kind+a+b; if(seen.has(key)) continue; seen.add(key);
    const A=famMap(F)[a], pool=(A.sex==="m"?REL_M:REL_F).filter(x=>x!==r);
    if(kind==="word"){
      const o=shuffle([r,...pick(pool,3)]);
      out.push({id:`fam:${F.id}:w:${a}:${b}`,t:"mc",c:["FAM-WORD"],tree:F.id,q:`${a} is ${b}'s ___.`,o,a:o.indexOf(r),
        x:`看家庭樹：${a} 是 ${b} 的 <b>${r}</b>。`});
    } else if(kind==="flip"){
      const r2=rel(F,b,a); if(!r2 || EXTRA[r2]) continue;
      const B=famMap(F)[b]; const pool2=(B.sex==="m"?REL_M:REL_F).filter(x=>x!==r2);
      const o=shuffle([r2,...pick(pool2,3)]);
      out.push({id:`fam:${F.id}:f:${a}:${b}`,t:"mc",c:["FAM-FLIP"],tree:F.id,q:`${a} is ${b}'s ${r}.<br>So ${b} is ${a}'s ___.`,o,a:o.indexOf(r2),
        x:`換 ${b} 當主詞：${b} 是${B.sex==="m"?"男生":"女生"} → <b>${r2}</b>。`});
    } else {
      const ans=ids.filter(i=>rel(F,i,b)===r); if(ans.length!==1) continue;
      const o=shuffle([a,...pick(ids.filter(i=>i!==a&&i!==b),3)]);
      out.push({id:`fam:${F.id}:h:${a}:${b}`,t:"mc",c:["FAM-WORD","WH"],tree:F.id,q:`Who is ${b}'s ${r}?`,o,a:o.indexOf(a),
        x:`${b}'s ${r} 是 <b>${a}</b>。`});
    }
  }
  return out;
}

const QBY = {}; QS.forEach(q=>QBY[q.id]=q);
const FAM = D.families;
const posq = ALLW.filter(w=>w.posq);
const inL = (q, ids) => ids.includes(q.L);
function spellQ(w){ return {id:"sp:"+w.w, t:"spell", c:["V-SP","V-ZH"].concat(w.posq?["V-POS"]:[]), w}; }
function meanQ(w){ return {id:"mn:"+w.L+":"+w.w, t:"meaning", c:["V-ZH"], w, L:w.L}; }   // 字義辨識：看英文、聽發音，選中文
function zhQ(w){ return {id:"ze:"+w.w, t:"fill", c:["V-SP"], q:`${w.zh}（${w.pos}）→ ___`, a:[w.w], x:`${w.w}：${w.zh}`}; }
function poolFor(code){
  let p = QS.filter(q=>q.c.includes(code));
  if (code==="FAM-WORD"||code==="FAM-FLIP") p = p.concat(famQuestions(FAM.nick,6).filter(q=>q.c.includes(code)));
  if (code==="V-SP") p = p.concat(pick(ALLW,6).map(spellQ));
  if (code==="V-ZH") p = p.concat(pick(ALLW,6).map(meanQ));   // 中文字義的加練用字義辨識題（看英文聽發音選中文）
  if (code==="V-POS") p = p.concat(pick(posq,6).map(spellQ));
  if (code==="MECH") p = p.concat(pick(QS.filter(q=>q.t==="order"),3));
  return p;
}

function record(q, okByConcept){ // okByConcept: {code: bool}
  for (const [c,ok] of Object.entries(okByConcept)){
    const s = S.stats[c] || (S.stats[c]={n:0,w:0}); s.n++; if(!ok) s.w++;
  }
  // 大小寫標點（MECH）只提醒、另外記統計，不影響這題的對錯
  const allOk = Object.entries(okByConcept).filter(([c])=>c!=="MECH").every(([,v])=>v);
  if (!allOk){ S.wrong[q.id] = {q, s:0}; }
  else if (S.wrong[q.id]){ S.wrong[q.id].s++; if (S.wrong[q.id].s>=2) delete S.wrong[q.id]; }
  save(); return allOk;
}

function diffHTML(got, want){
  got=String(got||""); want=String(want||"");
  if (loose(got)===loose(want)) return `<span style="color:var(--ok);font-weight:600">${esc(got)}</span>`;
  const a=got, b=want, n=a.length, m=b.length;
  // LCS 對齊（字很短，直接 DP）
  const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--)
    dp[i][j] = a[i].toLowerCase()===b[j].toLowerCase() ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  let i=0, j=0, out="";
  while (i<n || j<m){
    if (i<n && j<m && a[i].toLowerCase()===b[j].toLowerCase()){ out+=esc(a[i]); i++; j++; }
    else if (j<m && (i>=n || dp[i][j+1]>=dp[i+1][j])){ out+=`<span class="dmiss">${esc(b[j])}</span>`; j++; }   // 漏掉的字母
    else { out+=`<span class="dbad">${esc(a[i])}</span>`; i++; }                                              // 多打或打錯的字母
  }

      got.filter(t=>!toks.includes(t)).forEach(d=>{ const c=toks.find(t=>CONF[t]===d); why.push(confReason(c, d)); });
      const i=got.findIndex((t,k)=>t!==toks[k] && toks.includes(t));
      if (i>=0) why.push(`第 <b>${i+1}</b> 個位置不對：這裡應該放一個「<b>${roleOf(toks[i])}</b>」。`);
      else if (got.length<toks.length && got.every((t,k)=>t===toks[k])) why.push(`前面都對了，接下來第 <b>${got.length+1}</b> 個應該放一個「<b>${roleOf(toks[got.length])}</b>」。`);
    }
    const [tn, tr]=sentenceType(q.en);
    why.push(`這句是「${tn}」：${tr}`);
    $("#p1fb").innerHTML=`<div class="verdict ng">❌ 答錯了（第 ${tries} 次）</div>
      <div class="fb ng" style="margin-top:8px">${why.map(x=>`<div>・${x}</div>`).join("")}<div style="margin-top:8px"><b>把紅色的字卡拖曳調整好，再按「送出」。</b></div></div>`;
    if (!$("#peek")){   // 答錯一次就能看正確順序（使用者 10/4 要求：不要卡著看不到答案）
      $("#p1btns").insertAdjacentHTML("beforeend", `<button class="btn ghost" id="peek">👀 看正確順序</button>`);
      $("#peek").onclick=()=>{ $("#p1fb").insertAdjacentHTML("beforeend", `<div class="fb warn reveal">正確順序：<b>${esc(q.en)}</b>　照著排好再按送出。</div>`); $("#peek").remove(); };
    }
  };
  function startPhase2(){
    const good = tries===0;
    $("#p1btns").remove(); $("#poolrow").remove();
    // 第 2 步：一個字一個空格（格子長短＝字的長短），標點已經印好；空白鍵、Enter 都不會跳格或送出，只有按「送出」才批改
    const words = q.en.split(" ").map(w=>{ const m=w.match(/^(.*?)([,.?!]*)$/); return {core:m[1], p:m[2]}; });
    // 第 1 步顯示過的正確順序先模糊，避免直接照抄；點一下可以偷看
    box.querySelectorAll(".reveal").forEach(p1=>{ p1.style.filter="blur(6px)"; p1.style.cursor="pointer"; p1.title="點一下偷看";
      p1.onclick=()=>{ p1.style.filter = p1.style.filter ? "" : "blur(6px)"; }; });
    $("#ph2").insertAdjacentHTML("beforeend", `<div class="sub" style="margin-top:16px">第 2 步：${good?"排對了！":""}不看字卡，在每個空格打一個字（注意大寫）。打完按「送出」。<b>這一步可以不寫</b>，按「跳過，下一題」直接往下。</div>
      <div class="wb" id="wb">${words.map((w,i)=>`<span class="wbw"><input class="wbi" data-i="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
        style="width:calc(${Math.max(2,w.core.length)}ch + 24px)"><span class="wbp">${esc(w.p)}</span></span>`).join("")}</div>
      <div id="retry"></div><div class="row"><button class="btn" id="go">送出</button><button class="btn ghost" id="skip2">跳過，下一題 →</button></div>`);
    $("#ansrow").style.opacity=".25"; $("#ansrow").style.filter="blur(5px)";
    const boxes=[...box.querySelectorAll(".wbi")];
    boxes.forEach(b=>b.addEventListener("keydown", e=>{ if (e.key===" " || e.key==="Enter") e.preventDefault(); }));
    boxes.forEach(b=>b.addEventListener("input", ()=>{ if (/\s/.test(b.value)) b.value=b.value.replace(/\s+/g,""); b.classList.remove("ok","ng"); }));
    boxes[0].focus();
    // 打錯要一直練到打對才能下一題；弱點統計只記第一次的對錯
    let firstOk, tries2=0;
    const go=()=>{

        // 答錯立刻給看正確句子（兩行大字對照），看著把紅色格子改好再送出
        $("#retry").innerHTML=`<div class="verdict ng">❌ 答錯了（第 ${tries2} 次）：有 ${bad} 格不對</div>
          <div class="ya is-ng"><div class="ya-row"><span class="ya-lab">你寫的</span><span class="ya-val">${mine}</span></div>

      const v=words.map((w,i)=>vals[i]+w.p).join(" ");

      const zh = (q.set==="best" || q.tsec==="best") ? q.zh : "";
      if (document.activeElement) document.activeElement.blur();   // 避免空白鍵直接觸發「下一題」
      afterAnswer(q, m, box, `${firstOk?"":"練到正確了！第一次答錯，已收進錯題本。"}${yourAnswer(v, q.en, true)}${q.alt.length?`<span class="eg">也可以：${q.alt.map(esc).join("／")}</span>`:""}${q.x?"<br>"+q.x:""}${extra}${explainHTML(q.en, zh)}`, v);
    };
    $("#go").onclick=go;
    // 跳過第 2 步（10/7 使用者定）：這題的對錯只看第 1 步排字；打錯過也照第一次的結果記
    $("#skip2").onclick=()=>{

      const m={}; q.c.forEach(c=>m[c]=phase1ok && firstOk!==false);

    };
  }
}
// 排句子答錯時，說明「這個位置應該放哪一種字」（不直接講答案）
function roleOf(token){
  const t=String(token||"").replace(/[,.?!]/g,""), lo=t.toLowerCase().replace(/’/g,"'");
  if (["am","is","are","isn't","aren't"].includes(lo)) return "be 動詞";
  if (["who","what","how","who's","what's"].includes(lo)) return "疑問詞";
  if (/^(i'm|he's|she's|it's|that's|you're|we're|they're)$/.test(lo)) return "主詞＋be 動詞（縮寫）";
  if (["i","you","he","she","it","we","they","this","that","these","those"].includes(lo)) return "主詞（代名詞）";
  if (["my","your","his","her","its","our","their"].includes(lo) || /'s$|s'$/.test(lo)) return "所有格（誰的）";
  if (["a","an","the"].includes(lo)) return "冠詞（a／an／the）";
  if (["and","but","or"].includes(lo)) return "連接詞";
  if (lo==="not") return "not（否定）";
  if (lo==="too") return "too（也）";
  if (/^\d/.test(lo)) return "數字";
  const e=wmap()[lo];
  if (e) return {"n.":"名詞","adj.":"形容詞","v.":"動詞","adv.":"副詞","conj.":"連接詞","pron.":"代名詞"}[e.w.pos] || "字";
  if (/^[A-Z]/.test(t)) return "人名或專有名詞";
  return "字";
}
function confReason(c, d){
  const lc=String(c||"").toLowerCase(), ld=String(d).toLowerCase();
  if (["is","are","am","isn't","aren't"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：be 動詞要跟主詞搭配（I → am；he、she、it、單數名詞 → is；you、we、they、複數名詞 → are）。`;
  if (["a","an"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：看<b>緊接在後面那個字</b>的發音，母音開頭用 an，子音開頭用 a。`;
  if (["he","his","she","her","they","their"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：當主詞（後面接 be 動詞）用 he／she／they；後面接名詞要用所有格 his／her／their。`;
  if (["who","what"].includes(ld)) return `干擾卡「<b>${esc(d)}</b>」不對：問「人」用 Who，問「東西、名字」用 What。`;
  return `干擾卡「<b>${esc(d)}</b>」不對：注意單複數和特殊複數的拼法（children、women、men 不加 s；兩個以上要用複數）。`;
}

function worstConcept(items){
  const miss={};
  items.forEach(r=>Object.entries(r.okByConcept).forEach(([c,ok])=>{ if(!ok) miss[c]=(miss[c]||0)+1; }));
  const rate=c=>{const s=S.stats[c]; return s&&s.n? s.w/s.n : 0;};
  const arr=Object.keys(miss).sort((a,b)=>miss[b]-miss[a] || rate(b)-rate(a));
  return arr.length ? {code:arr[0], miss:miss[arr[0]]} : null;
}
function stepWidget(flow, id){
  return `<div class="card" id="${id}" data-i="0"><b>${flow.title}</b><div class="chips"></div><div class="stepnote"></div>
    <div class="row"><button class="btn ghost small" data-act="prev">◀ 上一步</button><button class="btn small" data-act="next">下一步 ▶</button><span class="muted sc"></span></div></div>`;
}
function bindStep(flow, id){
  const el=$("#"+id); if(!el) return;
  const draw=()=>{ const i=+el.dataset.i, st=flow.steps[i];
    el.querySelector(".chips").innerHTML = st.tokens.map((t,k)=>`<span class="chipw ${st.hl.includes(k)?"on":""}">${esc(t)}</span>`).join("");
    el.querySelector(".stepnote").innerHTML = st.note;
    el.querySelector(".sc").textContent = `${i+1} / ${flow.steps.length}`;
    el.querySelector('[data-act="prev"]').disabled = i===0;
    el.querySelector('[data-act="next"]').disabled = i===flow.steps.length-1; };
  el.querySelector('[data-act="prev"]').onclick=()=>{ el.dataset.i=Math.max(0,+el.dataset.i-1); draw(); };
  el.querySelector('[data-act="next"]').onclick=()=>{ el.dataset.i=Math.min(flow.steps.length-1,+el.dataset.i+1); draw(); };
  draw();
}

function meanPool(scope){ return scope==="all" ? ALLW : scope.rng ? wordsOf(scope.rng) : scope.sec!==undefined ? LS.words.filter(w=>w.sec===scope.sec) : LESSONS.find(l=>l.id===scope.L).words; }
function meanKey(scope){ return scope==="all" ? "all" : scope.rng ? LS.id+"/"+scope.rng : scope.sec!==undefined ? LS.id+"/"+scope.sec : scope.L; }
function meanProgress(scope){ const seen=(S.mnSeen||{})[meanKey(scope)]||[]; const pool=meanPool(scope); return {done: pool.filter(w=>seen.includes(w.L+":"+w.w)).length, total: pool.length}; }
function meanRound(scope, back, title){
  const key=meanKey(scope), pool=meanPool(scope);
  S.mnSeen = S.mnSeen||{}; let seen=S.mnSeen[key]||[];
  let left = pool.filter(w=>!seen.includes(w.L+":"+w.w));
  if (!left.length){ seen=[]; S.mnSeen[key]=seen; save(); left=pool.slice(); }   // 一圈輪完 → 從頭再來
  const batch = pick(left, Math.min(10, left.length));
  // 這一批進入回合就算練過（答錯的會進錯題本，另外再追）
  S.mnSeen[key] = seen.concat(batch.map(w=>w.L+":"+w.w)); save();
  startQuiz({title:"字義辨識"+(title?`・${title}`:""), qs:batch.map(meanQ), checkpoint:true, back});
}

  const g=$("#go"); if(g) g.onclick=()=>startQuiz({title:"錯題本複習", qs:shuffle(list.map(x=>x.q)).slice(0,16), checkpoint:true, back:"#/wrong"});
}
function examReads(n, scope){
  // 閱讀題組整組出，湊剛好 n 題（題組大小 2–5，隨機找組合）；scope＝這次段考的課次
  const groups=Object.values(READ).filter(g=>!scope || scope.includes(g.qs[0].L));
  for (let k=0;k<300;k++){
    let sum=0, pickG=[];
    for (const g of shuffle(groups)){ if (sum+g.qs.length<=n){ pickG.push(g); sum+=g.qs.length; } if (sum===n) break; }
    if (sum===n) return pickG.flatMap(g=>g.qs);
  }
  return groups.flatMap(g=>g.qs).slice(0,n);
}
const EXAM_SCOPE = {1:["L1","L2","R1"], 2:["L3","L4","R2"]};
function vExam(k){
  k = k===2 ? 2 : 1; const SC=EXAM_SCOPE[k], scName = k===2 ? "Lesson 3、Lesson 4、Review 2" : "Lesson 1、Lesson 2、Review 1";
  page(`📝 段考模擬（第${k===2?"二":"一"}次）`, `<div class="card"><p>照歷屆七上第一次段考（113 學年卷為主）的題型和配分：</p>
    <table><tr><th>大題</th><th>題數</th><th>配分</th></tr>
    <tr><td>聽力</td><td>${D.exam.listen}</td><td>30%</td></tr><tr><td>綜合選擇</td><td>${D.exam.mc}</td><td>40%</td></tr>
    <tr><td>閱讀</td><td>${D.exam.read}</td><td>20%</td></tr><tr><td>手寫</td><td>${D.exam.hand}</td><td>10%</td></tr></table>
    <p class="sub">範圍：${scName}，每次隨機組卷。模擬考中途<b>不顯示對錯</b>，交卷後再看成績、錯題和弱點。</p>
    <button class="btn" id="go">開始考試</button></div>`, "#/");
  $("#go").onclick=()=>{
    const tag=(arr,sec)=>arr.map(q=>Object.assign({},q,{sec}));
    const order={pic:0,word:1,resp:2,talk:3};
    const inS=q=>inL(q, SC);
    const lis=pick(QS.filter(q=>q.t==="listen" && inS(q)),D.exam.listen).sort((a,b)=>order[a.kind]-order[b.kind]);
    const qs=[...tag(lis,"listen"),
      ...tag(pick(QS.filter(q=>q.set==="mc" && inS(q)),D.exam.mc),"mc"),
      ...tag(examReads(D.exam.read, SC),"read"),
      ...tag(pick(QS.filter(q=>q.set==="hand" && inS(q)),D.exam.hand),"hand")];
    startQuiz({title:`段考模擬（第${k===2?"二":"一"}次）`, qs, exam:true, checkpoint:false, back: k===2?"#/exam/2":"#/exam"});
  };
}

/* ───────── 老師講義（原題＋答案）───────── */
function qBody(q){
  if (q.t==="mc") return `${blankify(q.q)}<div class="sub" style="margin-top:4px">${q.o.map((o,i)=>`(${"ABCD"[i]}) ${o}`).join("　")}</div>`;
  if (q.t==="order") return q.zh;
  return blankify(q.q);
}
// 老師講義（kind="teacher"）和習作（kind="workbook"）共用同一個畫面
const SECK = {teacher:{icon:"📝", name:"老師講義", src:"老師講義"}, workbook:{icon:"📒", name:"習作", src:"習作"}};
function vTeacher(secId, mode, kind="teacher"){
  const K=SECK[kind], base=`#/${LS.id}/${kind}`;
  const T=LS[kind]||[]; if(!T.length) return route("#/");
  if (!secId){
    page(`${K.name}（附答案）`, `<p class="sub">照${K.name}的大題順序。每一大題可以先<b>自己作答</b>（答錯會進錯題本和弱點統計），或直接<b>看答案和解析</b>。</p>
      <div class="tiles">${T.map(s=>tile(K.icon,s.title,`${s.page}・${s.ids.length} 題`,`${base}/${s.id}`)).join("")}</div>`, "#/");
    return;
  }
  const s=T.find(x=>x.id===secId); if(!s) return route(base);
  const qs=s.ids.map(id=>QBY[id]).filter(Boolean);
  if (mode==="do") return startQuiz({title:s.title, qs, checkpoint:true, back:`${base}/${s.id}`});
  page(s.title, `<div class="row"><button class="btn" onclick="location.hash='${base}/${s.id}/do'">✏ 自己作答（${qs.length} 題）</button>
      <button class="btn ghost" id="all">👀 全部顯示答案</button></div>
    <p class="sub">${s.page}。點每一題的「看答案」可以只看那一題。</p>
    <div class="card">${qs.map((q,i)=>`<div class="line"><b class="sp">${i+1}</b><div style="flex:1">
      <div>${qBody(q)}</div>
      <button class="btn ghost small ans-btn">看答案</button>
      <div class="ans" style="display:none"><div class="fb ok">✔ <b>${q.t==="mc"?`(${"ABCD"[q.a]}) `:""}${ansText(q)}</b>${q.t==="order"&&q.alt.length?`<span class="eg">也可以：${q.alt.map(esc).join("／")}</span>`:""}${q.t==="fill"&&q.a.length>1?`<span class="eg">也接受：${q.a.slice(1).map(esc).join("／")}</span>`:""}${q.x?`<span class="eg">💡 ${q.x}</span>`:""}</div>${q.t==="order"?explainHTML(q.en, q.tsec==="best"?q.zh:""):""}</div>
    </div></div>`).join("")}</div>`, base);
  app.querySelectorAll(".ans-btn").forEach(b=>b.onclick=()=>{ b.nextElementSibling.style.display="block"; b.remove(); });
  $("#all").onclick=()=>{ app.querySelectorAll(".ans").forEach(a=>a.style.display="block"); app.querySelectorAll(".ans-btn").forEach(b=>b.remove()); };
}

/* ───────── 路由 ───────── */
function route(h){
  if (h!==undefined && location.hash!==h){ location.hash=h; return; }
  const p=(location.hash||"#/").slice(2).split("/");
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  logEv({k:"view", page: p[0]==="quiz" ? (QZ ? "作答："+QZ.title : "作答") : (location.hash||"#/").slice(1) || "/"});
  if (p[0]==="quiz") return renderQuiz();
  QZ=null;
  if (!p[0]) return vHome();
  if (p[0]==="weak") return p[1]?vWeakOne(p[1]):vWeak();
  if (p[0]==="wrong") return vWrong();
  if (p[0]==="exam") return vExam(p[1]==="2"?2:1);
  if (p[0]==="vocab"){
    if (!p[1]) return vMeaning();
    if (p[1]==="all") return meanRound("all", "#/vocab", "全部");
    if (LBY[p[1]]){ LS=LBY[p[1]]; return meanRound({L:p[1]}, "#/vocab", LS.short||LS.title); }
    return vMeaning();
  }
  if (LBY[p[0]]){
    LS = LBY[p[0]]; setLast(LS.id);
    if (!p[1]) return vHome();
    if (p[1]==="spell") return spellRound(null, "#/");
    if (p[1]==="words"){
      if (p[2]===undefined) return vWords();
      if (p[3]==="learn") return vWordLearn(p[2], p[4]);
      if (p[3]==="spell") return spellRound(p[2]==="all"?null:rangeOf(p[2])?p[2]:secsOf()[+p[2]], `#/${LS.id}/words/${p[2]}`);
      if (p[3]==="meaning") return meanRound(p[2]==="all"?{L:LS.id}:rangeOf(p[2])?{rng:p[2]}:{sec:secsOf()[+p[2]]}, `#/${LS.id}/words/${p[2]}`, secName(p[2]));
      return vWordSec(p[2]);
    }
    if (p[1]==="text") return p[2]?vText(p[2]):vTextList();
    if (p[1]==="grammar") return vGrammarList();
    if (p[1]==="g") return vGrammar(p[2]);
    if (p[1]==="handout") return vHandout();
    if (p[1]==="teacher") return vTeacher(p[2], p[3]);
    if (p[1]==="workbook") return vTeacher(p[2], p[3], "workbook");
    if (p[1]==="do") return vDo(p[2]);
    if (p[1]==="quiz") return vQuiz();
    if (p[1]==="listen") return vListen();
    if (p[1]==="ls") return vLs(p[2]);
  }
  vHome();
}
window.addEventListener("hashchange", ()=>route());
route();

if ("serviceWorker" in navigator && /^https:|localhost|127\.0\.0\.1/.test(location.href)){
  navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
  // 分頁一直開著時，切題目只換 # 後面、頁面不會重新載入 → 定期向伺服器比對版本，有新版就提示更新
  const checkUpdate = async ()=>{
    try{
      const t = await (await fetch("./?v="+Date.now(), {cache:"no-store"})).text();
      const m = t.match(/const BUILD = "([^"]*)"/);
      if (m && m[1]!==BUILD && !document.getElementById("upd")){
        document.body.insertAdjacentHTML("afterbegin", `<div id="upd" style="position:fixed;left:16px;right:16px;bottom:16px;z-index:99;background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;box-shadow:var(--sh-2);display:flex;gap:8px;align-items:center;justify-content:space-between">
          <span>🔄 有新版本（${m[1]}）</span><button class="btn" style="background:#fff;color:var(--accent);margin:0" onclick="location.reload()">點這裡更新</button></div>`);
      }
    }catch(e){}
  };
  setTimeout(checkUpdate, 3000); setInterval(checkUpdate, 5*60*1000);
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible") checkUpdate(); });
  // 新版接手時自動重新載入一次，手機不用開兩次才換新版
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(!reloaded && navigator.serviceWorker.controller){ reloaded=true; location.reload(); } });
}
</script>
